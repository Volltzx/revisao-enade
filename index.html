{n:1,q:'No Scrum, quem é responsável por priorizar o Product Backlog?',a:['*Product Owner','Scrum Master','Developers','Gerente de projetos','Cliente final diretamente'],e:'O PO maximiza o valor do produto ordenando os itens do backlog.'},
{n:2,q:'No diagrama de classes UML, o relacionamento em que a parte não existe sem o todo (por exemplo, Pedido e ItemPedido) é a:',a:['*composição','agregação','associação simples','generalização','dependência'],e:'Composição (losango preenchido): o ciclo de vida da parte depende do todo. Na agregação (losango vazio) a parte existe independentemente.'},
{n:2,q:'Uma startup desenvolve um aplicativo com requisitos que mudam a cada semana e precisa entregar valor rapidamente. O processo mais indicado é:',a:['*um método ágil, como Scrum, com entregas incrementais curtas','cascata, pela documentação completa antecipada','modelo em V, pelo foco em verificação formal','espiral com ciclos anuais','codificar e consertar, sem processo'],e:'Ágeis acolhem mudança e entregam incrementos frequentes. Cascata supõe requisitos estáveis.'},
{n:3,q:'Em um diagrama de casos de uso, “Realizar Pagamento” sempre executa “Validar Cartão”, e opcionalmente pode executar “Aplicar Cupom”. Os relacionamentos corretos são:',a:['*Realizar Pagamento «include» Validar Cartão; Aplicar Cupom «extend» Realizar Pagamento','Realizar Pagamento «extend» Validar Cartão; Aplicar Cupom «include» Realizar Pagamento','ambos «include»','ambos «extend»','generalização entre os três casos de uso'],e:'Include: comportamento obrigatório reutilizado, seta do base para o incluído. Extend: comportamento opcional, seta do extensor para o base.'}]});

S({id:'es2',nome:'Engenharia de Software II',per:5,cr:4,area:'Dados e engenharia de software',
trilha:[
['Verificação e validação','Verificação: “construímos o produto corretamente?”. Validação: “construímos o produto certo?”. Níveis: unidade, integração, sistema, aceitação. Testes de regressão após mudanças.'],
['Técnicas de teste','<b>Caixa-preta</b> (funcional): partição de equivalência, análise de valor-limite, tabela de decisão. <b>Caixa-branca</b> (estrutural): cobertura de comandos, de ramos, de caminhos. Complexidade ciclomática V(G) = E − N + 2 = decisões + 1.'],
['Arquitetura','Camadas, cliente-servidor, MVC, microsserviços (independência de deploy, mais complexidade operacional), orientada a eventos. Coesão alta e acoplamento baixo.'],
['Qualidade e manutenção','ISO/IEC 25010 (adequação funcional, confiabilidade, usabilidade, eficiência, manutenibilidade...). Manutenção corretiva, adaptativa, evolutiva/perfectiva e preventiva. Refatoração, TDD (vermelho → verde → refatora), integração contínua e DevOps.']],
foco:'Calcular complexidade ciclomática, valor-limite, tipos de manutenção e de teste.',
q:[
{n:1,q:'O teste que verifica o comportamento do software sem considerar sua estrutura interna é o teste:',a:['*caixa-preta','caixa-branca','de cobertura de ramos','de mutação estrutural','de caminho básico'],e:'Caixa-preta se baseia na especificação: entradas e saídas esperadas.'},
{n:2,q:'Um campo aceita idades de 18 a 60 anos. Pela análise de valor-limite, um bom conjunto de entradas é:',a:['*17, 18, 60 e 61','18 e 60 apenas','30 e 40','0, 100 e 1000','−1, 0 e 1'],e:'Erros se concentram nas fronteiras; testa-se o limite e o valor imediatamente fora de cada lado.'},
{n:2,q:'Adaptar um sistema para funcionar em uma nova versão do sistema operacional é um exemplo de manutenção:',a:['*adaptativa','corretiva','perfectiva','preventiva','emergencial'],e:'Adaptativa responde a mudanças no ambiente. Corretiva conserta defeitos; perfectiva adiciona ou melhora funções; preventiva melhora a manutenibilidade futura.'},
{n:3,q:'Uma função possui um <code>if</code>, um <code>while</code> e um <code>if-else</code> aninhado no while, sem outras decisões. Sua complexidade ciclomática é:',a:['*4','3','2','5','6'],e:'V(G) = número de decisões binárias + 1 = 3 + 1 = 4. Isso indica 4 caminhos independentes a serem cobertos por teste.'},
{n:3,q:'Sobre arquitetura de microsserviços, avalie:<br>I. Cada serviço pode ser implantado e escalado de forma independente.<br>II. Reduz a complexidade operacional em relação a um monólito.<br>III. Favorece que cada serviço tenha seu próprio armazenamento de dados.<br>É correto o que se afirma em:',a:['*I e III, apenas','I, apenas','II, apenas','II e III, apenas','I, II e III'],e:'II está errada: microsserviços aumentam a complexidade operacional (rede, observabilidade, consistência distribuída, deploy de muitos serviços).'}]});

S({id:'mps',nome:'Melhoria de Processos de Software',per:9,cr:4,area:'Dados e engenharia de software',
trilha:[
['Por que melhorar processos','A qualidade do produto depende da qualidade do processo. Ciclo PDCA (Plan, Do, Check, Act) e o modelo IDEAL orientam a melhoria contínua.'],
['CMMI','Representação por estágios com 5 níveis de maturidade: 1 Inicial, 2 Gerenciado, 3 Definido, 4 Quantitativamente gerenciado, 5 Em otimização.'],
['MPS.BR','Modelo brasileiro (Softex) com 7 níveis, do G (parcialmente gerenciado) ao A (em otimização). Adequado a pequenas e médias empresas por ter degraus menores.'],
['Normas e métricas','ISO/IEC 12207 (processos de ciclo de vida), ISO/IEC 15504/33000 (avaliação), ISO 9001. Métricas GQM (Goal-Question-Metric) ligam objetivos a medidas.']],
foco:'Níveis do CMMI e do MPS.BR, PDCA e GQM.',
q:[
{n:1,q:'No MPS.BR, o nível inicial de maturidade, mais baixo da escala, é o:',a:['*G — Parcialmente Gerenciado','A — Em Otimização','1 — Inicial','E — Parcialmente Definido','C — Definido'],e:'O MPS.BR vai de G (mais baixo) até A (mais alto).'},
{n:2,q:'No CMMI por estágios, o nível em que a organização controla seus processos com base em métricas e técnicas estatísticas é o:',a:['*nível 4 — Quantitativamente Gerenciado','nível 2 — Gerenciado','nível 3 — Definido','nível 5 — Em Otimização','nível 1 — Inicial'],e:'No 3 os processos são padronizados na organização; no 4 passam a ser controlados quantitativamente; no 5 há melhoria contínua e inovação.'},
{n:3,q:'Uma empresa quer reduzir defeitos em produção. Usando GQM, define a pergunta “Quantos defeitos escapam dos testes?”. A métrica coerente é:',a:['*densidade de defeitos encontrados em produção por KLOC ou por ponto de função entregue','número de linhas escritas por dia','horas extras da equipe','quantidade de reuniões por sprint','número de commits por desenvolvedor'],e:'No GQM a métrica responde à pergunta, que deriva do objetivo. As demais não medem defeitos que escapam.'}]});

S({id:'lfa',nome:'Linguagens Formais e Autômatos',per:6,cr:4,area:'Teoria da computação e compiladores',
trilha:[
['Hierarquia de Chomsky','Tipo 3 regulares (autômato finito) ⊂ tipo 2 livres de contexto (autômato de pilha) ⊂ tipo 1 sensíveis ao contexto (autômato linearmente limitado) ⊂ tipo 0 recursivamente enumeráveis (máquina de Turing).'],
['Linguagens regulares','Reconhecidas por AFD/AFN (equivalentes em poder: construção de subconjuntos) e descritas por expressões regulares. Não contam de forma ilimitada: {a<sup>n</sup>b<sup>n</sup>} não é regular (lema do bombeamento).'],
['Livres de contexto','Gramáticas com regras A → α. Autômato de pilha. Ex.: parênteses balanceados, {a<sup>n</sup>b<sup>n</sup>}. Ambiguidade: mais de uma árvore de derivação para a mesma cadeia. {a<sup>n</sup>b<sup>n</sup>c<sup>n</sup>} não é livre de contexto.'],
['Fechamento','Regulares são fechadas sob união, concatenação, estrela, interseção e complemento. LLCs são fechadas sob união, concatenação e estrela, mas não sob interseção nem complemento.']],
foco:'Ler/construir autômatos, identificar a classe de uma linguagem e propriedades de fechamento.',
q:[
{n:1,q:'Qual máquina reconhece exatamente as linguagens livres de contexto?',a:['*autômato com pilha','autômato finito determinístico','máquina de Turing com fita limitada','transdutor finito','autômato finito não determinístico'],e:'A pilha dá a memória necessária para casar símbolos aninhados.'},
{n:2,q:'A expressão regular <code>(a|b)*abb</code> descreve:',a:['*todas as cadeias sobre {a, b} que terminam em abb','cadeias que começam com abb','cadeias que contêm exatamente um abb','apenas a cadeia abb','cadeias de tamanho par'],e:'(a|b)* aceita qualquer prefixo, seguido obrigatoriamente do sufixo abb.'},
{n:2,q:'A linguagem L = {a<sup>n</sup>b<sup>n</sup> | n ≥ 0} é:',a:['*livre de contexto, mas não regular','regular','sensível ao contexto, mas não livre de contexto','não recursivamente enumerável','finita'],e:'Um autômato finito não consegue contar n ilimitado; uma pilha consegue (empilha a, desempilha com b). Gramática: S → aSb | ε.'},
{n:3,q:'Sobre propriedades de fechamento, avalie:<br>I. A interseção de duas linguagens regulares é regular.<br>II. O complemento de uma linguagem livre de contexto é sempre livre de contexto.<br>III. A interseção de uma linguagem livre de contexto com uma regular é livre de contexto.<br>É correto o que se afirma em:',a:['*I e III, apenas','I, apenas','II, apenas','II e III, apenas','I, II e III'],e:'II é falsa: LLCs não são fechadas sob complemento. III é verdadeira: basta simular o AFD junto com o autômato de pilha (produto).'},
{n:3,q:'Um AFN com 4 estados é convertido em AFD pela construção de subconjuntos. O número máximo de estados do AFD resultante é:',a:['*16','4','8','24','256'],e:'Cada estado do AFD é um subconjunto dos estados do AFN: até 2<sup>4</sup> = 16 (na prática, só os alcançáveis).'}]});

S({id:'tc',nome:'Teoria da Computação',per:8,cr:2,area:'Teoria da computação e compiladores',
trilha:[
['Máquina de Turing e Church-Turing','A MT é o modelo de computação geral. Tese de Church-Turing: tudo o que é efetivamente computável é computável por uma MT.'],
['Decidibilidade','Linguagem decidível: existe MT que sempre para dizendo sim ou não. O <b>problema da parada</b> é indecidível (prova por diagonalização). Redução: se A se reduz a B e A é indecidível, B também é.'],
['Classes P e NP','P: decidíveis em tempo polinomial por MT determinística. NP: soluções verificáveis em tempo polinomial. P ⊆ NP; se P = NP é questão em aberto.'],
['NP-completude','Problema NP-completo: está em NP e todo problema de NP se reduz polinomialmente a ele. SAT foi o primeiro (Cook-Levin). Outros: 3-SAT, clique, cobertura de vértices, caixeiro-viajante (decisão), mochila (decisão), ciclo hamiltoniano. NP-difícil não precisa estar em NP.']],
foco:'Problema da parada, direção correta das reduções e classificar problemas em P, NP, NP-completo.',
q:[
{n:1,q:'O problema da parada (halting problem) é:',a:['*indecidível','decidível em tempo polinomial','NP-completo','decidível em tempo exponencial','regular'],e:'Turing provou que nenhuma MT decide, para toda MT e entrada, se ela para.'},
{n:2,q:'Para provar que um novo problema X é NP-difícil, deve-se:',a:['*reduzir polinomialmente um problema NP-completo conhecido a X','reduzir X a um problema NP-completo conhecido','mostrar um algoritmo exponencial para X','mostrar que X está em P','verificar soluções de X em tempo polinomial'],e:'A redução vai do problema conhecido (difícil) para o novo: se X resolvesse rápido, o difícil também resolveria. Reduzir X a SAT só mostra que X não é mais difícil que SAT.'},
{n:3,q:'Analise as asserções:<br>I. Se for encontrado um algoritmo polinomial para o problema do caixeiro-viajante (versão de decisão), então P = NP.<br><b>PORQUE</b><br>II. O caixeiro-viajante (versão de decisão) é NP-completo, e todo problema em NP se reduz a ele em tempo polinomial.<br>A respeito dessas asserções, assinale a opção correta.',fix:true,a:['*As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.','As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.','A asserção I é verdadeira, e a II é falsa.','A asserção I é falsa, e a II é verdadeira.','As asserções I e II são falsas.'],e:'Resolver um NP-completo em tempo polinomial resolve todos de NP, por composição com as reduções.'}]});

S({id:'comp',nome:'Compiladores',per:7,cr:4,area:'Teoria da computação e compiladores',
trilha:[
['Fases','Análise léxica (tokens, via autômatos/expressões regulares) → sintática (árvore, via gramáticas livres de contexto) → semântica (tipos, escopo, tabela de símbolos) → código intermediário → otimização → geração de código.'],
['Análise sintática','Descendente (top-down, LL(1)): exige gramática sem recursão à esquerda e fatorada; usa conjuntos FIRST e FOLLOW. Ascendente (bottom-up, LR, SLR, LALR): mais poderosa, usada por yacc/bison, com ações shift/reduce.'],
['Erros por fase','Léxico: caractere inválido (ex.: @ solto). Sintático: falta de ; ou parêntese. Semântico: variável não declarada, tipos incompatíveis.'],
['Otimizações','Propagação e dobramento de constantes, eliminação de código morto e de subexpressões comuns, movimentação de código invariante para fora de laços, alocação de registradores.']],
foco:'Classificar erros por fase, eliminar recursão à esquerda, calcular FIRST/FOLLOW e reconhecer otimizações.',
q:[
{n:1,q:'A fase do compilador que agrupa caracteres do código-fonte em tokens é a análise:',a:['*léxica','sintática','semântica','de fluxo de dados','de otimização'],e:'O analisador léxico (scanner) reconhece identificadores, números, palavras reservadas etc.'},
{n:2,q:'Usar uma variável não declarada em Java é detectado em qual fase?',a:['*análise semântica','análise léxica','análise sintática','geração de código','ligação (linking)'],e:'Sintaticamente o identificador é válido; é a consulta à tabela de símbolos que revela a falta de declaração.'},
{n:2,q:'A regra E → E + T | T não pode ser usada diretamente em um analisador LL(1) porque:',a:['*possui recursão à esquerda, que leva o analisador descendente a laço infinito','é ambígua por natureza','não é livre de contexto','possui recursão à direita','não gera nenhuma cadeia'],e:'Reescrevendo: E → T E′ e E′ → + T E′ | ε.'},
{n:3,q:'Transformar <code>for(i=0;i&lt;n;i++){ x = y*z; a[i] = x+i; }</code> em <code>x = y*z; for(i=0;i&lt;n;i++) a[i] = x+i;</code> é um exemplo de:',a:['*movimentação de código invariante de laço','eliminação de código morto','desenrolamento de laço','propagação de cópias','alocação de registradores'],e:'y*z não muda dentro do laço, então pode ser calculado uma vez antes dele.'},
{n:3,q:'Na gramática S → A b, A → a A | ε, o conjunto FIRST(S) é:',a:['*{a, b}','{a}','{b}','{a, ε}','{a, b, ε}'],e:'FIRST(A) = {a, ε}. Como A pode ser vazio, FIRST(S) inclui FIRST(A) − {ε} mais o b que vem depois: {a, b}. S não gera ε.'}]});

S({id:'ia',nome:'Inteligência Artificial',per:7,cr:4,area:'IA e computação visual',
trilha:[
['Agentes e busca','Agente percebe e age no ambiente. Busca cega: largura (completa, ótima com custo uniforme), profundidade (pouca memória, não ótima), custo uniforme. Busca informada: gulosa (só h(n)) e <b>A*</b> (f(n) = g(n) + h(n)), ótima se a heurística for <b>admissível</b> (nunca superestima).'],
['Jogos','Minimax para jogos de soma zero; poda alfa-beta reduz nós sem mudar a decisão.'],
['Representação do conhecimento','Lógica proposicional e de primeira ordem, regras, sistemas especialistas (encadeamento para frente e para trás), ontologias.'],
['Incerteza','Probabilidade condicional e teorema de Bayes: P(A|B) = P(B|A)·P(A)/P(B). Redes bayesianas. Lógica fuzzy para graus de pertinência.']],
foco:'A* e admissibilidade, minimax/alfa-beta, Bayes e busca em espaço de estados.',
q:[
{n:1,q:'No algoritmo A*, a função de avaliação de um nó n é:',a:['*f(n) = g(n) + h(n)','f(n) = h(n)','f(n) = g(n)','f(n) = g(n) × h(n)','f(n) = max(g(n), h(n))'],e:'g(n) é o custo do início até n e h(n) a estimativa de n até o objetivo.'},
{n:2,q:'Uma heurística h é admissível quando:',a:['*nunca superestima o custo real até o objetivo','sempre superestima o custo para acelerar a busca','é igual a zero em todos os nós exceto o objetivo','é calculada pela busca em largura','depende apenas do número de filhos do nó'],e:'Com h admissível, A* (em busca em árvore) encontra a solução ótima. A distância em linha reta em mapas é o exemplo clássico.'},
{n:2,q:'A poda alfa-beta aplicada ao minimax:',a:['*produz a mesma decisão do minimax, avaliando menos nós','pode escolher jogadas piores para ganhar velocidade','só funciona em jogos com sorte','exige heurística admissível','transforma o minimax em busca gulosa'],e:'Ela descarta ramos que comprovadamente não alteram o resultado. Com boa ordenação, explora cerca de O(b<sup>d/2</sup>) nós.'},
{n:3,q:'Uma doença atinge 1% da população. Um teste detecta 90% dos doentes e dá falso positivo em 10% dos sadios. Se o teste deu positivo, a probabilidade de a pessoa estar doente é aproximadamente:',a:['*8,3%','90%','10%','50%','1%'],e:'P(+) = 0,9·0,01 + 0,1·0,99 = 0,009 + 0,099 = 0,108. P(D|+) = 0,009/0,108 ≈ 0,083. A baixa prevalência derruba o valor.'}]});

S({id:'ia2',nome:'Inteligência Artificial II',per:8,cr:4,area:'IA e computação visual',
trilha:[
['Aprendizado de máquina','<b>Supervisionado</b> (dados rotulados: classificação e regressão), <b>não supervisionado</b> (agrupamento, como k-means; redução de dimensionalidade, como PCA) e <b>por reforço</b> (agente aprende por recompensas).'],
['Algoritmos clássicos','k-NN, árvores de decisão (ganho de informação/entropia), Naive Bayes, regressão linear e logística, SVM, random forest.'],
['Avaliação','Separar treino, validação e teste; validação cruzada k-fold. <b>Overfitting</b>: ótimo no treino, ruim no teste (regularização, mais dados, dropout). Métricas: acurácia, precisão = VP/(VP+FP), revocação = VP/(VP+FN), F1. Matriz de confusão.'],
['Redes neurais','Perceptron simples só separa classes linearmente (não resolve XOR). Redes multicamadas treinadas por retropropagação e gradiente descendente. CNNs para imagens, RNN/Transformers para sequências. Algoritmos genéticos: seleção, cruzamento e mutação.']],
foco:'Tipo de aprendizado por cenário, overfitting, cálculo de precisão e revocação, limitação do perceptron.',
q:[
{n:1,q:'Agrupar clientes por padrões de compra, sem rótulos prévios, é uma tarefa de aprendizado:',a:['*não supervisionado','supervisionado','por reforço','semi-supervisionado obrigatório','simbólico dedutivo'],e:'Não há rótulo-alvo; algoritmos como k-means descobrem os grupos.'},
{n:2,q:'Um modelo tem 99% de acurácia no treino e 65% no teste. O fenômeno e uma medida adequada são:',a:['*overfitting; aplicar regularização ou obter mais dados','underfitting; aumentar a complexidade do modelo','overfitting; treinar por mais épocas','vazamento de dados; remover o conjunto de teste','nenhum problema; o modelo está pronto'],e:'O modelo memorizou o treino e não generaliza. Regularização, mais dados, early stopping e modelos mais simples ajudam.'},
{n:2,q:'Um classificador de spam obteve VP = 80, FP = 20, FN = 40. A precisão e a revocação são, respectivamente:',a:['*80% e aproximadamente 66,7%','66,7% e 80%','80% e 80%','50% e 66,7%','60% e 40%'],e:'Precisão = 80/(80+20) = 0,8. Revocação = 80/(80+40) ≈ 0,667.'},
{n:3,q:'Analise as asserções:<br>I. Um perceptron de camada única não consegue aprender a função XOR.<br><b>PORQUE</b><br>II. O perceptron de camada única só consegue representar fronteiras de decisão lineares, e as classes do XOR não são linearmente separáveis.<br>A respeito dessas asserções, assinale a opção correta.',fix:true,a:['*As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.','As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.','A asserção I é verdadeira, e a II é falsa.','A asserção I é falsa, e a II é verdadeira.','As asserções I e II são falsas.'],e:'Uma reta não separa (0,1),(1,0) de (0,0),(1,1). Com uma camada oculta (MLP), o XOR é aprendido.'}]});

S({id:'simul',nome:'Simulação Discreta',per:'Eletiva',cr:4,el:true,area:'IA e computação visual',
trilha:[
['Conceitos','Simulação de eventos discretos: o estado muda em instantes específicos (chegadas, partidas). Componentes: entidades, recursos, filas, eventos, relógio de simulação.'],
['Números aleatórios','Geradores pseudoaleatórios (congruencial linear). Geração de variáveis por transformada inversa. Distribuições: exponencial (tempo entre chegadas), Poisson (número de chegadas), normal, uniforme.'],
['Teoria de filas','Notação de Kendall A/B/c. Fila M/M/1: utilização ρ = λ/μ (precisa ser &lt; 1); número médio no sistema L = ρ/(1 − ρ). Lei de Little: L = λ·W.'],
['Validação e análise','Verificação (o modelo foi implementado corretamente) × validação (representa o sistema real). Aquecimento (warm-up), replicações e intervalos de confiança.']],
foco:'Fila M/M/1, Lei de Little e distribuições de chegada.',
q:[
{n:1,q:'Em simulação de filas, o tempo entre chegadas de clientes em um processo de Poisson segue a distribuição:',a:['*exponencial','normal','uniforme discreta','binomial','triangular'],e:'Se o número de chegadas por intervalo é Poisson, os intervalos entre chegadas são exponenciais.'},
{n:2,q:'Em uma fila M/M/1 chegam 8 clientes/hora e o servidor atende 10 clientes/hora. A utilização do servidor é:',a:['*80%','125%','20%','8%','100%'],e:'ρ = λ/μ = 8/10 = 0,8.'},
{n:3,q:'Em um caixa, chegam em média 12 clientes por hora e cada cliente permanece no sistema em média 15 minutos. Pela Lei de Little, o número médio de clientes no sistema é:',a:['*3','12','180','0,8','48'],e:'L = λ·W = 12 clientes/h × 0,25 h = 3 clientes.'}]});
// Computação visual, desenvolvimento, sociedade
S({id:'cg',nome:'Computação Gráfica',per:7,cr:4,area:'IA e computação visual',
trilha:[
['Transformações geométricas','Translação, rotação e escala. Com <b>coordenadas homogêneas</b> (x, y, 1), todas viram multiplicações de matrizes 3×3 (2D) ou 4×4 (3D) e podem ser compostas. A ordem importa: rotação seguida de translação ≠ translação seguida de rotação.'],
['Pipeline gráfico','Modelagem → visualização (câmera) → projeção (perspectiva ou ortogonal) → recorte → rasterização → fragmentos/sombreamento → teste de profundidade (z-buffer) → imagem.'],
['Rasterização','Algoritmo de Bresenham para retas (só inteiros), preenchimento de polígonos, antialiasing.'],
['Iluminação e cor','Modelo de Phong: ambiente + difusa + especular. Sombreamento flat, Gouraud (interpola cores) e Phong (interpola normais). Modelos de cor: RGB (aditivo, telas), CMYK (subtrativo, impressão), HSV.']],
foco:'Matrizes de transformação em coordenadas homogêneas, ordem de composição, z-buffer e modelos de cor.',
q:[
{n:1,q:'O modelo de cores aditivo, usado em monitores, é o:',a:['*RGB','CMYK','HSV','YCbCr apenas para impressão','Pantone'],e:'Em telas, a luz vermelha, verde e azul se soma; CMYK é subtrativo, para pigmentos.'},
{n:2,q:'Coordenadas homogêneas são usadas em computação gráfica principalmente para:',a:['*representar translação como multiplicação de matrizes, permitindo compor todas as transformações','aumentar a resolução da imagem','eliminar a necessidade de projeção','representar cores em ponto flutuante','acelerar o algoritmo de Bresenham'],e:'Em 2D cartesiano a translação é uma soma, não um produto. Com (x, y, 1) ela vira uma matriz 3×3.'},
{n:3,q:'Aplicando ao ponto (1, 0) uma rotação de 90° no sentido anti-horário em torno da origem e, em seguida, uma translação de (2, 3), obtém-se:',a:['*(2, 4)','(3, 3)','(−3, 3)','(0, 1)','(2, 3)'],e:'Rotação de 90°: (x, y) → (−y, x), logo (1, 0) → (0, 1). Translação: (0 + 2, 1 + 3) = (2, 4). Na ordem inversa o resultado seria (−3, 3).'}]});

S({id:'pi',nome:'Processamento de Imagens',per:6,cr:4,area:'IA e computação visual',
trilha:[
['Imagem digital','Matriz de pixels. Resolução espacial (quantidade de pixels) e de intensidade (bits por pixel: 8 bits = 256 níveis de cinza). Imagem colorida RGB 24 bits.'],
['Histograma e realce','O histograma mostra a distribuição de intensidades. Equalização espalha os níveis para melhorar o contraste. Limiarização (thresholding) binariza a imagem; o método de Otsu escolhe o limiar automaticamente.'],
['Filtragem espacial','Convolução com máscaras. Filtro da <b>média</b>: suaviza, borra bordas. Filtro da <b>mediana</b>: ótimo contra ruído sal e pimenta, preserva bordas. Detectores de bordas (passa-alta): Sobel, Prewitt, Laplaciano, Canny.'],
['Morfologia e frequência','Erosão (encolhe objetos), dilatação (expande), abertura (erosão + dilatação, remove ruídos pequenos), fechamento (dilatação + erosão, fecha buracos). A transformada de Fourier leva ao domínio da frequência.']],
foco:'Escolher o filtro certo para o ruído, operações morfológicas e cálculo de tamanho de imagem.',
q:[
{n:1,q:'Uma imagem em tons de cinza de 8 bits por pixel pode representar quantos níveis de intensidade?',a:['*256','8','255','128','512'],e:'2<sup>8</sup> = 256 níveis (0 a 255).'},
{n:2,q:'Para remover ruído do tipo sal e pimenta preservando bordas, o filtro mais adequado é o da:',a:['*mediana','média','Laplaciano','Sobel','passa-alta ideal'],e:'A mediana descarta valores extremos isolados sem a borragem da média.'},
{n:2,q:'Quanto ocupa, sem compressão, uma imagem RGB de 1000 × 1000 pixels com 8 bits por canal?',a:['*3 MB (3 milhões de bytes)','1 MB','8 MB','24 MB','300 KB'],e:'1.000.000 pixels × 3 bytes = 3.000.000 bytes.'},
{n:3,q:'Em uma imagem binária com pequenos pontos brancos de ruído espalhados pelo fundo, a operação morfológica mais adequada para eliminá-los, mantendo o tamanho aproximado dos objetos grandes, é a:',a:['*abertura (erosão seguida de dilatação)','fechamento (dilatação seguida de erosão)','dilatação apenas','erosão apenas, repetida várias vezes','equalização do histograma'],e:'A erosão apaga os pontos pequenos; a dilatação seguinte devolve aos objetos grandes seu tamanho. O fechamento serve para preencher buracos.'}]});

S({id:'web',nome:'Programação Web',per:4,cr:4,area:'Desenvolvimento e interação',
trilha:[
['HTTP','Protocolo sem estado (stateless). Métodos: GET (ler, idempotente), POST (criar), PUT (substituir, idempotente), PATCH (alterar parcial), DELETE (remover, idempotente). Códigos: 2xx sucesso, 3xx redirecionamento, 4xx erro do cliente (404, 401, 403), 5xx erro do servidor. Estado mantido por cookies, sessões ou tokens (JWT).'],
['Front-end','HTML (estrutura e semântica), CSS (apresentação, box model, flexbox, grid, responsividade com media queries), JavaScript (comportamento, DOM, eventos, assíncrono com Promises/async-await, fetch).'],
['Back-end e APIs','APIs REST: recursos identificados por URIs, verbos HTTP, representação JSON, sem estado no servidor. MVC separa modelo, visão e controle. CORS controla requisições entre origens.'],
['Segurança web','Valide no servidor, use HTTPS, proteja contra XSS, CSRF e SQL injection.']],
foco:'Métodos e códigos HTTP, princípios REST e o modelo assíncrono do JavaScript.',
q:[
{n:1,q:'O código de status HTTP 404 indica:',a:['*recurso não encontrado','erro interno do servidor','requisição bem-sucedida','acesso não autorizado por falta de autenticação','redirecionamento permanente'],e:'4xx são erros do cliente; 404 = Not Found. 500 é erro interno; 401, não autenticado.'},
{n:2,q:'Em uma API REST, a requisição mais adequada para remover o produto de id 42 é:',a:['*DELETE /produtos/42','GET /produtos/remover?id=42','POST /removerProduto/42','PUT /produtos/42/delete','GET /produtos/42?acao=delete'],e:'REST usa o verbo HTTP para a ação e a URI para o recurso. GET nunca deve alterar estado.'},
{n:2,q:'O fato de o protocolo HTTP ser stateless significa que:',a:['*cada requisição é independente e o servidor não guarda, por padrão, informações de requisições anteriores','o servidor não pode usar banco de dados','não é possível implementar login','as conexões TCP nunca são reutilizadas','o cliente não pode enviar cabeçalhos'],e:'Por isso se usam cookies, sessões e tokens para manter o contexto do usuário.'},
{n:3,q:'Qual a ordem de impressão no console?<pre>console.log("A");\nsetTimeout(() =&gt; console.log("B"), 0);\nPromise.resolve().then(() =&gt; console.log("C"));\nconsole.log("D");</pre>',a:['*A, D, C, B','A, B, C, D','A, D, B, C','A, C, D, B','D, A, C, B'],e:'O código síncrono roda primeiro (A, D). Depois a fila de microtarefas (Promises: C) e só então as macrotarefas (setTimeout: B), mesmo com atraso 0.'}]});

S({id:'mobile',nome:'Programação para Dispositivos Móveis',per:5,cr:4,area:'Desenvolvimento e interação',
trilha:[
['Abordagens','Nativo (Kotlin/Java no Android, Swift no iOS): melhor desempenho e acesso ao hardware. Multiplataforma (Flutter, React Native): um código para várias plataformas. Web/PWA: roda no navegador.'],
['Ciclo de vida','No Android, a Activity passa por onCreate, onStart, onResume, onPause, onStop e onDestroy. Rotação de tela recria a Activity: salve o estado (ViewModel, onSaveInstanceState).'],
['Restrições do dispositivo','Bateria, memória, rede instável e telas variadas. Nunca bloqueie a thread principal (UI) com rede ou disco: use corrotinas, threads ou tarefas assíncronas, sob risco de ANR (app não responde).'],
['Permissões e armazenamento','Permissões em tempo de execução para câmera, localização etc. Armazenamento local: SharedPreferences/DataStore, SQLite/Room. Notificações push.']],
foco:'Ciclo de vida da Activity, thread principal e escolha entre nativo e multiplataforma.',
q:[
{n:1,q:'No Android, o método do ciclo de vida chamado quando a Activity é criada pela primeira vez é:',a:['*onCreate()','onResume()','onStart()','onPause()','onDestroy()'],e:'Em onCreate inicializa-se a interface e os componentes.'},
{n:2,q:'Um app Android faz uma requisição de rede longa diretamente na thread principal. A consequência provável é:',a:['*a interface travar e o sistema exibir o aviso de app que não responde (ANR)','o app ficar mais rápido','a requisição ser cancelada pelo compilador','nenhuma, pois a rede é sempre assíncrona','a bateria durar mais'],e:'A thread principal desenha a UI; bloqueá-la congela a tela. O Android inclusive lança NetworkOnMainThreadException.'},
{n:3,q:'Uma empresa precisa lançar rapidamente um app para Android e iOS com equipe pequena, sem uso intensivo de recursos específicos de hardware. A abordagem mais adequada é:',a:['*um framework multiplataforma, como Flutter ou React Native, com base de código única','dois apps nativos desenvolvidos em paralelo','apenas um app nativo Android','um app em Assembly para máximo desempenho','um site sem responsividade'],e:'Multiplataforma reduz custo e tempo. Nativo vale mais quando há exigência alta de desempenho ou acesso profundo ao hardware.'}]});

S({id:'ihc',nome:'Interação Humano-Computador',per:6,cr:2,area:'Desenvolvimento e interação',
trilha:[
['Usabilidade','ISO 9241-11: eficácia, eficiência e satisfação em um contexto de uso. Acessibilidade: WCAG (perceptível, operável, compreensível, robusto).'],
['Heurísticas de Nielsen','1 visibilidade do status do sistema, 2 correspondência com o mundo real, 3 controle e liberdade do usuário, 4 consistência e padrões, 5 prevenção de erros, 6 reconhecimento em vez de memorização, 7 flexibilidade e eficiência, 8 design estético e minimalista, 9 ajudar a reconhecer, diagnosticar e recuperar erros, 10 ajuda e documentação.'],
['Design centrado no usuário','Ciclo: entender o contexto, especificar requisitos, prototipar (baixa e alta fidelidade), avaliar. Personas e cenários.'],
['Avaliação','Por inspeção, sem usuários (avaliação heurística, percurso cognitivo) e por observação, com usuários (testes de usabilidade, pensar em voz alta).']],
foco:'Associar um problema de interface à heurística de Nielsen violada e diferenciar métodos de avaliação.',
q:[
{n:1,q:'Uma barra de progresso exibida durante o envio de um arquivo atende principalmente à heurística de:',a:['*visibilidade do status do sistema','prevenção de erros','flexibilidade e eficiência de uso','design minimalista','ajuda e documentação'],e:'O usuário precisa saber o que está acontecendo, com feedback em tempo razoável.'},
{n:2,q:'Um sistema não oferece botão de desfazer após excluir um e-mail. Qual heurística é violada?',a:['*controle e liberdade do usuário','visibilidade do status do sistema','consistência e padrões','reconhecimento em vez de memorização','design estético e minimalista'],e:'Usuários erram; precisam de “saídas de emergência” como desfazer e cancelar.'},
{n:3,q:'A avaliação heurística difere do teste de usabilidade porque:',a:['*é feita por especialistas inspecionando a interface, sem a participação de usuários reais','exige pelo menos 30 usuários finais','só pode ser aplicada após o lançamento do produto','mede apenas o tempo de resposta do servidor','substitui totalmente qualquer teste com usuários'],e:'É um método de inspeção barato e rápido. Testes com usuários revelam problemas que especialistas podem não prever; os métodos se complementam.'}]});

S({id:'infsoc',nome:'Informática e Sociedade',per:6,cr:2,area:'Computação e sociedade',
trilha:[
['Ética e profissão','Responsabilidade do profissional de computação pelos impactos de seus sistemas. Códigos de ética (ACM, SBC): honestidade, privacidade, evitar danos.'],
['Privacidade e LGPD','Lei 13.709/2018. Bases legais para tratamento (consentimento é uma delas, não a única). Direitos do titular: acesso, correção, eliminação, portabilidade. Princípios: finalidade, necessidade (minimização), transparência, segurança. ANPD fiscaliza. Dados sensíveis (saúde, biometria, origem racial, religião etc.) têm proteção reforçada.'],
['Marco Civil e direitos','Marco Civil da Internet (Lei 12.965/2014): neutralidade de rede, guarda de registros, liberdade de expressão. Propriedade intelectual: software é protegido por direito autoral (Lei 9.609/98); licenças livres (GPL, MIT).'],
['Impactos sociais','Exclusão digital, automação e trabalho, vieses algorítmicos, desinformação, sustentabilidade e lixo eletrônico. Esses temas também aparecem na Formação Geral do ENADE.']],
foco:'LGPD aplicada a cenários, viés algorítmico e responsabilidade ética. Questões discursivas costumam explorar esses temas.',
q:[
{n:1,q:'No Brasil, a lei que regula o tratamento de dados pessoais é a:',a:['*Lei Geral de Proteção de Dados (Lei 13.709/2018)','Lei de Software (Lei 9.609/1998)','Lei de Acesso à Informação (Lei 12.527/2011)','Código de Defesa do Consumidor','Lei de Direitos Autorais (Lei 9.610/1998)'],e:'A LGPD foi inspirada no GDPR europeu e é fiscalizada pela ANPD.'},
{n:2,q:'Um sistema de triagem de currículos treinado com contratações antigas passa a rejeitar candidatas mulheres com mais frequência. Esse problema é melhor descrito como:',a:['*viés algorítmico herdado dos dados históricos de treinamento','falha de hardware do servidor','excesso de dados de treinamento','erro de compilação do modelo','vulnerabilidade de SQL injection'],e:'O modelo reproduz padrões discriminatórios presentes nos dados. É preciso auditar dados e resultados, e a LGPD garante revisão de decisões automatizadas.'},
{n:3,q:'Sobre a LGPD, avalie:<br>I. O consentimento do titular é a única base legal que autoriza o tratamento de dados pessoais.<br>II. O titular tem direito de solicitar a eliminação de dados tratados com base em seu consentimento.<br>III. Dados sobre saúde são classificados como dados pessoais sensíveis.<br>É correto o que se afirma em:',a:['*II e III, apenas','I, apenas','I e II, apenas','I e III, apenas','I, II e III'],e:'I está errada: a lei prevê dez bases legais, como cumprimento de obrigação legal, execução de contrato e legítimo interesse.'}]});

S({id:'infedu',nome:'Informática na Educação',per:6,cr:4,area:'Computação e sociedade',
trilha:[
['Teorias de aprendizagem','Behaviorismo (estímulo-resposta, instrução programada), construtivismo de Piaget (o aluno constrói o conhecimento), socioconstrutivismo de Vygotsky (zona de desenvolvimento proximal, papel da mediação) e construcionismo de Papert (aprender construindo artefatos, linguagem Logo).'],
['Tecnologias educacionais','Ambientes virtuais de aprendizagem (Moodle), objetos de aprendizagem, gamificação, sistemas tutores inteligentes, ensino híbrido e sala de aula invertida.'],
['Pensamento computacional','Pilares: decomposição, reconhecimento de padrões, abstração e algoritmos. A BNCC incorpora computação na educação básica.'],
['Inclusão','Tecnologias assistivas e acessibilidade digital ampliam o acesso. Desenho universal para a aprendizagem.']],
foco:'Associar teorias (Piaget, Vygotsky, Papert) a práticas com tecnologia e conhecer os pilares do pensamento computacional.',
q:[
{n:1,q:'O construcionismo, que propõe que o aluno aprende construindo artefatos com o computador, como na linguagem Logo, foi proposto por:',a:['*Seymour Papert','Jean Piaget','B. F. Skinner','Lev Vygotsky','Paulo Freire'],e:'Papert, discípulo de Piaget, criou o Logo e o conceito de construcionismo.'},
{n:2,q:'Quebrar um problema complexo em partes menores e mais fáceis de resolver é qual pilar do pensamento computacional?',a:['*decomposição','abstração','reconhecimento de padrões','algoritmo','depuração'],e:'Abstração foca no essencial; padrões identificam semelhanças; algoritmo define passos.'},
{n:3,q:'Um professor organiza duplas em que um aluno mais experiente apoia o outro em uma atividade de programação que este ainda não faria sozinho. A prática se apoia principalmente no conceito de:',a:['*zona de desenvolvimento proximal, de Vygotsky','condicionamento operante, de Skinner','estágios do desenvolvimento cognitivo, de Piaget','instrução programada','inteligências múltiplas, de Gardner'],e:'A ZDP é a distância entre o que o aluno faz sozinho e o que faz com ajuda de alguém mais experiente.'}]});
// Conteúdo expandido: fundamentos e programação
X('intro',{t:[
['O que é Ciência da Computação',`<p>A Ciência da Computação estuda o que pode ser computado, como computar de forma eficiente e como construir sistemas que façam isso. Ela se apoia em três pilares que atravessam o curso inteiro:</p>
<ul><li><b>Teoria</b>: modelos de computação, algoritmos e seus limites (o que é possível e quanto custa).</li><li><b>Sistemas</b>: hardware, sistemas operacionais, redes e bancos de dados que executam as computações.</li><li><b>Aplicações</b>: engenharia de software, IA, computação gráfica, interação humano-computador.</li></ul>
<p>Um <b>algoritmo</b> é uma sequência finita e não ambígua de passos que resolve um problema. Um <b>programa</b> é um algoritmo escrito em uma linguagem que a máquina consegue executar, direta ou indiretamente.</p>`],
['Bits, bytes e quantas coisas cabem neles',`<p>Tudo no computador é representado por <b>bits</b> (0 ou 1). 8 bits formam um <b>byte</b>. A regra mais importante:</p>
<div class="ex">Com <b>n bits</b> existem <b>2<sup>n</sup></b> combinações. 8 bits → 256 valores; 16 bits → 65.536; 32 bits → cerca de 4,29 bilhões.</div>
<p>O mesmo raciocínio vale “ao contrário”: para representar N valores distintos você precisa de ⌈log<sub>2</sub> N⌉ bits. Para 100 valores, 7 bits (2<sup>7</sup> = 128).</p>
<p>Prefixos: em armazenamento e memória é comum usar potências de 2 (1 KiB = 1024 bytes, 1 MiB = 1024 KiB). Em redes, taxas usam potências de 10 e bits por segundo (1 Mbps = 10<sup>6</sup> bits/s). Uma pegadinha comum é misturar bits com bytes: 100 Mbps transferem no máximo 12,5 MB/s.</p>`],
['Sistemas de numeração',`<p>Um número em base b tem dígitos d<sub>k</sub>…d<sub>0</sub> e vale Σ d<sub>i</sub>·b<sup>i</sup>.</p>
<ul><li><b>Binário → decimal</b>: some as potências de 2 das posições com 1. 101101<sub>2</sub> = 32 + 8 + 4 + 1 = 45.</li>
<li><b>Decimal → binário</b>: divida por 2 sucessivamente e leia os restos de baixo para cima. 45 → 22 r1 → 11 r0 → 5 r1 → 2 r1 → 1 r0 → 0 r1 = 101101.</li>
<li><b>Binário ↔ hexadecimal</b>: agrupe de 4 em 4 bits a partir da direita. 1011 0110 = B6<sub>16</sub>. Para octal, agrupe de 3 em 3.</li>
<li><b>Frações</b>: multiplique a parte fracionária por 2 repetidamente. 0,625 → 1,25 (1) → 0,5 (0) → 1,0 (1) = 0,101<sub>2</sub>.</li></ul>`],
['Inteiros com sinal e complemento de dois',`<p>Existem três representações clássicas para inteiros negativos com n bits:</p>
<table class="mini"><tr><th>Representação</th><th>Faixa (8 bits)</th><th>Zero</th></tr><tr><td>Sinal-magnitude</td><td>−127 a 127</td><td>dois zeros (+0 e −0)</td></tr><tr><td>Complemento de um</td><td>−127 a 127</td><td>dois zeros</td></tr><tr><td><b>Complemento de dois</b></td><td>−128 a 127</td><td>um zero</td></tr></table>
<p>O <b>complemento de dois</b> é o usado em praticamente todos os processadores porque a soma e a subtração usam o mesmo circuito. Para obter −x: inverta todos os bits de x e some 1. O bit mais à esquerda indica o sinal (1 = negativo).</p>
<div class="ex">−6 em 8 bits: 6 = 00000110 → inverte 11111001 → +1 = <b>11111010</b>. Conferindo: −128 + 64 + 32 + 16 + 8 + 2 = −6.</div>
<p><b>Overflow</b>: acontece quando o resultado sai da faixa. Regra prática: somar dois positivos e obter negativo (ou dois negativos e obter positivo). Somar números de sinais opostos nunca dá overflow. Em sem sinal, o “vai-um” final indica que o resultado não coube.</p>`],
['Ponto flutuante IEEE 754',`<p>Números reais são guardados em notação científica binária: (−1)<sup>s</sup> × 1,m × 2<sup>e−bias</sup>.</p>
<table class="mini"><tr><th>Formato</th><th>Sinal</th><th>Expoente</th><th>Mantissa</th><th>Bias</th></tr><tr><td>Simples (32 bits)</td><td>1</td><td>8</td><td>23</td><td>127</td></tr><tr><td>Dupla (64 bits)</td><td>1</td><td>11</td><td>52</td><td>1023</td></tr></table>
<p>O “1,” antes da mantissa fica implícito (bit escondido). Expoente todo em 1 representa infinito ou NaN; todo em 0 representa zero e números subnormais.</p>
<div class="ex">5,75 = 101,11<sub>2</sub> = 1,0111 × 2<sup>2</sup>. Sinal 0, expoente 2 + 127 = 129 = 10000001, mantissa 0111000…0.</div>
<p>Consequências práticas: muitos decimais (0,1; 0,2) não têm representação exata; a precisão é relativa (há mais números representáveis perto de zero); somar um número muito pequeno a um muito grande pode não mudar nada. Nunca compare floats com ==; use uma tolerância.</p>`],
['Arquitetura de von Neumann e execução de programas',`<p>O modelo de von Neumann tem <b>CPU</b> (unidade de controle, ULA e registradores), <b>memória</b> única que guarda dados e instruções, e <b>entrada/saída</b>, todos ligados por barramentos. O <b>contador de programa (PC)</b> aponta a próxima instrução.</p>
<p>Ciclo de instrução: <b>busca</b> (lê a instrução apontada pelo PC e incrementa o PC) → <b>decodificação</b> → <b>execução</b> (ULA, acesso à memória ou desvio) → escrita do resultado.</p>
<p>Da linguagem de alto nível ao hardware: o <b>compilador</b> traduz o programa todo para código de máquina antes de executar (C); o <b>interpretador</b> traduz e executa comando a comando (Python clássico); abordagens <b>híbridas</b> compilam para bytecode executado por uma máquina virtual, muitas vezes com compilação JIT (Java, C#).</p>`]],
e:[
['Conversão de bases e contagem de bits',`<p>Aparece como parte de questões de arquitetura, redes (máscaras) ou como cálculo direto. É comum pedir quantos bits são necessários para endereçar N posições ou quantos valores cabem em n bits.</p><div class="pega">Pegadinha: 2<sup>n</sup> valores vão de 0 a 2<sup>n</sup>−1. Com 8 bits o maior valor sem sinal é 255, não 256.</div>`],
['Complemento de dois e overflow',`<p>Questões dão uma soma em 8 bits e perguntam o resultado e se houve overflow, ou pedem a faixa representável. Treine a regra do sinal: dois operandos de mesmo sinal com resultado de sinal diferente = overflow.</p><div class="pega">Pegadinha: confundir “vai-um” (carry) com overflow. Em números com sinal, pode haver carry sem overflow (ex.: −1 + 1).</div>`],
['Ponto flutuante na prática',`<p>O ENADE gosta de contextos de software: um laço que soma 0,1 dez vezes e compara com 1,0, ou cálculo financeiro com float. A resposta esperada é reconhecer erro de arredondamento e propor tolerância ou tipo decimal/inteiro em centavos.</p>`],
['Compilação × interpretação',`<p>Assertivas do tipo “linguagens interpretadas são sempre mais lentas” ou “Java é puramente compilada” costumam ser falsas. Saiba explicar bytecode, máquina virtual e JIT.</p>`]]});

X('matcomp',{t:[
['Lógica proposicional',`<p>Uma <b>proposição</b> é uma sentença que é verdadeira (V) ou falsa (F). Conectivos:</p>
<table class="mini"><tr><th>p</th><th>q</th><th>p∧q</th><th>p∨q</th><th>p→q</th><th>p↔q</th><th>p⊕q</th></tr><tr><td>V</td><td>V</td><td>V</td><td>V</td><td>V</td><td>V</td><td>F</td></tr><tr><td>V</td><td>F</td><td>F</td><td>V</td><td><b>F</b></td><td>F</td><td>V</td></tr><tr><td>F</td><td>V</td><td>F</td><td>V</td><td>V</td><td>F</td><td>V</td></tr><tr><td>F</td><td>F</td><td>F</td><td>F</td><td>V</td><td>V</td><td>F</td></tr></table>
<p><b>Tautologia</b>: sempre V (ex.: p ∨ ¬p). <b>Contradição</b>: sempre F (p ∧ ¬p). <b>Contingência</b>: depende dos valores. Uma tabela-verdade com n proposições tem 2<sup>n</sup> linhas.</p>`],
['Equivalências que você precisa saber de cor',`<ul><li><b>Implicação</b>: p → q ≡ ¬p ∨ q</li><li><b>Contrapositiva</b>: p → q ≡ ¬q → ¬p (a recíproca q → p e a inversa ¬p → ¬q <u>não</u> são equivalentes)</li><li><b>Negação da implicação</b>: ¬(p → q) ≡ p ∧ ¬q</li><li><b>De Morgan</b>: ¬(p ∧ q) ≡ ¬p ∨ ¬q e ¬(p ∨ q) ≡ ¬p ∧ ¬q</li><li><b>Distributivas</b>: p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r)</li><li><b>Bicondicional</b>: p ↔ q ≡ (p → q) ∧ (q → p)</li></ul>
<div class="ex">Negar “Se estudo, então passo” dá “Estudo e não passo”. Não é “Se não estudo, não passo”.</div>`],
['Lógica de predicados e quantificadores',`<p>Predicados têm variáveis: P(x) = “x é par”. Quantificadores: <b>∀x</b> (para todo) e <b>∃x</b> (existe). Negação troca o quantificador e nega o predicado:</p>
<ul><li>¬∀x P(x) ≡ ∃x ¬P(x) — “nem todo aluno passou” = “algum aluno não passou”</li><li>¬∃x P(x) ≡ ∀x ¬P(x) — “nenhum aluno passou” = “todo aluno não passou”</li></ul>
<p>A ordem de quantificadores diferentes importa: ∀x ∃y (y &gt; x) é verdadeiro nos inteiros, mas ∃y ∀x (y &gt; x) é falso.</p>`],
['Conjuntos, relações e funções',`<p>Operações: A ∪ B, A ∩ B, A − B, complemento, produto cartesiano A × B (pares ordenados, |A×B| = |A|·|B|). Conjunto das partes P(A) tem 2<sup>|A|</sup> elementos. Inclusão-exclusão: |A ∪ B| = |A| + |B| − |A ∩ B|.</p>
<p>Uma <b>relação</b> em A é um subconjunto de A × A. Propriedades: reflexiva (a R a), simétrica (a R b ⇒ b R a), antissimétrica (a R b e b R a ⇒ a = b), transitiva (a R b e b R c ⇒ a R c).</p>
<ul><li><b>Equivalência</b> = reflexiva + simétrica + transitiva. Particiona o conjunto em classes (ex.: congruência módulo n).</li><li><b>Ordem parcial</b> = reflexiva + antissimétrica + transitiva (ex.: ≤, divisibilidade, ⊆).</li></ul>
<p><b>Funções</b>: injetora (elementos distintos têm imagens distintas), sobrejetora (toda a imagem é atingida), bijetora (as duas; só elas têm inversa).</p>`],
['Combinatória',`<ul><li><b>Princípio multiplicativo</b>: etapas independentes multiplicam. Placas com 3 letras e 4 dígitos: 26<sup>3</sup>·10<sup>4</sup>.</li><li><b>Permutação</b>: n! ordens de n elementos. Com repetição de elementos: n!/(a!·b!…). “BANANA” = 6!/(3!·2!) = 60.</li><li><b>Arranjo</b> (ordem importa): A(n,k) = n!/(n−k)!</li><li><b>Combinação</b> (ordem não importa): C(n,k) = n!/(k!(n−k)!). Escolher 3 de 10 alunos para uma comissão: C(10,3) = 120.</li><li><b>Casa dos pombos</b>: se n+1 objetos vão para n caixas, alguma caixa tem pelo menos 2. Generalizado: alguma caixa tem ⌈N/n⌉.</li></ul>
<p>Pergunta-chave para não errar: “trocar a ordem gera um resultado diferente?” Se sim, arranjo; se não, combinação.</p>`],
['Indução e recorrências',`<p><b>Indução matemática</b> prova P(n) para todo n ≥ n<sub>0</sub>:</p><ol><li><b>Base</b>: prove P(n<sub>0</sub>).</li><li><b>Hipótese</b>: suponha P(k) verdadeiro para um k qualquer.</li><li><b>Passo</b>: use a hipótese para provar P(k+1).</li></ol>
<div class="ex">1 + 2 + … + n = n(n+1)/2. Base: n=1 → 1 = 1. Passo: (1+…+k) + (k+1) = k(k+1)/2 + (k+1) = (k+1)(k+2)/2. ✓</div>
<p><b>Recorrências</b> descrevem sequências e custos de algoritmos recursivos: T(n) = T(n−1) + 1 → O(n); T(n) = 2T(n/2) + n → O(n log n); T(n) = T(n/2) + 1 → O(log n). Indução forte supõe P(n<sub>0</sub>)…P(k) para provar P(k+1).</p>`]],
e:[
['Equivalências e negações lógicas',`<p>É o tema mais frequente, inclusive na Formação Geral. Questões trazem uma frase em português e pedem a equivalente ou a negação. Domine contrapositiva, negação da implicação e De Morgan.</p><div class="pega">Pegadinha: oferecer a recíproca (“se passo, então estudo”) como equivalente.</div>`],
['Tabela-verdade de expressões e circuitos',`<p>Às vezes vem disfarçada de condição em código (<code>if (!(a &amp;&amp; b) || c)</code>) ou de circuito lógico. Monte a tabela com 2<sup>n</sup> linhas e avalie por partes.</p>`],
['Propriedades de relações',`<p>Dão uma relação concreta (sobre inteiros, pessoas, conjuntos) e pedem para classificá-la. Teste cada propriedade com um contraexemplo pequeno.</p>`],
['Contagem aplicada à computação',`<p>Senhas, endereços IP, caminhos em grade, número de subconjuntos (2<sup>n</sup>) e número de pares (C(n,2) = n(n−1)/2, que é também o máximo de arestas de um grafo simples).</p>`],
['Prova por indução',`<p>Costuma pedir qual é o passo indutivo correto ou onde uma “prova” falha. Desconfie de alternativas que apenas testam alguns valores.</p>`]]});

X('alg1',{t:[
['Algoritmo, variáveis e tipos',`<p>Um algoritmo transforma <b>entradas</b> em <b>saídas</b> por uma sequência finita de passos. Variáveis são nomes para posições de memória e têm <b>tipo</b> (int, float, char, bool), <b>escopo</b> (onde o nome é visível) e <b>tempo de vida</b> (quando existe na memória).</p>
<p>Atenção à <b>divisão inteira</b>: em C/Java, <code>7/2</code> vale 3, <code>7%2</code> vale 1 e <code>7.0/2</code> vale 3,5. Conversões implícitas (promoção de tipo) e explícitas (cast) mudam o resultado.</p>`],
['Teste de mesa',`<p>É a principal ferramenta para resolver questões de código no ENADE. Monte uma tabela com uma coluna por variável e uma linha por passo, e execute o código “à mão”.</p>
<pre>int x = 3, y = 0;
while (x &gt; 0) { y += x; x--; }</pre>
<table class="mini"><tr><th>passo</th><th>x</th><th>y</th></tr><tr><td>início</td><td>3</td><td>0</td></tr><tr><td>1</td><td>2</td><td>3</td></tr><tr><td>2</td><td>1</td><td>5</td></tr><tr><td>3</td><td>0</td><td>6</td></tr></table>
<p>Resultado: y = 6. Faça sempre, mesmo quando parecer óbvio; é onde as pegadinhas aparecem.</p>`],
['Estruturas de decisão',`<p><code>if/else</code> e <code>switch</code>. Cuidados clássicos:</p>
<ul><li><b>Curto-circuito</b>: em <code>a &amp;&amp; b</code>, se a é falso, b não é avaliado. Em <code>a || b</code>, se a é verdadeiro, b não é avaliado. Isso evita erros como <code>if (p != NULL &amp;&amp; p-&gt;x &gt; 0)</code>.</li><li><b>switch sem break</b> “cai” para o próximo caso (fall-through).</li><li><b>else pendente</b>: o else se liga ao if mais próximo sem chaves.</li><li><code>if (x = 0)</code> em C é atribuição, não comparação.</li></ul>`],
['Estruturas de repetição',`<ul><li><b>while</b>: testa antes; pode executar zero vezes.</li><li><b>do-while</b>: testa depois; executa pelo menos uma vez (bom para menus e validação de entrada).</li><li><b>for</b>: inicialização, condição e incremento juntos; ideal quando se sabe o número de iterações.</li></ul>
<p>Contagem de iterações: <code>for(i=a; i&lt;b; i++)</code> roda b−a vezes. Laços aninhados <b>independentes</b> multiplicam (n·m). Laços aninhados em que o interno depende do externo (<code>j</code> de <code>i</code> até n) somam n + (n−1) + … + 1 = n(n+1)/2.</p>
<p><b>Invariante de laço</b>: propriedade verdadeira antes e depois de cada iteração. Ajuda a provar que o laço está correto (ex.: “soma contém a soma de v[0..i−1]”).</p>`],
['Vetores e matrizes',`<p>Vetores guardam elementos do mesmo tipo em posições contíguas, acessados por índice em O(1). Em C/Java, índices vão de 0 a n−1. Acessar v[n] é erro (em C, comportamento indefinido; em Java, exceção).</p>
<p>Matrizes são vetores de vetores; em C são armazenadas por linha (row-major). Percorrer linha por linha aproveita melhor a cache do que coluna por coluna.</p>
<p>Padrões que caem muito: soma e média, maior/menor elemento, contagem de ocorrências, inversão de vetor (trocar v[i] com v[n−1−i] até a metade), transposta, soma da diagonal principal (i == j) e secundária (i + j == n−1).</p>`],
['Funções e passagem de parâmetros',`<p>Funções (sub-rotinas) evitam repetição e facilitam teste. Na <b>passagem por valor</b>, a função recebe uma cópia; mudar o parâmetro não afeta o chamador. Na <b>passagem por referência</b> (ou por ponteiro em C), a função acessa a variável original.</p>
<pre>void troca(int *a, int *b) { int t = *a; *a = *b; *b = t; }
troca(&amp;x, &amp;y);  // funciona
void trocaErrada(int a, int b) { int t = a; a = b; b = t; } // não muda x e y</pre>
<p>Em Java, tudo é passado por valor, mas para objetos o valor copiado é a referência: o método consegue alterar o objeto, mas não fazer a variável do chamador apontar para outro objeto. Vetores em C são passados como ponteiro para o primeiro elemento.</p>`]],
e:[
['Teste de mesa de laços aninhados',`<p>A forma mais comum de questão de programação: “qual o valor de x ao final?” ou “quantas vezes a linha executa?”. Simule com tabela e confira os limites (&lt; × &lt;=).</p><div class="pega">Pegadinha: laço com incremento diferente de 1 (i += 2, i *= 2) ou que modifica a variável de controle dentro do corpo.</div>`],
['Encontrar o erro em um trecho de código',`<p>Off-by-one, índice fora do vetor, divisão inteira, variável não inicializada, condição de parada errada. Leia cada linha perguntando “o que acontece no primeiro e no último valor?”.</p>`],
['Passagem por valor × referência',`<p>Funções de troca e funções que alteram vetores são clássicas. Lembre que vetores em C sempre são alterados pela função.</p>`],
['Completar a lacuna de um algoritmo',`<p>Dão um algoritmo com uma linha faltando e alternativas para completá-la. Teste cada alternativa com uma entrada pequena, de 2 ou 3 elementos.</p>`]]});

X('alg2',{t:[
['Recursão',`<p>Uma função recursiva resolve um problema chamando a si mesma em instâncias menores. Ela precisa de:</p><ol><li><b>Caso base</b>: retorna sem recursão.</li><li><b>Passo recursivo</b>: reduz o problema em direção ao caso base.</li></ol>
<pre>int fat(int n) { if (n &lt;= 1) return 1; return n * fat(n-1); }</pre>
<p>Cada chamada ocupa um <b>quadro na pilha</b> (parâmetros, variáveis locais, endereço de retorno). Profundidade n ⇒ O(n) de memória. Recursão de cauda (a chamada é a última operação) pode ser otimizada em laço por alguns compiladores.</p>
<p>Cuidado com recursão ingênua que repete trabalho: <code>fib(n) = fib(n−1) + fib(n−2)</code> faz O(2<sup>n</sup>) chamadas. Com memoização ou versão iterativa, vira O(n). Isso é a ideia de <b>programação dinâmica</b>.</p>`],
['Ponteiros e alocação dinâmica',`<p>Um ponteiro guarda um endereço. <code>&amp;x</code> é o endereço de x; <code>*p</code> é o conteúdo apontado. Aritmética de ponteiros: <code>p+1</code> avança sizeof(tipo) bytes, por isso <code>v[i]</code> equivale a <code>*(v+i)</code>.</p>
<p>Memória: <b>pilha</b> (variáveis locais, liberada automaticamente) e <b>heap</b> (alocação dinâmica com <code>malloc</code>, liberada com <code>free</code>). Erros clássicos:</p>
<ul><li><b>Vazamento</b>: perder a única referência a um bloco sem liberá-lo.</li><li><b>Ponteiro pendente</b>: usar memória após <code>free</code>, ou retornar endereço de variável local.</li><li><b>Dupla liberação</b>: chamar <code>free</code> duas vezes no mesmo bloco.</li></ul>
<p>Linguagens com <b>coleta de lixo</b> (Java, Python) liberam automaticamente objetos sem referências, eliminando vazamentos clássicos e ponteiros pendentes, mas não vazamentos lógicos (referências esquecidas em listas).</p>`],
['Ordenação O(n²)',`<ul><li><b>Bubble sort</b>: troca vizinhos fora de ordem; após cada passada, o maior vai ao fim. Com flag de parada, O(n) em vetor já ordenado.</li><li><b>Selection sort</b>: seleciona o menor e coloca na posição i. Sempre O(n²) comparações, mas só O(n) trocas. Não estável.</li><li><b>Insertion sort</b>: insere cada elemento na posição certa da parte já ordenada. O(n) no melhor caso (já ordenado), ótimo para vetores pequenos ou quase ordenados. Estável.</li></ul>
<p><b>Estabilidade</b>: elementos com chaves iguais mantêm a ordem relativa original. Importa quando se ordena por um critério e depois por outro (ex.: ordenar por nome e depois, de forma estável, por cidade).</p>`],
['Ordenação O(n log n)',`<table class="mini"><tr><th>Algoritmo</th><th>Melhor</th><th>Médio</th><th>Pior</th><th>Memória extra</th><th>Estável</th></tr>
<tr><td>Merge sort</td><td>n log n</td><td>n log n</td><td>n log n</td><td>O(n)</td><td>sim</td></tr>
<tr><td>Quick sort</td><td>n log n</td><td>n log n</td><td><b>n²</b></td><td>O(log n) pilha</td><td>não</td></tr>
<tr><td>Heap sort</td><td>n log n</td><td>n log n</td><td>n log n</td><td>O(1)</td><td>não</td></tr></table>
<p><b>Merge sort</b> é dividir e conquistar: divide ao meio, ordena cada metade e intercala. Recorrência T(n) = 2T(n/2) + n.</p>
<p><b>Quick sort</b> escolhe um pivô, particiona (menores à esquerda, maiores à direita) e recursa. O pior caso acontece quando o pivô é sempre o menor ou o maior elemento, por exemplo pivô = primeiro elemento com vetor já ordenado. Pivô aleatório ou mediana de três evitam isso na prática.</p>
<p>Limite inferior: qualquer ordenação <b>por comparação</b> precisa de Ω(n log n) no pior caso. Counting sort e radix sort fogem desse limite porque não comparam (exigem chaves inteiras em faixa limitada).</p>`],
['Busca',`<p><b>Sequencial</b>: O(n), funciona em qualquer vetor ou lista. <b>Binária</b>: O(log n), exige vetor <b>ordenado</b> e acesso aleatório (não funciona bem em lista encadeada).</p>
<pre>int busca(int v[], int n, int x) {
  int ini = 0, fim = n - 1;
  while (ini &lt;= fim) {
    int meio = ini + (fim - ini) / 2;   // evita overflow
    if (v[meio] == x) return meio;
    if (v[meio] &lt; x) ini = meio + 1; else fim = meio - 1;
  }
  return -1;
}</pre>
<p>Com 1.000.000 de elementos, a busca binária faz no máximo cerca de 20 comparações (2<sup>20</sup> ≈ 10<sup>6</sup>). Se o vetor é buscado muitas vezes, vale ordenar uma vez (O(n log n)) e depois buscar em O(log n).</p>`],
['Strings e arquivos',`<p>Em C, uma string é um vetor de char terminado por <code>'\\0'</code>; “casa” ocupa 5 bytes. <code>strlen</code> não conta o terminador. Copiar sem espaço para ele causa estouro de buffer. Use <code>strncpy</code>/<code>snprintf</code> com tamanho.</p>
<p>Arquivos: <code>fopen</code> (modos r, w, a, rb, wb), leitura/escrita (<code>fscanf</code>, <code>fgets</code>, <code>fread</code>, <code>fprintf</code>, <code>fwrite</code>) e <code>fclose</code>. O modo "w" apaga o conteúdo existente; "a" acrescenta ao final. Sempre teste se <code>fopen</code> retornou NULL.</p>
<p>Arquivos texto guardam caracteres legíveis; arquivos binários guardam a representação em memória (mais compactos e rápidos, mas não portáveis entre arquiteturas).</p>`]],
e:[
['Complexidade e escolha de algoritmos de ordenação',`<p>Questões de cenário: “dados quase ordenados”, “memória limitada”, “precisa ser estável”, “pior caso garantido”. Associe: quase ordenado → insertion; memória O(1) com pior caso garantido → heap sort; estável com n log n → merge sort; mais rápido na média → quick sort.</p><div class="pega">Pegadinha: afirmar que quick sort é sempre O(n log n).</div>`],
['Rastrear recursão',`<p>Calcular o retorno de f(4) ou contar chamadas. Desenhe a árvore de chamadas e resolva de baixo para cima.</p>`],
['Busca binária',`<p>Pré-condição (ordenado), número máximo de comparações (⌊log<sub>2</sub> n⌋ + 1) e erros na implementação (atualizar ini = meio em vez de meio + 1 causa laço infinito).</p>`],
['Gerenciamento de memória',`<p>Identificar vazamento, ponteiro pendente ou estouro de buffer em trechos de C. Também aparece em Segurança (buffer overflow como vulnerabilidade).</p>`],
['Dividir e conquistar e programação dinâmica',`<p>Reconhecer a estratégia de um algoritmo e saber que subproblemas sobrepostos pedem memoização.</p>`]]});

X('parad',{t:[
['O que é um paradigma',`<p>Paradigma é a forma de pensar e estruturar a solução. Uma linguagem pode suportar vários (Python, Scala e JavaScript são multiparadigma). Os dois grandes grupos:</p>
<ul><li><b>Imperativo</b>: diz <i>como</i> fazer, mudando o estado passo a passo. Inclui o procedural/estruturado e o orientado a objetos.</li><li><b>Declarativo</b>: diz <i>o que</i> se quer. Inclui o funcional, o lógico e linguagens como SQL e HTML.</li></ul>`],
['Imperativo e estruturado',`<p>Baseado em variáveis mutáveis, atribuição e comandos executados em sequência. A programação <b>estruturada</b> usa apenas sequência, decisão e repetição, evitando <code>goto</code> (Dijkstra, “Go To Statement Considered Harmful”). Exemplos: C, Pascal, Fortran.</p>
<p>Vantagens: proximidade com o hardware e eficiência. Desvantagens: estado compartilhado dificulta raciocínio e paralelismo.</p>`],
['Funcional',`<p>A computação é a avaliação de funções matemáticas. Conceitos centrais:</p>
<ul><li><b>Funções puras</b>: mesmo resultado para a mesma entrada e nenhum efeito colateral.</li><li><b>Imutabilidade</b>: em vez de alterar dados, cria-se um novo valor.</li><li><b>Transparência referencial</b>: uma expressão pode ser substituída pelo seu valor sem mudar o programa.</li><li><b>Funções de primeira classe e de alta ordem</b>: funções são passadas como argumento e retornadas (map, filter, reduce/fold).</li><li><b>Recursão</b> no lugar de laços; <b>currying</b> (função de vários argumentos vira cadeia de funções de um argumento); <b>closures</b> (função que captura variáveis do ambiente).</li><li><b>Avaliação preguiçosa</b> (lazy, em Haskell): só calcula quando o valor é necessário, permitindo listas infinitas.</li></ul>
<pre>-- Haskell: soma dos quadrados dos pares
somaQ xs = sum (map (^2) (filter even xs))</pre>
<p>Vantagens: código mais fácil de testar e paralelizar. Exemplos: Haskell, Lisp, Erlang, F#, e recursos funcionais em Java (streams), JavaScript e Python.</p>`],
['Lógico',`<p>O programa é um conjunto de <b>fatos</b> e <b>regras</b>; a execução é responder <b>consultas</b> por inferência. O motor usa <b>unificação</b> (casar termos com variáveis) e <b>backtracking</b> (voltar e tentar outra alternativa).</p>
<pre>pai(joao, maria).
pai(maria, ana).
avo(X, Z) :- pai(X, Y), pai(Y, Z).
?- avo(joao, Quem).   % Quem = ana</pre>
<p>Usado em sistemas especialistas, processamento de linguagem natural e prova de teoremas. Linguagem principal: Prolog.</p>`],
['Conceitos de linguagens que caem junto',`<ul><li><b>Tipagem estática</b> (tipos verificados em compilação: Java, C) × <b>dinâmica</b> (em execução: Python, JavaScript).</li><li><b>Tipagem forte</b> (não converte tipos de forma implícita e insegura: Python) × <b>fraca</b> (converte livremente: JavaScript, onde "5" * 2 = 10).</li><li><b>Escopo estático/léxico</b> (a variável é resolvida pelo lugar onde a função foi escrita; quase todas as linguagens) × <b>dinâmico</b> (resolvida pela pilha de chamadas em execução).</li><li><b>Passagem de parâmetros</b>: por valor, por referência, por nome.</li><li><b>Compilação</b>, <b>interpretação</b> e <b>híbrida</b> (bytecode + máquina virtual).</li></ul>`]],
e:[
['Identificar o paradigma por um trecho de código',`<p>Mostram código em Haskell, Prolog, C ou Java e pedem o paradigma ou uma característica dele. Fatos e regras → lógico; map/filter e recursão sem atribuição → funcional.</p>`],
['Função pura e efeitos colaterais',`<p>Avaliar se uma função é pura: ela lê variável global, imprime algo, altera um parâmetro? Então não é pura.</p>`],
['Escopo estático × dinâmico',`<p>Questão clássica com uma variável global e uma local de mesmo nome e uma função que a lê. Com escopo estático, olhe onde a função foi definida; com dinâmico, olhe quem a chamou.</p>`],
['Map, filter, reduce',`<p>Calcular o resultado de uma composição de funções de alta ordem. Aplique uma de cada vez, de dentro para fora.</p>`]]});

X('poo',{t:[
['Classes, objetos e mensagens',`<p>Uma <b>classe</b> é o molde: define atributos (estado) e métodos (comportamento). Um <b>objeto</b> é uma instância com valores próprios. Objetos colaboram trocando <b>mensagens</b> (chamadas de método). <b>Construtores</b> inicializam o objeto.</p>
<p>Membros <b>de instância</b> pertencem a cada objeto; membros <b>estáticos</b> (de classe) são compartilhados por todas as instâncias.</p>`],
['Encapsulamento e abstração',`<p><b>Encapsulamento</b>: o estado interno fica escondido e só é acessado por métodos, que podem validar regras. Modificadores em Java: <code>private</code> (só a classe), <i>default</i> (pacote), <code>protected</code> (pacote + subclasses), <code>public</code> (todos).</p>
<pre>class Conta {
  private double saldo;
  public void sacar(double v) {
    if (v &gt; saldo) throw new IllegalArgumentException("Saldo insuficiente");
    saldo -= v;
  }
}</pre>
<p><b>Abstração</b>: modelar só o que importa para o problema. Benefício principal: baixo <b>acoplamento</b> (mudar a implementação não quebra os clientes) e alta <b>coesão</b> (cada classe tem um propósito).</p>`],
['Herança',`<p>Relação “<b>é um</b>”: a subclasse herda atributos e métodos da superclasse e pode especializá-los. <code>super</code> acessa a versão da superclasse. Java tem herança simples de classes e múltipla de interfaces; C++ permite herança múltipla de classes (com o problema do diamante).</p>
<p>Herança cria acoplamento forte. Quando a relação é “<b>tem um</b>” (carro tem motor), use <b>composição</b>. Princípio: “prefira composição a herança”.</p>`],
['Polimorfismo',`<ul><li><b>Sobrescrita</b> (overriding): a subclasse redefine um método com a mesma assinatura. A versão executada depende do tipo do <b>objeto</b>, decidido em tempo de execução (<b>ligação dinâmica</b>).</li><li><b>Sobrecarga</b> (overloading): mesmo nome, parâmetros diferentes. Decidida em compilação pelo tipo <b>declarado</b> dos argumentos.</li><li><b>Paramétrico</b>: generics (<code>List&lt;T&gt;</code>).</li></ul>
<pre>Animal a = new Cachorro();
a.som();          // executa Cachorro.som() (ligação dinâmica)
a.latir();        // erro de compilação: Animal não declara latir()</pre>
<p>Regra de ouro: o tipo <b>declarado</b> define o que pode ser chamado; o tipo <b>real</b> define qual implementação roda.</p>`],
['Classes abstratas e interfaces',`<p><b>Classe abstrata</b>: não pode ser instanciada; pode ter atributos, construtores, métodos concretos e métodos abstratos. <b>Interface</b>: contrato de métodos que a classe promete implementar; uma classe pode implementar várias. Use interface para “o que um objeto sabe fazer” (Comparable, Runnable) e classe abstrata para compartilhar código entre classes muito parecidas.</p>`],
['SOLID',`<ul><li><b>S – Responsabilidade única</b>: uma classe deve ter um único motivo para mudar.</li><li><b>O – Aberto/fechado</b>: aberta para extensão, fechada para modificação (novos comportamentos por novas classes, não por if/else crescentes).</li><li><b>L – Substituição de Liskov</b>: subclasses devem poder substituir a superclasse sem quebrar o comportamento esperado (o clássico Quadrado × Retângulo viola).</li><li><b>I – Segregação de interfaces</b>: várias interfaces específicas são melhores que uma interface “gorda”.</li><li><b>D – Inversão de dependência</b>: dependa de abstrações, não de implementações concretas (base da injeção de dependência).</li></ul>`],
['Padrões de projeto (GoF)',`<table class="mini"><tr><th>Grupo</th><th>Padrão</th><th>Quando usar</th></tr>
<tr><td rowspan="3">Criacionais</td><td>Singleton</td><td>uma única instância com acesso global</td></tr><tr><td>Factory Method</td><td>subclasses decidem qual objeto criar</td></tr><tr><td>Builder</td><td>construir objetos complexos passo a passo</td></tr>
<tr><td rowspan="4">Estruturais</td><td>Adapter</td><td>compatibilizar interfaces incompatíveis</td></tr><tr><td>Decorator</td><td>adicionar responsabilidades dinamicamente sem subclasses</td></tr><tr><td>Facade</td><td>interface simples para um subsistema complexo</td></tr><tr><td>Composite</td><td>tratar parte e todo de forma uniforme (árvores)</td></tr>
<tr><td rowspan="4">Comportamentais</td><td>Observer</td><td>notificar vários interessados quando algo muda</td></tr><tr><td>Strategy</td><td>trocar algoritmos em tempo de execução</td></tr><tr><td>Template Method</td><td>esqueleto fixo com passos definidos por subclasses</td></tr><tr><td>Command</td><td>encapsular uma ação como objeto (desfazer, filas)</td></tr></table>`]],
e:[
['Saída de código com herança e polimorfismo',`<p>A questão mais comum: classes A e B com métodos sobrescritos e chamadas por referência do tipo da superclasse. Lembre da ligação dinâmica e de quando <code>super</code> é chamado.</p><div class="pega">Pegadinha: métodos <code>static</code> e atributos não são polimórficos em Java; seguem o tipo declarado.</div>`],
['Sobrecarga × sobrescrita',`<p>Assertivas que trocam os conceitos ou dizem que a sobrecarga é resolvida em execução.</p>`],
['Padrão de projeto adequado a um cenário',`<p>Descrevem um problema (“notificar várias telas”, “integrar biblioteca com interface diferente”, “trocar algoritmo de frete”) e pedem o padrão. Decore a intenção de Observer, Strategy, Adapter, Singleton, Factory, Decorator e Facade.</p>`],
['Princípios SOLID e diagrama de classes',`<p>Identificar a violação em um código ou modelo. Também cruzam com UML: herança, associação, agregação e composição.</p>`]]});

X('ed',{t:[
['Análise de complexidade',`<p>Medimos quanto o custo (tempo ou memória) cresce em função do tamanho n da entrada, ignorando constantes.</p>
<ul><li><b>O(f)</b>: limite superior (“no máximo da ordem de f”). <b>Ω(f)</b>: limite inferior. <b>Θ(f)</b>: limite justo (as duas coisas).</li><li>Melhor caso, caso médio e pior caso são análises diferentes. Busca sequencial: melhor O(1), pior O(n).</li></ul>
<table class="mini"><tr><th>Ordem</th><th>Exemplo típico</th><th>n = 1.000.000</th></tr><tr><td>O(1)</td><td>acesso a vetor, push em pilha</td><td>1</td></tr><tr><td>O(log n)</td><td>busca binária, operação em árvore balanceada</td><td>≈ 20</td></tr><tr><td>O(n)</td><td>percorrer lista</td><td>10<sup>6</sup></td></tr><tr><td>O(n log n)</td><td>merge sort</td><td>≈ 2×10<sup>7</sup></td></tr><tr><td>O(n²)</td><td>dois laços aninhados</td><td>10<sup>12</sup></td></tr><tr><td>O(2<sup>n</sup>)</td><td>todos os subconjuntos</td><td>inviável</td></tr></table>
<p>Regras práticas: laços em sequência somam (fica o maior termo); laços aninhados multiplicam; uma variável que dobra ou cai pela metade a cada passo dá log n. <b>Custo amortizado</b>: o vetor dinâmico que dobra de tamanho tem inserção O(1) amortizada, embora uma inserção isolada possa custar O(n).</p>`],
['Pilhas e filas',`<p><b>Pilha (LIFO)</b>: push, pop e top em O(1). Usos: pilha de chamadas, desfazer/refazer, verificação de parênteses balanceados, conversão e avaliação de expressões pós-fixas (notação polonesa reversa), DFS iterativa.</p>
<div class="ex">Avaliar “3 4 + 2 *”: empilha 3, empilha 4, “+” desempilha 4 e 3 e empilha 7, empilha 2, “*” → 14.</div>
<p><b>Fila (FIFO)</b>: enqueue e dequeue em O(1). Implementada com vetor circular (índices início e fim com módulo) ou lista encadeada. Usos: BFS, buffers, escalonamento Round Robin, filas de impressão. <b>Deque</b> permite inserir e remover nas duas pontas. <b>Fila de prioridade</b> remove sempre o de maior prioridade (implementada com heap).</p>`],
['Listas encadeadas',`<p>Nós espalhados na memória ligados por ponteiros. Variações: simples, <b>duplamente encadeada</b> (ponteiros para anterior e próximo; remoção de um nó conhecido em O(1)), <b>circular</b>, com nó sentinela (cabeça) para simplificar casos de borda.</p>
<table class="mini"><tr><th>Operação</th><th>Vetor</th><th>Lista encadeada</th></tr><tr><td>Acesso ao i-ésimo</td><td>O(1)</td><td>O(n)</td></tr><tr><td>Inserir/remover no início</td><td>O(n)</td><td>O(1)</td></tr><tr><td>Inserir/remover no meio (com o nó em mãos)</td><td>O(n)</td><td>O(1)</td></tr><tr><td>Busca</td><td>O(n) ou O(log n) se ordenado</td><td>O(n)</td></tr><tr><td>Uso de cache</td><td>ótimo (contíguo)</td><td>ruim</td></tr></table>
<p>Inserir no início de uma lista simples: <code>novo-&gt;prox = cabeca; cabeca = novo;</code>. A ordem dessas linhas importa: invertê-las perde a lista.</p>`],
['Árvores binárias e de busca',`<p>Termos: raiz, folha, altura (maior caminho raiz-folha), nível, grau. Uma árvore binária com altura h tem no máximo 2<sup>h+1</sup> − 1 nós; com n nós, a altura mínima é ⌊log<sub>2</sub> n⌋.</p>
<p><b>Percursos</b>: pré-ordem (raiz, esq, dir), em-ordem (esq, raiz, dir), pós-ordem (esq, dir, raiz) e por nível (BFS com fila). Pré-ordem copia a árvore; pós-ordem libera memória ou avalia árvore de expressão.</p>
<p><b>Árvore binária de busca (BST)</b>: tudo à esquerda é menor, tudo à direita é maior. Busca, inserção e remoção custam O(h). Inserir dados já ordenados gera uma árvore degenerada (uma “lista”), com h = n.</p>
<p>Remoção na BST: folha → remove; um filho → o filho sobe; dois filhos → troca pelo <b>sucessor</b> (menor da subárvore direita) ou antecessor e remove esse.</p>`],
['Árvores balanceadas',`<p><b>AVL</b>: para todo nó, |altura(esq) − altura(dir)| ≤ 1. Após inserção ou remoção, rotações restauram o equilíbrio:</p>
<ul><li>Desbalanceamento esquerda-esquerda → rotação simples à direita.</li><li>Direita-direita → rotação simples à esquerda.</li><li>Esquerda-direita ou direita-esquerda → rotação dupla.</li></ul>
<p>Garante altura O(log n). <b>Rubro-negra</b>: regras de cor que garantem altura ≤ 2 log(n+1); usada em bibliotecas (TreeMap do Java, std::map do C++). <b>Árvore B / B+</b>: nós com muitas chaves, baixa altura, ideal para disco; base dos índices de bancos de dados.</p>`],
['Heap e tabela hash',`<p><b>Heap binário</b>: árvore binária completa guardada em vetor (filhos de i em 2i+1 e 2i+2, pai em ⌊(i−1)/2⌋). No max-heap, cada pai ≥ filhos. Inserir: coloca no fim e “sobe” (O(log n)). Remover o máximo: troca a raiz pelo último e “desce” (O(log n)). Construir um heap a partir de um vetor: O(n).</p>
<p><b>Tabela hash</b>: uma função h(chave) indica a posição. Busca, inserção e remoção em O(1) <b>no caso médio</b>. Colisões são inevitáveis:</p>
<ul><li><b>Encadeamento separado</b>: cada posição guarda uma lista.</li><li><b>Endereçamento aberto</b>: procura outra posição (sondagem linear, quadrática, hash duplo). A remoção precisa de marcação especial.</li></ul>
<p>O <b>fator de carga</b> α = n/m (elementos/posições) controla o desempenho; ao passar de um limite (ex.: 0,75), a tabela é redimensionada (rehash). Hash não mantém ordem: para “listar em ordem” ou buscar por intervalo, prefira árvore balanceada.</p>`]],
e:[
['Escolher a estrutura para um cenário',`<p>É a questão mais típica. Associações que você deve ter prontas:</p><ul><li>desfazer, chamadas aninhadas, parênteses → pilha</li><li>atendimento por ordem de chegada, BFS → fila</li><li>sempre pegar o mais urgente → heap/fila de prioridade</li><li>busca rápida por chave, sem ordem → hash</li><li>busca rápida e listagem ordenada ou por intervalo → árvore balanceada</li><li>muitas inserções/remoções no meio → lista encadeada</li></ul>`],
['Percursos e construção de BST',`<p>Inserir uma sequência em BST e pedir o percurso pré, em ou pós-ordem. Ou dar dois percursos e pedir a árvore. Desenhe sempre.</p><div class="pega">Pegadinha: confundir pré-ordem com percurso por nível.</div>`],
['Complexidade de trechos de código',`<p>Dar um código com laços e pedir a ordem de complexidade. Atenção a laços com i *= 2 (log n) e a laços internos que dependem do externo.</p>`],
['AVL e rotações',`<p>Inserir valores em AVL e identificar qual rotação ocorre e a raiz final.</p>`],
['Hash: colisões e fator de carga',`<p>Assertivas sobre pior caso O(n), sondagem linear e agrupamento primário, e por que hash não serve para consultas por intervalo.</p>`]]});

X('grafos',{t:[
['Definições essenciais',`<p>Um grafo G = (V, E) tem vértices e arestas. Pode ser <b>dirigido</b> (dígrafo) ou não, <b>ponderado</b> (arestas com peso) ou não, <b>simples</b> (sem laços nem arestas múltiplas).</p>
<ul><li><b>Grau</b>: número de arestas incidentes. Em dígrafos, grau de entrada e de saída.</li><li><b>Lema do aperto de mãos</b>: Σ graus = 2|E|. Logo, o número de vértices de grau ímpar é sempre par.</li><li>Grafo simples com n vértices tem no máximo n(n−1)/2 arestas (grafo <b>completo</b> K<sub>n</sub>).</li><li><b>Conexo</b>: existe caminho entre qualquer par. Em dígrafos, <b>fortemente conexo</b> se existe caminho nos dois sentidos.</li><li><b>Árvore</b>: conexo e acíclico, com n − 1 arestas; existe exatamente um caminho entre cada par.</li><li><b>Bipartido</b>: vértices divididos em dois grupos com arestas só entre grupos; equivale a não ter ciclo ímpar.</li></ul>`],
['Representações',`<table class="mini"><tr><th></th><th>Matriz de adjacência</th><th>Lista de adjacência</th></tr><tr><td>Espaço</td><td>O(V²)</td><td>O(V + E)</td></tr><tr><td>Existe aresta (u,v)?</td><td>O(1)</td><td>O(grau(u))</td></tr><tr><td>Percorrer vizinhos</td><td>O(V)</td><td>O(grau)</td></tr><tr><td>Melhor para</td><td>grafos densos</td><td>grafos esparsos (a maioria dos reais)</td></tr></table>
<p>Na matriz de um grafo não dirigido, a matriz é simétrica. A soma de uma linha é o grau do vértice.</p>`],
['Busca em largura e em profundidade',`<p><b>BFS</b> usa fila e visita os vértices por camadas de distância. Em grafo não ponderado, dá o <b>menor caminho em número de arestas</b>. Também testa se o grafo é bipartido.</p>
<p><b>DFS</b> usa pilha ou recursão e vai fundo antes de voltar. Usos: detectar ciclos (aresta de retorno), ordenação topológica (ordem decrescente de término), componentes conexos e fortemente conexos (Kosaraju, Tarjan), pontes e articulações.</p>
<p>Ambas custam O(V + E) com lista de adjacência e O(V²) com matriz.</p>
<p><b>Ordenação topológica</b> só existe em grafos dirigidos <b>acíclicos</b> (DAG). Algoritmo de Kahn: repetidamente remova um vértice com grau de entrada zero. Se sobrar vértice, há ciclo.</p>`],
['Caminhos mínimos',`<table class="mini"><tr><th>Algoritmo</th><th>Problema</th><th>Pesos negativos</th><th>Complexidade</th></tr><tr><td>BFS</td><td>origem única, sem pesos</td><td>—</td><td>O(V+E)</td></tr><tr><td>Dijkstra</td><td>origem única</td><td><b>não</b></td><td>O((V+E) log V) com heap</td></tr><tr><td>Bellman-Ford</td><td>origem única</td><td>sim, detecta ciclo negativo</td><td>O(V·E)</td></tr><tr><td>Floyd-Warshall</td><td>todos os pares</td><td>sim (sem ciclo negativo)</td><td>O(V³)</td></tr></table>
<p><b>Dijkstra passo a passo</b>: distância 0 na origem, ∞ nos demais. Repita: pegue o vértice não visitado de menor distância, marque como definitivo e <b>relaxe</b> suas arestas (se d[u] + w(u,v) &lt; d[v], atualize d[v]). É guloso: por isso um peso negativo pode “desfazer” uma escolha já fechada.</p>`],
['Árvore geradora mínima',`<p>Conecta todos os vértices com custo total mínimo e sem ciclos (V − 1 arestas). Aplicações: cabeamento de rede, estradas, agrupamento.</p>
<ul><li><b>Kruskal</b>: ordena as arestas por peso e adiciona a próxima que não forma ciclo (verificação com union-find). O(E log E).</li><li><b>Prim</b>: começa em um vértice e sempre adiciona a aresta mais barata que liga a árvore a um vértice novo. O(E log V) com heap.</li></ul>
<p>Se todos os pesos são distintos, a AGM é única. Caminho mínimo e AGM são problemas diferentes: a AGM não garante o menor caminho entre dois vértices.</p>`],
