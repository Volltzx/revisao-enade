T('bd',[
['Para que serve esta matéria',`<p>Banco de Dados ensina a <b>guardar e consultar informações</b> de forma organizada. No ENADE, cai em quase toda prova: modelagem, SQL, álgebra relacional e normalização.</p>
<div class="ideia">Um banco relacional é um conjunto de planilhas (tabelas) ligadas entre si. Cada linha é um registro; cada coluna é um atributo.</div>
<ul><li><b>Chave primária (PK)</b>: identifica cada linha de forma única (como o CPF).</li><li><b>Chave estrangeira (FK)</b>: uma coluna que aponta para a chave primária de outra tabela, ligando as duas.</li></ul>
<div class="resumo">Tabela = entidade. Linha = registro. PK identifica. FK liga tabelas.</div>`],
['Modelagem: do diagrama às tabelas',`<p>No <b>modelo entidade-relacionamento (ER)</b> desenhamos entidades (Aluno, Disciplina) e relacionamentos (Aluno <i>cursa</i> Disciplina), com cardinalidades:</p>
<table class="mini"><tr><th>Cardinalidade</th><th>Exemplo</th><th>Como vira tabela</th></tr><tr><td>1:1</td><td>Pessoa – CPF</td><td>FK em qualquer um dos lados</td></tr><tr><td>1:N</td><td>Cliente – Pedidos</td><td>FK no lado <b>N</b> (Pedido tem id_cliente)</td></tr><tr><td>N:N</td><td>Aluno – Disciplina</td><td><b>tabela nova</b> no meio (Matricula com id_aluno e id_disciplina)</td></tr></table>
<div class="ideia">N:N precisa de uma tabela no meio, como a lista de chamada: cada linha diz “este aluno está nesta disciplina”.</div>
<div class="resumo">1:N → FK no lado N. N:N → tabela associativa.</div>`],
['SQL essencial',`<pre>SELECT colunas
FROM tabela
WHERE filtro de linhas
GROUP BY coluna
HAVING filtro de grupos
ORDER BY coluna;</pre>
<ul><li><b>WHERE</b> filtra <b>linhas</b>, antes de agrupar.</li><li><b>GROUP BY</b> junta linhas com o mesmo valor.</li><li><b>HAVING</b> filtra <b>grupos</b>, depois de agrupar. É onde ficam condições com COUNT, SUM, AVG.</li></ul>
<div class="ex">Departamentos com mais de 10 funcionários:<br><code>SELECT depto, COUNT(*) FROM func GROUP BY depto HAVING COUNT(*) &gt; 10</code></div>
<div class="pega">COUNT, SUM e AVG não podem ir no WHERE. Condição sobre total de grupo vai no HAVING.</div>
<div class="resumo">WHERE = antes de agrupar (linhas). HAVING = depois de agrupar (grupos).</div>`],
['JOINs: juntando tabelas',`<ul><li><b>INNER JOIN</b>: só as linhas que têm par nas duas tabelas.</li><li><b>LEFT JOIN</b>: todas as linhas da tabela da esquerda, mesmo sem par (o lado direito vem NULL).</li><li><b>RIGHT JOIN</b>: o contrário.</li></ul>
<div class="ideia">Lista de convidados (esquerda) e lista de presentes recebidos (direita). INNER: só quem trouxe presente. LEFT: todos os convidados, com “nenhum” para quem não trouxe.</div>
<div class="ex">Todos os clientes com a quantidade de pedidos, inclusive os sem pedido:<br><code>SELECT c.nome, COUNT(p.id) FROM Cliente c LEFT JOIN Pedido p ON p.id_cliente = c.id GROUP BY c.id, c.nome</code></div>
<div class="pega"><b>COUNT(p.id)</b> ignora NULL e dá 0 para quem não tem pedido. <b>COUNT(*)</b> contaria a linha e daria 1.</div>
<div class="resumo">“Todos, inclusive os que não têm” → LEFT JOIN + COUNT(coluna da direita).</div>`],
['Álgebra relacional',`<table class="mini"><tr><th>Operação</th><th>Símbolo</th><th>Faz</th><th>Em SQL</th></tr><tr><td>Seleção</td><td>σ</td><td>escolhe <b>linhas</b></td><td>WHERE</td></tr><tr><td>Projeção</td><td>π</td><td>escolhe <b>colunas</b></td><td>SELECT colunas</td></tr><tr><td>Junção</td><td>⨝</td><td>junta tabelas</td><td>JOIN</td></tr><tr><td>União / Diferença</td><td>∪ / −</td><td>junta / tira linhas</td><td>UNION / EXCEPT</td></tr></table>
<div class="pega">Pegadinha clássica: a <b>seleção</b> (σ) corresponde ao <b>WHERE</b>, e não ao SELECT. O SELECT do SQL corresponde à <b>projeção</b> (π).</div>
<div class="resumo">σ = linhas (WHERE). π = colunas (SELECT).</div>`],
['Normalização: 1FN, 2FN e 3FN',`<p>Normalizar é dividir tabelas para <b>evitar repetição</b> e erros na hora de atualizar. Uma <b>dependência</b> A → B quer dizer “sabendo A, eu sei B”.</p>
<ul><li><b>1FN</b>: cada célula tem <b>um valor só</b> (nada de “telefones: 1111, 2222” na mesma célula).</li><li><b>2FN</b>: está na 1FN e nenhuma coluna depende só de <b>parte</b> de uma chave composta.</li><li><b>3FN</b>: está na 2FN e nenhuma coluna não-chave depende de <b>outra coluna não-chave</b> (dependência transitiva).</li></ul>
<div class="ideia">Regra de bolso: cada coluna deve depender “da chave, da chave inteira e de nada além da chave”.</div>
<div class="ex">Pedido(num_pedido, cod_cliente, nome_cliente): nome_cliente depende de cod_cliente, que não é a chave. Isso é transitivo → viola a <b>3FN</b>. Solução: criar a tabela Cliente(cod_cliente, nome_cliente).</div>
<div class="ex">R(<u>A, B</u>, C, D) com B → D: D depende de <b>parte</b> da chave → viola a <b>2FN</b>.</div>
<div class="resumo">Parte da chave → 2FN. Coluna comum dependendo de coluna comum → 3FN.</div>`]
]);
P('bd',[
['Lembre: seleção escolhe linhas, projeção escolhe colunas.','A pergunta quer selecionar colunas.','Resposta: projeção (π).'],
['Relacionamento N:N não cabe numa FK simples.','Cria-se uma tabela no meio com FKs para as duas tabelas.','Ex.: Matricula(id_aluno, id_disciplina).'],

N('bd',[
{n:1,q:`A coluna que identifica de forma única cada linha de uma tabela é a:`,a:['*chave primária','chave estrangeira','coluna de índice secundário','visão (view)','atributo multivalorado'],e:`A chave primária não se repete e não pode ser nula.`,p:['Identificar cada linha de forma única é a função de uma chave.','A chave que identifica a própria tabela é a primária.','A estrangeira aponta para outra tabela.']},
{n:1,q:`Em um relacionamento 1:N entre Cliente (1) e Pedido (N), a chave estrangeira deve ficar em:`,a:['*Pedido, referenciando Cliente','Cliente, referenciando Pedido','uma nova tabela associativa obrigatória','nas duas tabelas','em nenhuma tabela'],e:`A FK vai no lado N: cada pedido guarda o id do seu cliente.`,p:['Regra: em 1:N, a FK fica no lado N.','O lado N é Pedido (um cliente tem vários pedidos).','Pedido recebe a coluna id_cliente.']},
{n:2,q:`Qual consulta retorna o nome dos produtos com preço acima de 100, em ordem alfabética?`,a:['*SELECT nome FROM produto WHERE preco &gt; 100 ORDER BY nome','SELECT nome FROM produto HAVING preco &gt; 100 ORDER BY nome','SELECT nome FROM produto ORDER BY nome WHERE preco &gt; 100','SELECT nome FROM produto GROUP BY preco &gt; 100','SELECT * FROM nome WHERE produto &gt; 100'],e:`Filtro de linhas no WHERE; ORDER BY sempre no final.`,p:['O filtro é sobre cada linha (preço de cada produto): vai no WHERE.','A ordenação vem por último: ORDER BY nome.','A ordem correta das cláusulas é SELECT, FROM, WHERE, ORDER BY.']},
{n:2,q:`Tabelas Aluno(5 alunos) e Matricula(registros só de 3 desses alunos). Um INNER JOIN entre Aluno e Matricula pelo id do aluno retorna linhas de:`,a:['*apenas os alunos que têm matrícula','todos os 5 alunos','nenhum aluno','apenas os alunos sem matrícula','todas as combinações possíveis'],e:`INNER JOIN só mantém linhas com correspondência nas duas tabelas.`,p:['INNER JOIN exige par nas duas tabelas.','Só 3 alunos aparecem em Matricula.','Somente esses aparecem no resultado.']},
{n:2,q:`Uma tabela Cliente tem a coluna telefones com valores como “1111-1111, 2222-2222”. Ela viola a:`,a:['*1FN, por ter atributo multivalorado','2FN','3FN','BCNF apenas','nenhuma forma normal'],e:`A 1FN exige valores atômicos (um valor por célula).`,p:['Repare: dois telefones na mesma célula.','A 1FN exige um valor só por célula.','Viola a 1FN. Solução: tabela Telefone(id_cliente, numero).']},
{n:3,q:`Na expressão π<sub>nome</sub>(σ<sub>idade &gt; 18</sub>(Pessoa)), o resultado corresponde a:`,a:['*SELECT nome FROM Pessoa WHERE idade &gt; 18','SELECT * FROM Pessoa WHERE nome &gt; 18','SELECT idade FROM Pessoa WHERE nome','SELECT nome, idade FROM Pessoa','SELECT nome FROM Pessoa GROUP BY idade'],e:`σ filtra linhas (WHERE idade &gt; 18); π escolhe a coluna nome.`,p:['Resolva de dentro para fora: σ<sub>idade &gt; 18</sub> = WHERE idade &gt; 18.','Depois π<sub>nome</sub> = mostrar só a coluna nome.','Junte: SELECT nome FROM Pessoa WHERE idade &gt; 18.']}
]);

T('bd2',[
['Para que serve esta matéria',`<p>Banco de Dados II trata do que acontece <b>por dentro</b> do banco: transações, controle de concorrência, recuperação de falhas, índices e bancos NoSQL.</p>
<div class="resumo">No ENADE: propriedades ACID, níveis de isolamento e suas anomalias, índices (B+ × hash) e NoSQL.</div>`],
['Transações e ACID',`<p>Uma <b>transação</b> é um conjunto de operações que deve acontecer como se fosse uma só. Ela precisa ser <b>ACID</b>:</p>
<ul><li><b>A – Atomicidade</b>: tudo ou nada. Se algo falhar no meio, tudo é desfeito.</li><li><b>C – Consistência</b>: o banco sai de um estado válido para outro válido (as regras continuam valendo).</li><li><b>I – Isolamento</b>: transações ao mesmo tempo não atrapalham umas às outras.</li><li><b>D – Durabilidade</b>: depois de confirmada (commit), não se perde, nem se faltar energia.</li></ul>
<div class="ex">Transferência de R$ 100 de A para B: debitar A e creditar B. Se o sistema cai depois de debitar, o débito é desfeito (<b>atomicidade</b>). Depois do commit, a transferência sobrevive a uma queda (<b>durabilidade</b>).</div>
<div class="ideia">Atomicidade é como um pedido de comida: ou chega o pedido completo, ou o restaurante cancela tudo e devolve o dinheiro. Não chega metade.</div>
<div class="resumo">Desfazer o incompleto = atomicidade. Não perder o confirmado = durabilidade.</div>`],
['Isolamento e anomalias',`<p>Quando várias transações rodam juntas, podem aparecer problemas:</p>
<ul><li><b>Leitura suja</b>: ler um dado que outra transação alterou mas <b>ainda não confirmou</b> (e pode desfazer).</li><li><b>Leitura não repetível</b>: ler o mesmo dado duas vezes e ele <b>mudar</b> no meio, porque outra transação alterou e confirmou.</li><li><b>Leitura fantasma</b>: repetir uma consulta e <b>aparecerem linhas novas</b>.</li></ul>
<table class="mini"><tr><th>Nível</th><th>Impede</th></tr><tr><td>Read uncommitted</td><td>nada</td></tr><tr><td>Read committed</td><td>leitura suja</td></tr><tr><td>Repeatable read</td><td>+ leitura não repetível</td></tr><tr><td>Serializable</td><td>+ fantasma (tudo)</td></tr></table>
<div class="ideia">Leitura suja é ler o rascunho de alguém antes de ele decidir se vai publicar. Se ele apagar, você leu algo que nunca existiu.</div>
<div class="resumo">Cada nível impede uma anomalia a mais: suja → não repetível → fantasma.</div>`],
['Índices',`<p>Um <b>índice</b> é uma estrutura extra que acelera buscas, como o índice no fim de um livro.</p>
<ul><li><b>Árvore B+</b>: mantém as chaves <b>ordenadas</b> e as folhas ligadas em sequência. Ótima para igualdade <b>e intervalos</b> (BETWEEN, &gt;, &lt;, ORDER BY).</li><li><b>Hash</b>: vai direto à chave. Ótimo <b>só para igualdade</b> (=). Não ajuda em intervalos.</li></ul>
<div class="ex">WHERE data BETWEEN '2026-01-01' AND '2026-06-30' → árvore B+ na coluna data.</div>
<div class="pega">Índice acelera a leitura, mas <b>deixa a escrita mais lenta</b> (cada INSERT/UPDATE também atualiza o índice) e ocupa espaço.</div>
<div class="resumo">Intervalo ou ordenação → B+. Só igualdade → hash.</div>`],
['Recuperação e NoSQL',`<p>O banco grava um <b>log</b> de tudo antes de alterar os dados (write-ahead log). Depois de uma queda:</p>
<ul><li><b>REDO</b>: refaz as transações confirmadas que não chegaram ao disco (garante durabilidade).</li><li><b>UNDO</b>: desfaz as transações incompletas (garante atomicidade).</li></ul>
<p><b>NoSQL</b> são bancos não relacionais, feitos para escala e flexibilidade:</p>
<table class="mini"><tr><th>Tipo</th><th>Exemplo</th><th>Bom para</th></tr><tr><td>Chave-valor</td><td>Redis</td><td>cache, sessões</td></tr><tr><td>Documento</td><td>MongoDB</td><td>dados em JSON com formato variável</td></tr><tr><td>Colunar</td><td>Cassandra</td><td>grandes volumes de escrita</td></tr><tr><td>Grafo</td><td>Neo4j</td><td>relações (redes sociais, recomendação)</td></tr></table>
<p>Muitos NoSQL seguem <b>BASE</b> (disponível, consistência eventual) em vez de ACID estrito.</p>
<div class="resumo">REDO = refaz confirmadas. UNDO = desfaz incompletas. NoSQL: escolha pelo formato dos dados.</div>`]
]);
P('bd2',[
['Palavra-chave: “não serão perdidos mesmo após queda”.','Manter o que foi confirmado é a durabilidade.','Atomicidade seria desfazer o incompleto.'],
['A transação ficou pela metade (só debitou).','Na recuperação, ela foi desfeita por inteiro.','Tudo ou nada = atomicidade.'],
['A consulta usa um intervalo (BETWEEN).','A árvore B+ mantém as datas ordenadas, então percorre o intervalo rapidamente.','O índice hash só serve para igualdade.'],
['T1 leu um dado não confirmado, que depois foi desfeito: leitura suja.','O nível que só deixa ler dados confirmados é o read committed.','Resposta: leitura suja, impedida a partir de read committed.']
]);
N('bd2',[
{n:1,q:`O comando SQL que confirma definitivamente as operações de uma transação é:`,a:['*COMMIT','ROLLBACK','SELECT','GRANT','DROP'],e:`COMMIT confirma; ROLLBACK desfaz.`,p:['Lembre os comandos de transação.','COMMIT confirma; ROLLBACK desfaz.','Resposta: COMMIT.']},
{n:1,q:`Um banco que armazena dados como documentos JSON, com estrutura flexível, é um exemplo de NoSQL do tipo:`,a:['*documento, como o MongoDB','grafo, como o Neo4j','chave-valor, como o Redis','relacional, como o PostgreSQL','colunar, como o Cassandra'],e:`Bancos de documentos guardam objetos JSON/BSON.`,p:['Palavra-chave: documentos JSON.','O tipo NoSQL que guarda documentos é o orientado a documentos.','Exemplo clássico: MongoDB.']},
{n:2,q:`A transação T1 lê o saldo (R$ 100). T2 altera o saldo para R$ 50 e faz COMMIT. T1 lê o saldo de novo e obtém R$ 50. Essa anomalia é:`,a:['*leitura não repetível','leitura suja','leitura fantasma','deadlock','atualização perdida'],e:`O mesmo dado lido duas vezes mudou porque outra transação confirmou uma alteração.`,p:['T1 leu o mesmo dado duas vezes e ele mudou.','A alteração de T2 foi confirmada, então não é leitura suja.','Dado que muda entre duas leituras = leitura não repetível.']},
{n:2,q:`Uma tabela recebe milhares de INSERTs por segundo e quase nunca é consultada. Criar muitos índices nela tende a:`,a:['*deixar as inserções mais lentas, sem benefício relevante','acelerar as inserções','não ter nenhum efeito','eliminar a necessidade de chave primária','garantir a durabilidade das transações'],e:`Cada índice precisa ser atualizado a cada INSERT.`,p:['Índices ajudam leituras, mas cada escrita precisa atualizar todos eles.','Aqui há muitas escritas e quase nenhuma leitura.','Resultado: só custo, quase sem ganho.']},
{n:2,q:`Na recuperação após uma falha, uma transação que já tinha feito COMMIT, mas cujas alterações não chegaram ao disco, deve ser:`,a:['*refeita (REDO), garantindo a durabilidade','desfeita (UNDO), garantindo a atomicidade','ignorada','reiniciada pelo usuário','convertida em leitura suja'],e:`O que foi confirmado precisa sobreviver: o log permite refazer.`,p:['A transação foi confirmada (COMMIT).','O que foi confirmado não pode se perder: durabilidade.','Por isso o banco refaz (REDO) usando o log.']},
{n:3,q:`Uma rede social precisa responder rapidamente a “amigos de amigos que curtem a mesma banda”. O tipo de banco mais adequado é:`,a:['*orientado a grafos, como o Neo4j','chave-valor, como o Redis','colunar, como o Cassandra','planilha eletrônica','arquivo de texto sequencial'],e:`Consultas de relacionamentos em vários níveis são o ponto forte dos bancos de grafo.`,p:['A consulta percorre relações: pessoa → amigo → amigo → banda.','Percorrer relações em vários níveis é o forte dos bancos de grafo.','Exemplo: Neo4j.']}
]);
// Lote 4: engenharia de software, teoria e IA (linguagem simples)
T('es1',[
['Para que serve esta matéria',`<p>Engenharia de Software I ensina a <b>planejar e organizar</b> a construção de um sistema: entender o que o cliente quer (requisitos), escolher um processo de trabalho e desenhar o sistema (UML).</p>
<div class="ideia">Ninguém constrói um prédio começando pelos tijolos. Primeiro entende o que o dono quer, faz a planta e organiza as etapas da obra. Software é igual.</div>
<div class="resumo">No ENADE: requisito funcional × não funcional, cascata × ágil, Scrum e diagramas UML.</div>`],
['Requisitos',`<ul><li><b>Funcional</b>: o que o sistema <b>faz</b>. “O sistema deve emitir boleto.” “O usuário pode redefinir a senha.”</li><li><b>Não funcional</b>: <b>como</b> o sistema deve ser (qualidade). “Responder em até 2 segundos.” “Funcionar 99,9% do tempo.” “Ser usável em celular.”</li></ul>
<div class="ideia">Num carro, “ter freio” é funcional. “Frear de 100 km/h a 0 em 40 metros” é não funcional: fala da qualidade do freio.</div>
<div class="pega">Se a frase tem número de desempenho, segurança, disponibilidade ou usabilidade, quase sempre é <b>não funcional</b>.</div>
<div class="resumo">Funcional = ação do sistema. Não funcional = qualidade ou restrição.</div>`],
['Processos: cascata e ágil',`<ul><li><b>Cascata</b>: etapas em sequência (requisitos → projeto → código → teste → implantação). Só passa para a próxima ao terminar a anterior. Bom quando os requisitos são <b>estáveis</b> e bem conhecidos.</li><li><b>Incremental / iterativo</b>: entrega o sistema em partes que vão crescendo.</li><li><b>Espiral</b>: ciclos com foco em <b>análise de riscos</b>.</li><li><b>Ágil</b> (Scrum, XP, Kanban): entregas curtas e frequentes, cliente perto, aceita mudanças.</li></ul>
<div class="ideia">Cascata é encomendar um bolo de casamento com tudo decidido meses antes. Ágil é um rodízio de pizza: vem uma de cada vez e você vai pedindo o que quer.</div>
<div class="resumo">Requisitos mudam muito → ágil. Requisitos fixos e bem definidos → cascata pode servir.</div>`],
['Scrum',`<p><b>Papéis</b>:</p>
<ul><li><b>Product Owner (PO)</b>: representa o cliente e <b>prioriza o Product Backlog</b> (a lista de tudo que o produto deve ter).</li><li><b>Scrum Master</b>: facilita o processo e remove impedimentos. Não é chefe.</li><li><b>Developers</b>: constroem o produto e se organizam sozinhos.</li></ul>
<p><b>Eventos</b>: <b>Sprint</b> (ciclo de até 1 mês), Sprint Planning (planejar), Daily (reunião diária de 15 minutos), Sprint Review (mostrar o resultado ao cliente) e Retrospectiva (melhorar o jeito de trabalhar).</p>
<p><b>Artefatos</b>: Product Backlog, Sprint Backlog e o Incremento (o que ficou pronto).</p>
<div class="pega">Review = olhar o <b>produto</b> com os interessados. Retrospectiva = olhar o <b>processo</b> da equipe.</div>
<div class="resumo">PO prioriza. Scrum Master facilita. Developers constroem.</div>`],
['UML: diagramas que mais caem',`<p><b>Diagrama de casos de uso</b>: mostra o que cada ator (usuário) pode fazer.</p>
<ul><li><b>«include»</b>: o caso base <b>sempre</b> executa o incluído. Seta do base para o incluído.</li><li><b>«extend»</b>: comportamento <b>opcional</b>, só em certas condições. Seta do opcional para o base.</li></ul>
<div class="ex">“Sacar” sempre inclui “Validar senha” (include). “Imprimir comprovante” às vezes estende “Sacar” (extend).</div>
<p><b>Diagrama de classes</b> – relacionamentos:</p>
<ul><li><b>Associação</b>: uma classe usa ou conhece a outra.</li><li><b>Agregação</b> (losango vazio): o todo tem partes, mas as partes <b>vivem sozinhas</b>. Time e Jogador.</li><li><b>Composição</b> (losango cheio): a parte <b>não existe sem o todo</b>. Pedido e ItemPedido.</li><li><b>Generalização</b> (seta de triângulo): herança.</li></ul>
<div class="ideia">Composição: se a casa é demolida, os cômodos somem junto. Agregação: se o time acaba, os jogadores continuam existindo.</div>
<div class="resumo">Include = obrigatório. Extend = opcional. Composição = parte morre com o todo.</div>`]
]);

{n:1,q:`“O sistema deve permitir que o cliente emita a segunda via do boleto” é um requisito:`,a:['*funcional','não funcional','de desempenho','de portabilidade','de hardware'],e:`Descreve uma ação que o sistema faz.`,p:['Pergunte: é uma ação ou uma qualidade?','Emitir a segunda via é uma ação do sistema.','Ação = requisito funcional.']},
{n:1,q:`No Scrum, a reunião rápida e diária em que a equipe alinha o trabalho do dia é a:`,a:['*Daily Scrum','Sprint Review','Retrospectiva','Sprint Planning','Refinamento do backlog'],e:`Daily: até 15 minutos, todos os dias da sprint.`,p:['Palavra-chave: diária.','A reunião diária do Scrum é a Daily Scrum.','Review e Retrospectiva acontecem só no fim da sprint.']},
{n:2,q:`Ao final da sprint, a equipe se reúne para discutir o que funcionou bem e o que pode melhorar na forma de trabalhar. Esse evento é a:`,a:['*Sprint Retrospective','Sprint Review','Daily Scrum','Sprint Planning','reunião de kickoff'],e:`A Retrospectiva olha o processo; a Review olha o produto.`,p:['O foco é a forma de trabalhar (processo), não o produto.','Olhar o processo é papel da Retrospectiva.','A Review mostra o produto para os interessados.']},

T('es2',[
['Para que serve esta matéria',`<p>Engenharia de Software II trata de <b>qualidade</b>: como testar, como manter o sistema funcionando ao longo dos anos e como organizar sua arquitetura.</p>
<div class="resumo">No ENADE: caixa-preta × caixa-branca, valor-limite, complexidade ciclomática, tipos de manutenção e arquiteturas (camadas, MVC, microsserviços).</div>`],
['Tipos de teste',`<ul><li><b>Caixa-preta (funcional)</b>: testa olhando só <b>entradas e saídas</b>, sem ver o código. Baseado na especificação.</li><li><b>Caixa-branca (estrutural)</b>: testa olhando o <b>código</b>, tentando passar por todos os caminhos, decisões e linhas.</li></ul>
<div class="ideia">Caixa-preta é testar um micro-ondas apertando botões e vendo se esquenta. Caixa-branca é abrir o aparelho e conferir cada fio.</div>
<p>Níveis: <b>unidade</b> (uma função), <b>integração</b> (partes juntas), <b>sistema</b> (tudo) e <b>aceitação</b> (o cliente aprova).</p>
<p><b>Teste de regressão</b>: rodar de novo os testes antigos depois de uma mudança, para garantir que nada que funcionava quebrou.</p>
<div class="resumo">Sem olhar o código → caixa-preta. Olhando o código → caixa-branca.</div>`],
['Escolhendo os valores de teste',`<p><b>Particionamento em classes de equivalência</b>: divida as entradas em grupos que o sistema trata igual e teste um valor de cada grupo.</p>
<p><b>Análise de valor-limite</b>: os erros adoram as <b>bordas</b>. Teste o limite e o valor logo fora dele.</p>
<div class="ex">Idade válida de 18 a 60. Classes: menor que 18 (inválida), 18–60 (válida), maior que 60 (inválida). Valores-limite: <b>17, 18, 60 e 61</b>.</div>
<div class="ideia">É como testar uma porta automática: o que importa é o exato ponto em que ela começa a abrir, não uma pessoa a 10 metros.</div>
<div class="resumo">Teste cada lado de cada fronteira.</div>`],
['Complexidade ciclomática',`<p>Ela conta quantos <b>caminhos independentes</b> existem no código. Indica quantos testes, no mínimo, são necessários para cobrir todos os caminhos.</p>
<div class="ex"><b>V(G) = número de decisões + 1</b><br>Decisões: cada <code>if</code>, <code>while</code>, <code>for</code>, <code>case</code> (e cada &amp;&amp; ou || numa condição, se a questão pedir).<br>Um if + um while + um if-else = 3 decisões → V(G) = <b>4</b>.</div>
<p>Pelo grafo: <b>V(G) = arestas − nós + 2</b>.</p>
<div class="pega">Um if-else conta como <b>uma</b> decisão, não duas. O else não é uma nova pergunta.</div>
<div class="resumo">Conte as perguntas do código e some 1.</div>`],
['Manutenção e arquitetura',`<p>Tipos de manutenção:</p>
<ul><li><b>Corretiva</b>: consertar um defeito.</li><li><b>Adaptativa</b>: ajustar a uma mudança no <b>ambiente</b> (novo sistema operacional, nova lei, nova API).</li><li><b>Perfectiva</b>: melhorar ou adicionar funções.</li><li><b>Preventiva</b>: melhorar o código para evitar problemas futuros (refatorar).</li></ul>
<div class="ideia">No carro: trocar um pneu furado é corretiva; trocar pneus para o inverno é adaptativa; instalar um som novo é perfectiva; trocar o óleo antes de dar problema é preventiva.</div>
<p>Arquiteturas:</p>
<ul><li><b>Camadas</b>: apresentação → negócio → dados. Cada camada só fala com a vizinha.</li><li><b>MVC</b>: Model (dados), View (tela), Controller (recebe as ações).</li><li><b>Microsserviços</b>: o sistema vira vários serviços pequenos e independentes, cada um com seu próprio banco. Escala e implanta separado, mas a <b>operação fica mais complexa</b>.</li></ul>
<div class="resumo">Mudou o ambiente → adaptativa. Microsserviços = independência com mais complexidade operacional.</div>`]
]);
P('es2',[
['O teste não considera a estrutura interna (o código).','Testar só por entradas e saídas é caixa-preta.','Caixa-branca olha o código.'],
['A faixa válida vai de 18 a 60.','Valor-limite testa cada fronteira e o valor logo fora: 17 e 18; 60 e 61.','Resposta: 17, 18, 60 e 61.'],
['O sistema funciona, mas o ambiente (sistema operacional) mudou.','Ajustar o software a uma mudança no ambiente é manutenção adaptativa.','Corretiva seria se houvesse um defeito.'],
['Conte as decisões: if (1), while (2), if-else (3).','Use V(G) = decisões + 1.','3 + 1 = 4.'],
['I: cada serviço é implantado e escalado sozinho. Verdadeira.','II: microsserviços aumentam a complexidade operacional, não reduzem. Falsa.','III: o ideal é cada serviço ter seu banco. Verdadeira. Resposta: I e III.']
]);
N('es2',[
{n:1,q:`Rodar novamente os testes já existentes após uma alteração, para garantir que nada que funcionava foi quebrado, é o teste de:`,a:['*regressão','aceitação','carga','usabilidade','fumaça de hardware'],e:`Regressão = verificar se o sistema “regrediu”.`,p:['O objetivo é ver se algo antigo quebrou depois de uma mudança.','Isso se chama teste de regressão.','Aceitação é a aprovação do cliente.']},
{n:1,q:`O teste que verifica uma única função ou método, isoladamente, é o teste de:`,a:['*unidade','sistema','integração','aceitação','regressão'],e:`Unidade = a menor parte testável.`,p:['Lembre os níveis: unidade, integração, sistema, aceitação.','A menor parte (uma função) é a unidade.','Resposta: teste de unidade.']},
{n:2,q:`Corrigir um erro que fazia o sistema calcular o desconto errado é uma manutenção:`,a:['*corretiva','adaptativa','perfectiva','preventiva','evolutiva de hardware'],e:`Consertar defeito = corretiva.`,p:['Havia um defeito (cálculo errado).','Consertar defeito é manutenção corretiva.','Adaptativa seria uma mudança de ambiente.']},
{n:2,q:`Um campo de senha aceita de 8 a 16 caracteres. Pela análise de valor-limite, os tamanhos a testar são:`,a:['*7, 8, 16 e 17','8 e 16','10 e 12','0 e 100','1, 2 e 3'],e:`Teste o limite e o valor logo fora, em cada borda.`,p:['As bordas são 8 e 16.','Para cada borda, teste o limite e o valor logo fora.','7 e 8; 16 e 17.']},
{n:2,q:`O grafo de fluxo de uma função tem 9 arestas e 7 nós. A complexidade ciclomática é:`,a:['*4','2','16','3','5'],e:`V(G) = E − N + 2 = 9 − 7 + 2 = 4.`,p:['Use a fórmula do grafo: V(G) = arestas − nós + 2.','9 − 7 = 2.','2 + 2 = 4.']},
{n:3,q:`Em uma aplicação MVC, a responsabilidade de receber a ação do usuário (clique em “Salvar”), acionar as regras de negócio e escolher qual tela mostrar é do:`,a:['*Controller','Model','View','banco de dados','sistema operacional'],e:`O Controller faz a ponte entre a View e o Model.`,p:['Model = dados e regras; View = tela.','Quem recebe a ação e coordena os dois é o Controller.','Resposta: Controller.']}
]);

T('mps',[
['Para que serve esta matéria',`<p>Melhoria de Processos de Software estuda como uma empresa fica <b>cada vez melhor</b> em desenvolver software, de forma organizada e medida. Os modelos mais cobrados são o <b>CMMI</b> e o <b>MPS.BR</b> (brasileiro).</p>
<div class="ideia">É como uma academia: no começo você treina do seu jeito (caótico). Depois tem uma ficha, depois mede a evolução com números e, por fim, ajusta o treino continuamente com base nesses números.</div>
<div class="resumo">No ENADE: os níveis do CMMI e do MPS.BR e as métricas (GQM).</div>`],
['CMMI: 5 níveis',`<table class="mini"><tr><th>Nível</th><th>Nome</th><th>Em palavras simples</th></tr><tr><td>1</td><td>Inicial</td><td>cada projeto é feito do seu jeito; depende de heróis</td></tr><tr><td>2</td><td>Gerenciado</td><td>cada <b>projeto</b> é planejado e acompanhado</td></tr><tr><td>3</td><td>Definido</td><td>a <b>organização</b> tem um processo padrão para todos</td></tr><tr><td>4</td><td>Quantitativamente gerenciado</td><td>o processo é controlado com <b>números e estatística</b></td></tr><tr><td>5</td><td>Em otimização</td><td><b>melhoria contínua</b> e inovação</td></tr></table>
<div class="ideia">2 = cada time tem sua receita. 3 = a empresa tem um livro de receitas oficial. 4 = mede o tempo e o sabor de cada prato com números. 5 = melhora as receitas o tempo todo.</div>
<div class="resumo">Métricas e estatística → nível 4. Padrão da organização → nível 3.</div>`],
['MPS.BR',`<p>O MPS.BR é o modelo brasileiro, pensado para empresas pequenas e médias. Tem <b>7 níveis, de G (mais baixo) até A (mais alto)</b>:</p>
<p><b>G</b> – Parcialmente gerenciado → <b>F</b> – Gerenciado → <b>E</b> – Parcialmente definido → <b>D</b> – Largamente definido → <b>C</b> – Definido → <b>B</b> – Gerenciado quantitativamente → <b>A</b> – Em otimização.</p>
<div class="pega">A escala é “ao contrário” do alfabeto: G é o início e A é o topo.</div>
<p>Por ter mais degraus, permite que a empresa evolua aos poucos.</p>
<div class="resumo">MPS.BR: G (início) até A (topo). Mais degraus que o CMMI.</div>`],
['Métricas e GQM',`<p>Para melhorar, é preciso <b>medir</b>. O método <b>GQM (Goal–Question–Metric)</b> organiza isso em três passos:</p>
<ol><li><b>Goal (objetivo)</b>: o que se quer. “Reduzir defeitos em produção.”</li><li><b>Question (pergunta)</b>: o que precisamos saber. “Quantos defeitos escapam dos testes?”</li><li><b>Metric (métrica)</b>: o número que responde. “Defeitos em produção por mil linhas de código.”</li></ol>
<div class="ideia">Objetivo: emagrecer. Pergunta: estou perdendo peso? Métrica: quilos na balança por semana. Contar quantas vezes você foi ao mercado não responde a pergunta.</div>
<p>Outras métricas: <b>pontos de função</b> (tamanho do software pelo que ele faz para o usuário) e <b>KLOC</b> (mil linhas de código).</p>
<div class="resumo">A métrica certa é a que responde diretamente à pergunta.</div>`]
]);
P('mps',[
['Lembre a escala do MPS.BR: de G a A.','G é o mais baixo; A é o mais alto.','Resposta: G – Parcialmente gerenciado.'],
['Palavras-chave: métricas e técnicas estatísticas.','Controle por números é o nível 4, Quantitativamente gerenciado.','O nível 3 é padronização; o 5 é melhoria contínua.'],
['A pergunta é “quantos defeitos escapam dos testes?”.','A métrica deve contar defeitos encontrados depois, em produção.','A densidade de defeitos em produção responde a isso. As outras não medem defeitos.']
]);
N('mps',[
{n:1,q:`No CMMI, o nível mais alto de maturidade é o:`,a:['*5 – Em otimização','1 – Inicial','3 – Definido','4 – Quantitativamente gerenciado','2 – Gerenciado'],e:`O CMMI vai de 1 (inicial) até 5 (em otimização).`,p:['O CMMI tem 5 níveis.','O mais alto é o 5.','Nome: Em otimização.']},
{n:1,q:`No MPS.BR, o nível mais alto de maturidade é o:`,a:['*A','G','F','1','5'],e:`A escala vai de G (mais baixo) a A (mais alto).`,p:['O MPS.BR usa letras.','G é o começo e A é o topo.','Resposta: A.']},
{n:2,q:`Uma empresa possui um processo padrão documentado, usado e adaptado por todos os projetos da organização. No CMMI, ela está pelo menos no nível:`,a:['*3 – Definido','2 – Gerenciado','1 – Inicial','4 – Quantitativamente gerenciado','5 – Em otimização'],e:`Processo padrão da organização inteira caracteriza o nível 3.`,p:['Pista: processo padrão para a organização toda.','No nível 2, cada projeto é gerenciado, mas não há padrão único.','Padrão organizacional = nível 3, Definido.']},
{n:2,q:`No método GQM, a ordem correta de definição é:`,a:['*objetivo, depois perguntas, depois métricas','métricas, depois objetivo, depois perguntas','perguntas, depois métricas, depois objetivo','apenas métricas, sem objetivo','objetivo e métricas, sem perguntas'],e:`O nome já diz: Goal → Question → Metric.`,p:['GQM = Goal, Question, Metric.','Primeiro o objetivo; dele saem as perguntas.','Das perguntas saem as métricas.']},
{n:2,q:`A técnica que mede o tamanho de um software pelas funcionalidades entregues ao usuário (entradas, saídas, consultas, arquivos), independentemente da linguagem, é:`,a:['*análise de pontos de função','contagem de linhas de código (KLOC)','complexidade ciclomática','velocidade da sprint','teste de carga'],e:`Pontos de função medem o tamanho funcional, não o código.`,p:['Pistas: mede pelo que o usuário recebe, não depende da linguagem.','KLOC depende da linguagem.','Isso é a análise de pontos de função.']},
{n:3,q:`Uma empresa no nível 2 do CMMI quer chegar ao nível 4. O que precisa ser feito, em ordem?`,a:['*padronizar os processos na organização (nível 3) e depois controlá-los com métricas e estatística (nível 4)','pular direto para melhoria contínua','abandonar o planejamento de projetos','apenas comprar ferramentas de gestão','contratar mais programadores'],e:`Os níveis são degraus: primeiro o padrão organizacional, depois o controle quantitativo.`,p:['Os níveis são uma escada, não dá para pular.','Do 2 para o 3: criar o processo padrão da organização.','Do 3 para o 4: controlar esse processo com números.']}
]);

T('lfa',[
['Para que serve esta matéria',`<p>Linguagens Formais estuda <b>quais padrões de texto uma máquina consegue reconhecer</b>. É a base de compiladores, validadores de e-mail, buscas com expressões regulares e analisadores de código.</p>
<p>Uma <b>linguagem</b> aqui é só um conjunto de palavras (cadeias) feitas com um alfabeto. Ex.: “todas as cadeias de a e b que terminam em b”.</p>
<div class="resumo">No ENADE: expressões regulares, autômatos, a hierarquia de Chomsky e se uma linguagem é regular ou não.</div>`],
['A hierarquia: de máquinas simples a poderosas',`<table class="mini"><tr><th>Linguagem</th><th>Máquina que reconhece</th><th>Memória</th><th>Exemplo</th></tr><tr><td>Regular</td><td>Autômato finito (AFD/AFN)</td><td>nenhuma, só o estado</td><td>cadeias que terminam em “abb”</td></tr><tr><td>Livre de contexto</td><td>Autômato com <b>pilha</b></td><td>uma pilha</td><td>a<sup>n</sup>b<sup>n</sup>, parênteses balanceados</td></tr><tr><td>Sensível ao contexto</td><td>Autômato linearmente limitado</td><td>fita limitada</td><td>a<sup>n</sup>b<sup>n</sup>c<sup>n</sup></td></tr><tr><td>Recursivamente enumerável</td><td>Máquina de Turing</td><td>fita infinita</td><td>tudo que é computável</td></tr></table>
<div class="ideia">É uma escada de memória. O autômato finito tem memória de peixinho: só sabe em que estado está. A pilha é um bloco de notas onde dá para empilhar e conferir. A máquina de Turing tem um caderno infinito.</div>
<div class="resumo">Precisa contar sem limite? Não é regular. Precisa contar uma coisa contra outra? Pilha.</div>`],
['Autômatos finitos e expressões regulares',`<p>Um <b>autômato finito</b> lê a cadeia letra por letra, mudando de estado. Se terminar num estado de aceitação, a cadeia é aceita.</p>
<ul><li><b>AFD</b> (determinístico): para cada estado e letra, há exatamente um caminho.</li><li><b>AFN</b> (não determinístico): pode ter vários caminhos (ou nenhum). Tem o <b>mesmo poder</b> do AFD: todo AFN vira um AFD, que pode ter até <b>2<sup>n</sup></b> estados.</li></ul>
<p>Expressões regulares descrevem as mesmas linguagens:</p>
<ul><li><code>a|b</code>: a ou b.</li><li><code>ab</code>: a seguido de b.</li><li><code>a*</code>: zero ou mais a.</li><li><code>a+</code>: um ou mais a.</li></ul>
<div class="ex"><code>(a|b)*abb</code> = qualquer coisa feita de a e b, <b>terminando em abb</b>. Aceita: abb, aabb, babb. Rejeita: ab, abba.</div>
<div class="resumo">Leia a expressão por partes: o que pode vir no começo, o que é obrigatório e onde.</div>`],
['Como saber se uma linguagem é regular',`<p>Se para reconhecer a linguagem você precisa <b>lembrar uma quantidade que pode crescer sem limite</b>, ela <b>não é regular</b>.</p>
<div class="ex">a<sup>n</sup>b<sup>n</sup> (o mesmo número de a e de b): é preciso contar os a para conferir com os b. Um autômato finito não tem onde guardar essa conta. Com pilha dá: empilha cada a e desempilha um para cada b. É <b>livre de contexto, mas não regular</b>.</div>
<p>Para provar formalmente usa-se o <b>lema do bombeamento</b>.</p>
<p><b>Propriedades de fechamento</b> (o que acontece ao combinar linguagens):</p>
<ul><li>Regulares são fechadas em união, interseção, concatenação, estrela e complemento.</li><li>Livres de contexto são fechadas em união, concatenação e estrela, mas <b>não</b> em interseção nem complemento.</li><li>Livre de contexto ∩ regular = livre de contexto.</li></ul>
<div class="resumo">Contar sem limite = não regular. Regulares fecham em tudo; LLC não fecham em ∩ e complemento.</div>`],
['Gramáticas',`<p>Uma <b>gramática</b> gera as palavras da linguagem por regras de substituição.</p>
<div class="ex">S → aSb | ε gera: ε, ab, aabb, aaabbb… (a<sup>n</sup>b<sup>n</sup>).</div>
<p>Uma gramática é <b>livre de contexto</b> quando o lado esquerdo de cada regra é <b>um único símbolo</b>. É assim que se descreve a sintaxe das linguagens de programação.</p>
<p>Uma gramática é <b>ambígua</b> quando a mesma palavra pode ser gerada por duas árvores diferentes. Ex.: E → E + E | E * E | id, para “id + id * id”.</p>
<div class="resumo">Gramática gera; autômato reconhece. LLC = um símbolo à esquerda.</div>`]
]);

T('tc',[
['Para que serve esta matéria',`<p>Teoria da Computação responde duas perguntas grandes: <b>o que o computador consegue resolver?</b> (computabilidade) e <b>quanto custa resolver?</b> (complexidade).</p>
<div class="resumo">No ENADE: máquina de Turing, problema da parada, classes P e NP, NP-completo e reduções.</div>`],
['Máquina de Turing e o que é computável',`<p>A <b>máquina de Turing</b> é um modelo simples de computador: uma fita infinita, uma cabeça que lê e escreve, e regras. Tudo que um computador real faz, ela faz (tese de Church-Turing).</p>
<p>Um problema é <b>decidível</b> se existe um algoritmo que <b>sempre termina</b> com a resposta certa (sim ou não).</p>
<p>O <b>problema da parada</b> pergunta: “dado um programa e uma entrada, ele vai parar ou rodar para sempre?”. Turing provou que é <b>indecidível</b>: nenhum programa consegue responder isso para todos os casos.</p>
<div class="ideia">Imagine um “detector de travamentos” perfeito. Dá para criar um programa malandro que pergunta ao detector sobre si mesmo e faz o contrário da resposta. O detector sempre erra com ele. Logo, o detector perfeito não pode existir.</div>
<div class="resumo">Problema da parada = indecidível. Nenhum algoritmo resolve para todos os casos.</div>`],
['P e NP',`<ul><li><b>P</b>: problemas que dá para <b>resolver</b> rápido (tempo polinomial, como n² ou n³). Ex.: ordenar, menor caminho.</li><li><b>NP</b>: problemas em que, se alguém te der uma resposta, dá para <b>conferir</b> rápido. Ex.: sudoku, caixeiro-viajante (versão sim/não), SAT.</li></ul>
<div class="ideia">Montar um quebra-cabeça de 5 mil peças é difícil. Conferir se um quebra-cabeça já montado está certo é fácil. NP é o “fácil de conferir”.</div>
<p>Todo problema de P está em NP (se dá para resolver rápido, dá para conferir rápido). A grande pergunta sem resposta é se <b>P = NP</b>.</p>
<div class="resumo">P = resolver rápido. NP = conferir rápido. P ⊆ NP. P = NP? Ninguém sabe.</div>`],
['NP-completo e reduções',`<p>Uma <b>redução</b> de A para B mostra que, se você souber resolver B, também resolve A. Ou seja, B é <b>pelo menos tão difícil</b> quanto A.</p>
<ul><li><b>NP-difícil</b>: pelo menos tão difícil quanto todos os de NP.</li><li><b>NP-completo</b>: é NP-difícil <b>e</b> está em NP. São “os mais difíceis de NP”. Ex.: SAT, caixeiro-viajante (decisão), mochila (decisão), coloração de grafos.</li></ul>
<div class="ex">Para provar que um problema novo X é NP-difícil: pegue um NP-completo conhecido (ex.: SAT) e <b>reduza SAT para X</b>. A seta vai <b>do conhecido para o novo</b>.</div>
<div class="pega">Reduzir X para SAT (no sentido contrário) só mostra que X é no máximo tão difícil quanto SAT. Não prova nada sobre ser difícil.</div>
<p>Se alguém achar um algoritmo polinomial para <b>qualquer</b> NP-completo, então <b>todos</b> de NP ficam rápidos, e P = NP.</p>
<div class="resumo">Provar dificuldade: reduza o conhecido para o novo. Um NP-completo em P → P = NP.</div>`]
]);
P('tc',[
['Lembre o resultado clássico de Turing.','Nenhum algoritmo decide, para todo programa e entrada, se ele para.','Resposta: indecidível.'],
['Para provar que X é difícil, a seta da redução vai do conhecido para o novo.','Pegue um NP-completo conhecido e reduza para X.','Assim, se X fosse fácil, o conhecido também seria.'],
['Julgue II: o caixeiro (decisão) é NP-completo, e todo NP se reduz a ele. Verdadeira.','Julgue I: se um NP-completo for resolvido em tempo polinomial, P = NP. Verdadeira.','O “porque” faz sentido: I é verdade justamente por causa de II.']
]);
N('tc',[
{n:1,q:`A classe P contém os problemas que podem ser:`,a:['*resolvidos em tempo polinomial','apenas verificados em tempo polinomial','resolvidos somente em tempo exponencial','indecidíveis','resolvidos só com memória infinita'],e:`P = resolvíveis em tempo polinomial por um algoritmo determinístico.`,p:['P vem de “polinomial”.','São problemas que se resolvem rápido (n, n², n³…).','“Verificar” rápido é a definição de NP.']},
{n:1,q:`Qual problema é um exemplo clássico de NP-completo?`,a:['*satisfatibilidade booleana (SAT)','ordenação de um vetor','busca binária','menor caminho com Dijkstra','problema da parada'],e:`SAT foi o primeiro problema provado NP-completo (Cook-Levin).`,p:['Ordenar, buscar e Dijkstra estão em P.','O problema da parada é indecidível, nem está em NP.','SAT é o NP-completo clássico.']},
{n:2,q:`Dado um tabuleiro de sudoku totalmente preenchido, conferir se ele está correto é rápido, mas encontrar a solução pode ser difícil. Essa característica descreve problemas da classe:`,a:['*NP','P obrigatoriamente','indecidível','regular','EXP apenas'],e:`NP = soluções verificáveis em tempo polinomial.`,p:['A pista é: conferir é fácil.','Problemas com solução fácil de conferir formam a classe NP.','Não se sabe se o sudoku generalizado está em P (ele é NP-completo).']},
{n:2,q:`Um problema que é NP-difícil e também pertence a NP é chamado de:`,a:['*NP-completo','P-completo','indecidível','regular','polinomial'],e:`NP-completo = NP-difícil ∩ NP.`,p:['Lembre as definições.','NP-difícil: pelo menos tão difícil quanto todos de NP.','Se, além disso, está em NP, é NP-completo.']},
{n:2,q:`Um problema é decidível quando:`,a:['*existe um algoritmo que sempre termina e responde corretamente sim ou não','existe um algoritmo que às vezes não termina','ele está em NP','ele pode ser resolvido em tempo constante','ele é NP-completo'],e:`Decidível = existe algoritmo que sempre para com a resposta certa.`,p:['Decidir = dar sempre uma resposta.','O algoritmo precisa sempre parar, para qualquer entrada.','E a resposta precisa ser correta.']},
{n:3,q:`Um pesquisador mostra que o problema X pode ser transformado, em tempo polinomial, em uma instância de SAT. O que se pode concluir?`,a:['*X não é mais difícil que SAT, mas isso não prova que X seja NP-difícil','X é NP-difícil','X é indecidível','P = NP','X está fora de NP'],e:`Reduzir X a SAT mostra que X ∈ NP (no máximo tão difícil quanto SAT). Para provar NP-dificuldade, a redução teria de ir de SAT para X.`,p:['Veja a direção: de X para SAT.','Isso mostra que quem resolve SAT também resolve X: X não é mais difícil que SAT.','Para dizer que X é difícil, a seta teria que ir de SAT para X.']}
]);

T('comp',[
['Para que serve esta matéria',`<p>Um <b>compilador</b> traduz o código que você escreve (ex.: Java, C) para uma linguagem que a máquina executa. Ele faz isso em fases, como uma linha de produção.</p>
<div class="ideia">É como um tradutor de livros: primeiro separa as palavras, depois confere a gramática das frases, depois vê se o texto faz sentido e por fim escreve na outra língua.</div>
<div class="resumo">No ENADE: as fases (léxica, sintática, semântica), recursão à esquerda, FIRST e otimizações.</div>`],
['As fases do compilador',`<table class="mini"><tr><th>Fase</th><th>O que faz</th><th>Erro típico</th></tr><tr><td><b>Léxica</b></td><td>separa o texto em <b>tokens</b> (palavras): <code>int</code>, <code>x</code>, <code>=</code>, <code>10</code></td><td>símbolo inválido, como <code>@</code> solto</td></tr><tr><td><b>Sintática</b></td><td>confere se os tokens formam frases válidas, montando a <b>árvore sintática</b></td><td>faltou ponto e vírgula, parêntese sem fechar</td></tr><tr><td><b>Semântica</b></td><td>confere o <b>sentido</b>: tipos, variáveis declaradas</td><td>variável não declarada; somar texto com número em Java</td></tr><tr><td>Código intermediário</td><td>gera uma versão simples (ex.: código de três endereços)</td><td></td></tr><tr><td>Otimização</td><td>deixa o código mais rápido ou menor</td><td></td></tr><tr><td>Geração de código</td><td>produz o código de máquina</td><td></td></tr></table>
<div class="ideia">“O gato comeu a mesa azul” está gramaticalmente certa (sintática ok), mas não faz sentido (erro semântico). “Gato o a comeu” tem as palavras certas na ordem errada (erro sintático).</div>
<p>A <b>tabela de símbolos</b> guarda os nomes declarados (variáveis, funções) e seus tipos. É nela que a análise semântica descobre se uma variável existe.</p>
<div class="resumo">Léxica = palavras. Sintática = gramática. Semântica = sentido e tipos.</div>`],
['Análise sintática: LL e LR',`<ul><li><b>Descendente (LL)</b>: começa do símbolo inicial e vai descendo até as palavras. Simples de fazer à mão.</li><li><b>Ascendente (LR)</b>: começa pelas palavras e vai juntando até chegar no símbolo inicial. Mais poderosa; é a usada por ferramentas como Yacc/Bison.</li></ul>
<p>Analisadores LL têm um problema: <b>recursão à esquerda</b> (regra em que o próprio símbolo aparece logo no começo, como E → E + T). O analisador tenta expandir E, que começa com E, que começa com E… e entra em <b>laço infinito</b>.</p>
<div class="ex">Removendo a recursão: E → E + T | T vira E → T E′ e E′ → + T E′ | ε.</div>
<p><b>FIRST(X)</b> é o conjunto de terminais que podem aparecer <b>no começo</b> de algo gerado por X. Se X pode ser vazio (ε), olhe também o que vem depois.</p>
<div class="resumo">LL não aceita recursão à esquerda. FIRST = com o que pode começar.</div>`],
['Otimizações',`<ul><li><b>Movimentação de código invariante</b>: tirar de dentro do laço um cálculo que não muda a cada volta.</li><li><b>Eliminação de código morto</b>: apagar código que nunca roda ou cujo resultado nunca é usado.</li><li><b>Propagação de constantes</b>: se x = 5, troca x por 5 nos próximos usos. <b>Dobramento</b>: calcula 2 * 3 já na compilação.</li><li><b>Eliminação de subexpressões comuns</b>: calcula a + b uma vez só, se aparece repetido.</li><li><b>Desenrolamento de laço</b>: repete o corpo do laço para dar menos voltas.</li></ul>
<div class="ex"><code>for(i…){ x = y*z; a[i] = x+i; }</code> → <code>x = y*z; for(i…) a[i] = x+i;</code>: y*z não muda no laço, então sai dele (código invariante).</div>
<div class="resumo">Descubra o que a transformação mudou e procure o nome na lista.</div>`]
]);
P('comp',[
['Agrupar caracteres em tokens é separar as “palavras” do código.','Essa é a primeira fase: análise léxica.','A sintática vem depois e confere a ordem dos tokens.'],
['O nome da variável é um token válido (léxica ok) e a frase está bem formada (sintática ok).','O que falta é saber se a variável foi declarada, consultando a tabela de símbolos.','Isso é análise semântica.'],
['Veja a regra: E → E + T. O E aparece logo no começo do lado direito.','Isso é recursão à esquerda.','O analisador LL tenta expandir E para E para E… e entra em laço infinito.'],
['Compare o antes e o depois: x = y*z saiu de dentro do laço.','y*z não muda a cada volta, ou seja, é invariante.','Nome: movimentação de código invariante de laço.'],
['FIRST(A): A → aA começa com a; A → ε pode ser vazio. FIRST(A) = {a, ε}.','S → A b: se A começa com a, S começa com a. Se A for vazio, S começa com b.','FIRST(S) = {a, b}. S não pode ser vazio, porque o b sempre aparece.']
]);
N('comp',[
{n:1,q:`Esquecer o ponto e vírgula no fim de um comando em C gera um erro detectado na análise:`,a:['*sintática','léxica','semântica','de otimização','de ligação'],e:`Os tokens são válidos, mas a estrutura da frase está errada.`,p:['O ponto e vírgula faz parte da gramática da linguagem.','Faltar um elemento da gramática é erro de estrutura.','Erro de estrutura = análise sintática.']},
{n:1,q:`A estrutura que guarda os identificadores declarados no programa, com seus tipos e escopos, é a:`,a:['*tabela de símbolos','pilha de execução','árvore B+','tabela verdade','fila de prioridade'],e:`É consultada principalmente na análise semântica.`,p:['O compilador precisa lembrar os nomes declarados.','Essa “agenda” de nomes e tipos é a tabela de símbolos.','Ela é usada para verificar declarações e tipos.']},
{n:2,q:`Em Java, a linha <code>int x = "texto";</code> gera um erro na análise:`,a:['*semântica, por incompatibilidade de tipos','léxica','sintática','de geração de código','de otimização'],e:`A frase está bem formada; o problema é atribuir texto a um inteiro.`,p:['Os tokens são válidos e a frase segue a gramática (tipo nome = valor;).','O problema é o sentido: texto não cabe em int.','Verificação de tipos = análise semântica.']},
{n:2,q:`O compilador troca <code>x = 4 * 60;</code> por <code>x = 240;</code>. Essa otimização é o:`,a:['*dobramento de constantes','desenrolamento de laço','movimentação de código invariante','eliminação de código morto','alocação de registradores'],e:`Calcular expressões constantes já em tempo de compilação.`,p:['A conta 4 * 60 usa só constantes.','O compilador já calcula o resultado antes de rodar.','Isso se chama dobramento de constantes (constant folding).']},
{n:2,q:`O código <code>return x; y = 10;</code> dentro de uma função contém <code>y = 10;</code> que nunca será executado. A otimização que o remove é a:`,a:['*eliminação de código morto','propagação de cópias','movimentação de código invariante','dobramento de constantes','desenrolamento de laço'],e:`Código depois do return nunca roda.`,p:['Depois do return, a função termina.','y = 10 nunca será executado: é código morto.','A otimização é a eliminação de código morto.']},
{n:3,q:`Na gramática S → a S | b, o conjunto FIRST(S) é:`,a:['*{a, b}','{a}','{b}','{a, b, ε}','{S}'],e:`S pode começar com a (primeira regra) ou ser b (segunda regra). S nunca é vazio.`,p:['Regra S → a S: começa com a.','Regra S → b: começa com b.','Nenhuma regra gera ε. FIRST(S) = {a, b}.']}
]);

T('ia',[
['Para que serve esta matéria',`<p>Inteligência Artificial I estuda como fazer o computador <b>resolver problemas buscando soluções</b>: achar um caminho num mapa, jogar xadrez, raciocinar com incerteza.</p>
<div class="resumo">No ENADE: busca cega × informada, A*, heurística admissível, minimax com poda alfa-beta e probabilidade (Bayes).</div>`],
['Busca cega',`<p>Na busca cega, o agente não tem nenhuma dica de onde está o objetivo. Ele só explora.</p>
<ul><li><b>Largura (BFS)</b>: explora por níveis. Acha a solução com <b>menos passos</b>. Gasta muita memória.</li><li><b>Profundidade (DFS)</b>: vai fundo num caminho. Pouca memória, mas pode se perder.</li><li><b>Custo uniforme</b>: expande sempre o caminho mais barato até agora. Acha o de <b>menor custo</b>.</li></ul>
<div class="ideia">Procurar as chaves de casa sem pista nenhuma: ou olha cômodo por cômodo (largura), ou revira uma gaveta até o fundo antes de ir para a próxima (profundidade).</div>
<div class="resumo">Busca cega = sem dica. BFS: menos passos. Custo uniforme: menor custo.</div>`],
['Busca informada e A*',`<p>A busca informada usa uma <b>heurística h(n)</b>: um palpite de quanto falta até o objetivo.</p>
<ul><li><b>Gulosa</b>: vai sempre para quem parece mais perto do objetivo (só olha h). Rápida, mas pode errar o melhor caminho.</li><li><b>A*</b>: usa <b>f(n) = g(n) + h(n)</b>, onde g é o custo já gasto e h é o palpite do que falta.</li></ul>
<div class="ideia">Viajando de carro: g é o quanto você já rodou, h é a distância em linha reta até o destino. O A* escolhe a cidade com menor total estimado.</div>
<p>Uma heurística é <b>admissível</b> quando <b>nunca superestima</b> o custo real (é sempre otimista). Com ela, o A* garante o <b>melhor caminho</b>.</p>
<div class="ex">Distância em linha reta é admissível: a estrada nunca é mais curta que a linha reta.</div>
<div class="resumo">A*: f = g + h. Admissível = nunca exagera. Admissível → A* acha o ótimo.</div>`],
['Jogos: minimax e poda alfa-beta',`<p>Em jogos de dois jogadores (xadrez, jogo da velha), o <b>minimax</b> supõe que:</p>
<ul><li>Você (<b>MAX</b>) escolhe a jogada que dá o <b>maior</b> valor.</li><li>O adversário (<b>MIN</b>) escolhe a jogada que dá o <b>menor</b> valor para você.</li></ul>
<p>Os valores sobem da base da árvore até o topo: nos níveis MIN, pegue o menor dos filhos; nos níveis MAX, pegue o maior.</p>
<div class="ex">MAX tem duas opções. A opção 1 leva a MIN com folhas 3 e 5 → MIN escolhe 3. A opção 2 leva a MIN com 2 e 9 → MIN escolhe 2. MAX escolhe max(3, 2) = <b>3</b>.</div>
<p>A <b>poda alfa-beta</b> pula ramos que <b>com certeza</b> não mudam a decisão. Dá <b>o mesmo resultado</b> do minimax, só que mais rápido.</p>
<div class="resumo">MIN pega o menor, MAX pega o maior. Alfa-beta = mesma resposta, menos trabalho.</div>`],
['Probabilidade e Bayes',`<p>O <b>teorema de Bayes</b> atualiza uma crença com base numa evidência. A forma mais fácil de resolver é com <b>números concretos</b>.</p>
<div class="ex">Doença em 1% das pessoas; o teste acerta 90% dos doentes e dá falso positivo em 10% dos sadios. Pense em <b>1000 pessoas</b>:<br>• 10 doentes → 9 dão positivo.<br>• 990 sadios → 99 dão positivo (falso).<br>• Total de positivos: 108. Doentes entre eles: 9.<br>• P(doente | positivo) = 9 ÷ 108 ≈ <b>8,3%</b>.</div>
<div class="ideia">Mesmo com um teste bom, se a doença é rara, a maioria dos positivos é alarme falso, porque há muito mais sadios para errar.</div>
<div class="resumo">Imagine 1000 pessoas, conte os positivos verdadeiros e falsos e divida.</div>`]
]);

T('ia2',[
['Para que serve esta matéria',`<p>IA II é sobre <b>aprendizado de máquina</b>: em vez de programar as regras, você mostra exemplos e o computador aprende o padrão sozinho.</p>
<div class="ideia">Ensinar uma criança a reconhecer cachorros: você não explica a regra, mostra várias fotos dizendo “é cachorro” ou “não é”. Depois ela reconhece sozinha.</div>
<div class="resumo">No ENADE: tipos de aprendizado, overfitting, métricas (precisão, revocação) e redes neurais.</div>`],
['Tipos de aprendizado',`<ul><li><b>Supervisionado</b>: os exemplos têm a <b>resposta certa</b> (rótulo). O modelo aprende a prever.<br>• <b>Classificação</b>: prevê uma categoria (spam ou não).<br>• <b>Regressão</b>: prevê um número (preço de uma casa).</li><li><b>Não supervisionado</b>: os exemplos <b>não têm rótulo</b>. O modelo encontra grupos ou padrões sozinho (agrupamento com k-means).</li><li><b>Por reforço</b>: o agente aprende por <b>tentativa e erro</b>, recebendo recompensas ou punições (robôs, jogos).</li></ul>
<div class="ideia">Supervisionado: estudar com gabarito. Não supervisionado: organizar fotos sem legenda em pastas parecidas. Reforço: treinar um cachorro com petiscos.</div>
<div class="resumo">Tem rótulo → supervisionado. Sem rótulo → não supervisionado. Recompensa → reforço.</div>`],
['Overfitting e underfitting',`<ul><li><b>Overfitting</b>: o modelo <b>decorou</b> o treino. Vai muito bem no treino e mal em dados novos.</li><li><b>Underfitting</b>: o modelo é simples demais. Vai mal até no treino.</li></ul>
<div class="ideia">Overfitting é o aluno que decorou as respostas da lista de exercícios: tira 10 na lista e vai mal na prova, porque as questões são diferentes.</div>
<p>Como combater o overfitting: <b>mais dados</b>, <b>regularização</b>, modelo mais simples, <b>parada antecipada</b> (early stopping), dropout.</p>
<p>Por isso se separam os dados em <b>treino</b> e <b>teste</b> (ou usa-se <b>validação cruzada</b>): o teste mostra como o modelo se sai em dados que nunca viu.</p>
<div class="resumo">Treino ótimo e teste ruim = overfitting.</div>`],
['Métricas de classificação',`<p>Monte a <b>matriz de confusão</b>:</p>
<ul><li><b>VP</b>: era positivo e o modelo disse positivo (acertou).</li><li><b>FP</b>: era negativo e o modelo disse positivo (alarme falso).</li><li><b>FN</b>: era positivo e o modelo disse negativo (deixou passar).</li><li><b>VN</b>: era negativo e disse negativo.</li></ul>
<div class="ex"><b>Precisão</b> = VP ÷ (VP + FP): dos que eu disse que eram spam, quantos eram?<br><b>Revocação (recall)</b> = VP ÷ (VP + FN): dos spams que existiam, quantos eu peguei?<br>VP = 80, FP = 20, FN = 40 → precisão 80/100 = 80%; revocação 80/120 ≈ 66,7%.</div>
<div class="ideia">Pescar com rede: <b>precisão</b> é quanto do que veio na rede é peixe (e não lixo). <b>Revocação</b> é quanto dos peixes do lago você pegou.</div>
<div class="pega">Acurácia engana com dados desbalanceados: se 99% dos e-mails são normais, um modelo que diz sempre “normal” tem 99% de acurácia e não serve para nada.</div>
<div class="resumo">Precisão: divide por tudo que o modelo marcou. Revocação: divide por tudo que era de verdade.</div>`],
['Redes neurais',`<p>Um <b>perceptron</b> é um “neurônio” artificial: multiplica cada entrada por um peso, soma e aplica uma função de ativação.</p>
<p>Um perceptron sozinho só consegue separar as classes com uma <b>linha reta</b>. Por isso ele <b>não aprende o XOR</b>: os pontos do XOR não podem ser separados por uma única reta.</p>
<div class="ideia">Tente separar, com uma régua, os cantos (0,1) e (1,0) dos cantos (0,0) e (1,1) de um quadrado. Não dá: eles estão em diagonais cruzadas.</div>
<p>Com uma ou mais <b>camadas ocultas</b> (rede MLP) e funções não lineares, a rede aprende o XOR e padrões muito mais complexos. O treino usa <b>backpropagation</b>: calcula o erro na saída e ajusta os pesos de trás para frente.</p>
<div class="resumo">Perceptron = só linha reta = não aprende XOR. Com camada oculta, aprende.</div>`]
]);

{n:3,q:`Em um conjunto com 990 transações normais e 10 fraudes, um modelo que sempre responde “normal” tem acurácia de 99%. Sobre esse modelo, é correto afirmar:`,a:['*ele é inútil para detectar fraudes, pois sua revocação para fraude é 0%','ele é excelente, pois a acurácia é alta','sua precisão para fraude é 100%','ele está com overfitting','ele tem revocação de 99%'],e:`Ele não encontra nenhuma das 10 fraudes: VP = 0, revocação = 0. Acurácia engana em dados desbalanceados.`,p:['Ele acerta todos os normais (990), por isso 99% de acurácia.','Mas não detecta nenhuma fraude: VP = 0.','Revocação = 0 ÷ 10 = 0%. Inútil para o objetivo.']}

T('simul',[
['Para que serve esta matéria',`<p>Simulação Discreta cria um <b>modelo no computador</b> de um sistema real (fila de banco, linha de produção, tráfego de rede) para testar cenários sem mexer no sistema de verdade.</p>
<div class="ideia">Antes de contratar mais um caixa no mercado, você simula a fila no computador e vê se o tempo de espera cai o suficiente.</div>
<p>É “discreta” porque o estado muda em instantes específicos (eventos): um cliente chega, um atendimento termina.</p>
<div class="resumo">No ENADE: distribuição exponencial, fila M/M/1, utilização e Lei de Little.</div>`],
['Chegadas aleatórias',`<p>Quando os clientes chegam de forma aleatória e independente (processo de <b>Poisson</b>):</p>
<ul><li>O <b>número</b> de chegadas por hora segue a distribuição de <b>Poisson</b>.</li><li>O <b>tempo entre</b> uma chegada e outra segue a distribuição <b>exponencial</b>.</li></ul>
<div class="ideia">“Quantos clientes chegam por hora?” é Poisson (contagem). “Quanto tempo até o próximo cliente?” é exponencial (tempo).</div>
<p>Para gerar esses valores no computador, usa-se um gerador de números aleatórios (que na verdade são <b>pseudoaleatórios</b>, porque vêm de uma fórmula e de uma semente).</p>
<div class="resumo">Contagem de chegadas = Poisson. Intervalo entre chegadas = exponencial.</div>`],
['Fila M/M/1',`<p>M/M/1 é a fila mais simples: chegadas aleatórias (M), atendimento aleatório (M) e <b>1 servidor</b>.</p>
<ul><li><b>λ (lambda)</b>: taxa de chegada (clientes por hora).</li><li><b>μ (mi)</b>: taxa de atendimento (clientes por hora que o servidor consegue atender).</li><li><b>Utilização ρ = λ ÷ μ</b>: quanto do tempo o servidor fica ocupado.</li></ul>
<div class="ex">Chegam 8 por hora e o caixa atende 10 por hora: ρ = 8 ÷ 10 = <b>80%</b>.</div>
<div class="pega">Se λ ≥ μ (chegam mais do que se consegue atender), ρ ≥ 1 e a fila cresce sem parar. O sistema não é estável.</div>
<p>Outras fórmulas da M/M/1: número médio no sistema L = ρ ÷ (1 − ρ); tempo médio no sistema W = 1 ÷ (μ − λ).</p>
<div class="resumo">ρ = λ ÷ μ. Precisa ser menor que 1.</div>`],
['Lei de Little',`<div class="ex"><b>L = λ × W</b><br>L = número médio de clientes no sistema. λ = taxa de chegada. W = tempo médio que cada um fica.<br>12 clientes por hora, cada um fica 15 minutos (0,25 h): L = 12 × 0,25 = <b>3 clientes</b>.</div>
<div class="ideia">Uma festa recebe 60 pessoas por hora e cada uma fica, em média, 2 horas. Lá dentro haverá, em média, 120 pessoas.</div>
<div class="pega">Deixe as unidades iguais: se λ é por hora, W tem que estar em horas. 15 minutos = 0,25 hora.</div>
<p>Ela vale para quase qualquer sistema estável, não só para a M/M/1.</p>
<div class="resumo">L = λ × W, com as mesmas unidades de tempo.</div>`]
]);

{n:3,q:`Sobre simulação discreta, avalie:<br>I. Números gerados por computador para simulação costumam ser pseudoaleatórios, determinados por uma semente.<br>II. Rodar a simulação uma única vez é suficiente para conclusões confiáveis.<br>III. Simular permite testar cenários sem interferir no sistema real.<br>É correto o que se afirma em:`,a:['*I e III, apenas','I, apenas','II, apenas','II e III, apenas','I, II e III'],e:`II é falsa: como há aleatoriedade, é preciso várias replicações e análise estatística.`,p:['I: geradores usam fórmula e semente: pseudoaleatórios. Verdadeira.','II: com aleatoriedade, uma rodada só pode dar um resultado atípico. Falsa.','III: é a principal vantagem da simulação. Verdadeira. Resposta: I e III.']}

T('cg',[
['Para que serve esta matéria',`<p>Computação Gráfica estuda como <b>criar e desenhar imagens</b> no computador: de jogos e filmes animados até a interface que você usa.</p>
<div class="resumo">No ENADE: modelos de cor, transformações (translação, rotação, escala), coordenadas homogêneas, rasterização e iluminação.</div>`],
['Cores: RGB e CMYK',`<ul><li><b>RGB</b> (vermelho, verde, azul): modelo <b>aditivo</b>, usado em <b>telas</b>. Luz somada: R + G + B no máximo = branco.</li><li><b>CMYK</b> (ciano, magenta, amarelo, preto): modelo <b>subtrativo</b>, usado em <b>impressão</b>. Tinta absorve luz: misturar tudo = escuro.</li><li><b>HSV</b> (matiz, saturação, valor): mais intuitivo para pessoas escolherem cores.</li></ul>
<div class="ideia">Lanternas coloridas apontadas para a mesma parede somam luz e clareiam (RGB). Tintas misturadas num pote escurecem (CMYK).</div>
<div class="resumo">Tela = RGB (aditivo). Impressora = CMYK (subtrativo).</div>`],
['Transformações geométricas',`<p>Para mexer num objeto, aplicamos transformações em cada ponto:</p>
<ul><li><b>Translação</b>: mover. (x, y) → (x + tx, y + ty).</li><li><b>Escala</b>: aumentar ou diminuir. (x, y) → (sx·x, sy·y).</li><li><b>Rotação de 90° anti-horária</b> em torno da origem: (x, y) → (−y, x).</li></ul>
<div class="ex">Girar (1, 0) em 90°: vira (0, 1). Depois mover (2, 3): (0 + 2, 1 + 3) = <b>(2, 4)</b>.</div>
<div class="pega">A <b>ordem importa</b>. Girar e depois mover dá um resultado diferente de mover e depois girar.</div>
<div class="ideia">Andar 2 passos para frente e depois virar à esquerda deixa você num lugar diferente de virar à esquerda e depois andar 2 passos.</div>
<div class="resumo">Aplique uma transformação de cada vez, na ordem pedida.</div>`],
['Coordenadas homogêneas',`<p>Rotação e escala podem ser feitas multiplicando o ponto por uma matriz. Já a translação é uma <b>soma</b>, e não dá para fazer só com multiplicação em 2D comum.</p>
<p>O truque: acrescentar uma coordenada extra igual a 1. O ponto (x, y) vira <b>(x, y, 1)</b>. Assim a translação também vira uma multiplicação de matriz 3×3.</p>
<div class="ideia">É como converter tudo para a mesma moeda: depois disso, dá para juntar várias transformações numa única matriz (multiplicando as matrizes) e aplicar de uma vez em milhões de pontos.</div>
<div class="resumo">Coordenadas homogêneas existem para a translação virar multiplicação e todas as transformações poderem ser combinadas.</div>`],
['Do modelo 3D para a tela',`<p>O caminho que um objeto 3D faz até virar pixels (o <b>pipeline gráfico</b>): modelagem → transformações → câmera → <b>projeção</b> → recorte → <b>rasterização</b> (transformar em pixels) → pintura.</p>
<ul><li><b>Projeção perspectiva</b>: o que está longe parece menor (como o olho humano). <b>Ortogonal</b>: não diminui com a distância (plantas técnicas).</li><li><b>Bresenham</b>: algoritmo para desenhar retas na grade de pixels usando só números inteiros.</li><li><b>Z-buffer</b>: guarda a profundidade de cada pixel para decidir o que fica na frente.</li><li><b>Iluminação de Phong</b>: luz = ambiente + difusa + especular (o brilho).</li></ul>
<div class="resumo">Perspectiva diminui o que está longe. Z-buffer resolve quem está na frente.</div>`]
]);

T('pi',[
['Para que serve esta matéria',`<p>Processamento de Imagens trata de <b>analisar e melhorar imagens</b> que já existem: tirar ruído, realçar bordas, separar objetos. É a base de visão computacional, exames médicos e leitura de placas.</p>
<div class="ideia">Computação Gráfica cria imagens a partir de modelos. Processamento de Imagens faz o caminho contrário: parte da imagem para tirar informação dela.</div>
<div class="resumo">No ENADE: pixels e tamanho em bytes, histograma, filtros (média, mediana, Sobel) e morfologia.</div>`],
['Pixels e tamanho da imagem',`<p>Uma imagem digital é uma <b>grade de pixels</b>. Cada pixel guarda a intensidade (ou a cor).</p>
<ul><li>Tons de cinza com <b>8 bits</b>: 2<sup>8</sup> = <b>256 níveis</b> (0 = preto, 255 = branco).</li><li>Colorida <b>RGB</b> com 8 bits por canal: 3 bytes por pixel.</li></ul>
<div class="ex"><b>Tamanho = largura × altura × bytes por pixel.</b><br>1000 × 1000 RGB: 1.000.000 × 3 = <b>3.000.000 bytes</b> (3 MB).</div>
<div class="resumo">Níveis = 2<sup>bits</sup>. Tamanho = pixels × bytes por pixel.</div>`],
['Histograma e realce',`<p>O <b>histograma</b> é um gráfico que conta quantos pixels existem de cada intensidade.</p>
<ul><li>Histograma amontoado à esquerda → imagem escura.</li><li>Amontoado à direita → imagem clara.</li><li>Amontoado no meio, estreito → pouco contraste.</li></ul>
<p>A <b>equalização de histograma</b> espalha as intensidades por toda a faixa, <b>aumentando o contraste</b>.</p>
<div class="ideia">É como esticar uma sanfona fechada: os tons que estavam espremidos passam a ocupar toda a escala do preto ao branco.</div>
<div class="resumo">Pouco contraste → equalização do histograma.</div>`],
['Filtros',`<p>Um filtro olha cada pixel e seus vizinhos (uma janelinha 3×3, por exemplo) e calcula um novo valor.</p>
<table class="mini"><tr><th>Filtro</th><th>Faz</th><th>Uso</th></tr><tr><td>Média</td><td>tira a média dos vizinhos</td><td>suaviza, mas borra as bordas</td></tr><tr><td><b>Mediana</b></td><td>pega o valor do meio dos vizinhos ordenados</td><td>remove ruído <b>sal e pimenta</b> e preserva bordas</td></tr><tr><td>Gaussiano</td><td>média com pesos maiores no centro</td><td>suavização mais natural</td></tr><tr><td>Sobel, Prewitt</td><td>destacam mudanças bruscas</td><td><b>detectar bordas</b></td></tr><tr><td>Laplaciano</td><td>segunda derivada</td><td>realçar detalhes e bordas</td></tr></table>
<div class="ex">Vizinhos: 10, 12, 11, 255, 13, 12, 11, 10, 12. A média dá cerca de 38 (o ponto branco “contamina”). A mediana, ordenando, dá <b>12</b>: o ruído some.</div>
<div class="ideia">Mediana é como a nota do meio da turma: um único aluno com nota absurda não muda o resultado.</div>
<div class="resumo">Sal e pimenta → mediana. Bordas → Sobel.</div>`],
['Morfologia matemática',`<p>Usada principalmente em imagens <b>binárias</b> (preto e branco):</p>
<ul><li><b>Erosão</b>: encolhe os objetos brancos. Pontinhos pequenos somem.</li><li><b>Dilatação</b>: engorda os objetos brancos. Buracos pequenos fecham.</li><li><b>Abertura</b> = erosão e depois dilatação. <b>Remove pontinhos</b> de ruído e mantém o tamanho dos objetos grandes.</li><li><b>Fechamento</b> = dilatação e depois erosão. <b>Preenche buracos</b> pequenos dentro dos objetos.</li></ul>
<div class="ideia">Abertura é como lixar uma peça (some a sujeira pequena) e depois passar uma camada de tinta para ela voltar ao tamanho original.</div>
<div class="resumo">Ruído pequeno fora dos objetos → abertura. Buraco dentro dos objetos → fechamento.</div>`]
]);
P('pi',[
['Número de níveis = 2<sup>bits</sup>.','2<sup>8</sup> = 256.','Valores de 0 a 255 dão 256 níveis.'],
['Ruído sal e pimenta = pixels isolados com valores extremos.','A mediana ignora os extremos, porque pega o valor do meio.','Ela remove o ruído sem borrar as bordas, ao contrário da média.'],
['Pixels: 1000 × 1000 = 1.000.000.','RGB com 8 bits por canal = 3 bytes por pixel.','1.000.000 × 3 = 3.000.000 bytes = 3 MB.'],
['O problema são pontinhos brancos pequenos no fundo.','A erosão apaga esses pontos, e a dilatação depois devolve o tamanho dos objetos grandes.','Erosão seguida de dilatação = abertura.']
]);

{n:2,q:`O histograma de uma imagem mostra todos os pixels concentrados em uma faixa estreita no meio da escala. A técnica indicada para melhorar o contraste é:`,a:['*equalização do histograma','filtro da mediana','erosão','detecção de bordas com Sobel','redução da resolução'],e:`A equalização espalha os tons por toda a escala.`,p:['Faixa estreita no meio = pouco contraste.','Para aumentar o contraste, é preciso espalhar os tons.','Isso é a equalização do histograma.']},

{n:3,q:`Em uma imagem binária de células, há pequenos buracos pretos dentro das células brancas. A operação morfológica adequada para preenchê-los é:`,a:['*fechamento (dilatação seguida de erosão)','abertura (erosão seguida de dilatação)','erosão apenas','filtro de Sobel','equalização do histograma'],e:`A dilatação fecha os buracos; a erosão seguinte devolve o tamanho original.`,p:['O problema são buracos dentro dos objetos.','A dilatação engorda o branco e fecha os buracos; a erosão depois corrige o tamanho.','Dilatação seguida de erosão = fechamento.']}

T('web',[
['Para que serve esta matéria',`<p>Programação Web explica como funcionam sites e sistemas na internet: o navegador (<b>cliente</b>) pede e o <b>servidor</b> responde, usando o protocolo <b>HTTP</b>.</p>
<ul><li><b>Front-end</b>: o que roda no navegador (HTML para estrutura, CSS para aparência, JavaScript para comportamento).</li><li><b>Back-end</b>: o que roda no servidor (regras de negócio, banco de dados, APIs).</li></ul>
<div class="ideia">Num restaurante, o salão e o cardápio são o front-end; a cozinha é o back-end; o garçom que leva pedidos e traz pratos é o HTTP.</div>
<div class="resumo">No ENADE: métodos e códigos HTTP, REST, stateless, cookies/sessões e JavaScript assíncrono.</div>`],
['HTTP: métodos e códigos',`<table class="mini"><tr><th>Método</th><th>Para quê</th></tr><tr><td>GET</td><td>buscar (nunca deve alterar nada)</td></tr><tr><td>POST</td><td>criar</td></tr><tr><td>PUT / PATCH</td><td>substituir / alterar parte</td></tr><tr><td>DELETE</td><td>remover</td></tr></table>
<table class="mini"><tr><th>Família</th><th>Significado</th><th>Exemplos</th></tr><tr><td>2xx</td><td>deu certo</td><td>200 OK, 201 Created</td></tr><tr><td>3xx</td><td>redirecionamento</td><td>301 movido permanentemente</td></tr><tr><td>4xx</td><td><b>erro do cliente</b></td><td>400 pedido inválido, 401 não autenticado, 403 proibido, <b>404 não encontrado</b></td></tr><tr><td>5xx</td><td><b>erro do servidor</b></td><td>500 erro interno, 503 indisponível</td></tr></table>
<div class="pega">401 = “quem é você?” (falta login). 403 = “sei quem você é, mas você não pode”.</div>
<div class="resumo">4xx: o pedido tem problema. 5xx: o servidor tem problema.</div>`],
['APIs REST',`<p><b>REST</b> é um estilo para criar APIs: a <b>URL indica o recurso</b> (substantivo) e o <b>método HTTP indica a ação</b> (verbo).</p>
<div class="ex">GET /produtos → lista. GET /produtos/42 → um produto. POST /produtos → cria. PUT /produtos/42 → atualiza. DELETE /produtos/42 → remove.</div>
<div class="pega">URLs com verbos como /removerProduto ou /produtos/42/delete fogem do REST. A ação vai no método, não na URL.</div>
<p>Os dados normalmente vão em <b>JSON</b>.</p>
<div class="resumo">URL = coisa. Método = ação.</div>`],
['Stateless, cookies e sessões',`<p>O HTTP é <b>stateless</b> (sem estado): cada pedido é independente e o servidor não lembra dos anteriores por conta própria.</p>
<div class="ideia">É como um atendente com amnésia: a cada pergunta, você precisa mostrar seu crachá de novo.</div>
<p>Para lembrar do usuário (por exemplo, que ele está logado), usam-se:</p>
<ul><li><b>Cookies</b>: pequenos dados que o navegador guarda e envia de volta a cada pedido.</li><li><b>Sessão</b>: o servidor guarda os dados e manda só um identificador num cookie.</li><li><b>Tokens</b> (como JWT): o cliente envia um token assinado em cada pedido.</li></ul>
<div class="resumo">Stateless = sem memória entre pedidos. Cookie, sessão e token dão essa memória.</div>`],
['JavaScript assíncrono',`<p>O JavaScript roda numa <b>única thread</b>. Para não travar esperando algo demorado (rede, timer), ele usa o <b>event loop</b>:</p>
<ol><li>Primeiro roda todo o código <b>normal (síncrono)</b>.</li><li>Depois roda as <b>microtarefas</b>: Promises (.then, await).</li><li>Depois as <b>macrotarefas</b>: setTimeout, eventos.</li></ol>
<div class="ex"><code>log("A"); setTimeout(()=&gt;log("B"),0); Promise.resolve().then(()=&gt;log("C")); log("D");</code><br>Síncrono: A, D. Microtarefa: C. Macrotarefa: B. Resultado: <b>A, D, C, B</b>.</div>
<div class="ideia">É uma fila de prioridades no balcão: primeiro quem já está sendo atendido, depois os clientes VIP (Promises), depois a fila comum (setTimeout).</div>
<div class="pega">setTimeout com 0 <b>não</b> roda na hora: ele espera todo o código síncrono e as Promises.</div>
<div class="resumo">Síncrono → Promises → setTimeout.</div>`]
]);
P('web',[
['Lembre as famílias: 4xx são erros do cliente.','404 é o mais famoso: Not Found.','Significa recurso não encontrado.'],
['Em REST, a ação vai no método HTTP e o recurso vai na URL.','Remover = DELETE. Recurso = /produtos/42.','Resposta: DELETE /produtos/42.'],
['Stateless = sem estado guardado entre pedidos.','Cada requisição é tratada de forma independente.','Por isso existem cookies, sessões e tokens.'],
['Código síncrono primeiro: A e D.','Depois as microtarefas (Promise): C.','Por último as macrotarefas (setTimeout): B. Resultado: A, D, C, B.']
]);

{n:2,q:`Um usuário logado tenta acessar a área de administrador, mas não tem permissão. O código HTTP mais adequado é:`,a:['*403 Forbidden','401 Unauthorized','404 Not Found','200 OK','301 Moved Permanently'],e:`Ele está autenticado, mas não autorizado: 403.`,p:['O usuário já está logado (o servidor sabe quem ele é).','O problema é falta de permissão.','Sem permissão, mas identificado = 403. Sem login seria 401.']},
{n:2,q:`Em uma API REST, para cadastrar um novo cliente enviando seus dados em JSON, usa-se:`,a:['*POST /clientes','GET /clientes/novo','DELETE /clientes','GET /cadastrarCliente','PUT /criar'],e:`Criar recurso = POST na coleção.`,p:['A ação é criar.','Criar em REST = POST.','O recurso é a coleção /clientes.']},

{n:3,q:`Um site quer manter o usuário logado entre várias páginas. Sabendo que o HTTP é stateless, a solução mais comum é:`,a:['*criar uma sessão no servidor e enviar ao navegador um cookie com o identificador da sessão','pedir login e senha a cada clique','guardar a senha do usuário na URL','usar apenas o método GET','desativar o HTTPS'],e:`O cookie com o id da sessão é enviado automaticamente a cada pedido.`,p:['O servidor não lembra sozinho de pedidos anteriores.','É preciso que cada pedido traga uma identificação.','Solução: sessão no servidor + cookie com o identificador.']}
