T('mobile',[
['Para que serve esta matéria',`<p>Programação para Dispositivos Móveis trata dos cuidados especiais ao criar apps: tela pequena, bateria limitada, internet instável e o sistema que pode fechar o app a qualquer momento.</p>
<div class="resumo">No ENADE: ciclo de vida da Activity no Android, thread principal, nativo × multiplataforma e permissões.</div>`],
['Ciclo de vida da Activity (Android)',`<p>Uma <b>Activity</b> é uma tela do app. O Android avisa o app sobre cada mudança chamando métodos:</p>
<ul><li><b>onCreate()</b>: a tela foi criada. Monta a interface.</li><li><b>onStart()</b>: ficou visível.</li><li><b>onResume()</b>: está na frente e o usuário pode interagir.</li><li><b>onPause()</b>: perdeu o foco (chegou uma ligação, abriu um diálogo).</li><li><b>onStop()</b>: não está mais visível.</li><li><b>onDestroy()</b>: vai ser destruída.</li></ul>
<div class="ideia">É como uma loja: onCreate é montar a loja; onStart é abrir as portas; onResume é atender clientes; onPause é uma pausa rápida; onStop é fechar as portas; onDestroy é desmontar a loja.</div>
<div class="pega">Ao girar a tela, por padrão a Activity é <b>destruída e recriada</b>. Dados não salvos podem se perder.</div>
<div class="resumo">onCreate → onStart → onResume → (uso) → onPause → onStop → onDestroy.</div>`],
['Thread principal e tarefas demoradas',`<p>A <b>thread principal</b> (UI thread) é a responsável por desenhar a tela e responder aos toques.</p>
<p>Se você faz algo demorado nela (rede, banco de dados, arquivo grande), a tela <b>congela</b>. Depois de alguns segundos, o Android mostra o aviso <b>ANR</b> (“o app não está respondendo”).</p>
<div class="ideia">É como o caixa único de uma loja sair para buscar um produto no estoque: a fila inteira fica parada esperando.</div>
<p>Solução: fazer o trabalho pesado em <b>segundo plano</b> (coroutines, threads, WorkManager) e só voltar à thread principal para atualizar a tela.</p>
<div class="resumo">Nada demorado na thread principal.</div>`],
['Nativo, multiplataforma e web',`<table class="mini"><tr><th>Abordagem</th><th>Como</th><th>Vantagem</th><th>Desvantagem</th></tr><tr><td><b>Nativo</b></td><td>Kotlin/Java (Android), Swift (iOS)</td><td>melhor desempenho e acesso total ao hardware</td><td>dois códigos, mais custo</td></tr><tr><td><b>Multiplataforma</b></td><td>Flutter, React Native</td><td>um código para os dois sistemas</td><td>acesso ao hardware pode ser limitado</td></tr><tr><td><b>Web / PWA</b></td><td>site que funciona como app</td><td>sem loja, fácil de atualizar</td><td>menos recursos do aparelho</td></tr></table>
<div class="ex">Equipe pequena, pressa e app simples → multiplataforma. Jogo 3D pesado ou uso intenso de sensores → nativo.</div>
<p><b>Permissões</b>: acesso a câmera, localização ou contatos precisa ser pedido ao usuário <b>na hora do uso</b>, explicando o motivo.</p>
<div class="resumo">Pouco tempo e equipe pequena → multiplataforma. Muito desempenho ou hardware → nativo.</div>`]
]);
P('mobile',[
['Lembre o ciclo: o primeiro método chamado é o de criação.','onCreate() é chamado quando a Activity é criada.','É nele que se monta a interface.'],
['A thread principal desenha a tela.','Se ela fica esperando a rede, não consegue mais desenhar nem responder.','A tela trava e aparece o aviso ANR.'],
['Pistas: rapidez, Android e iOS, equipe pequena, pouco uso de hardware.','Um framework multiplataforma permite um único código para os dois sistemas.','Resposta: Flutter ou React Native.']
]);
N('mobile',[
{n:1,q:`No Android, o método chamado quando a Activity perde o foco, por exemplo ao chegar uma ligação, é o:`,a:['*onPause()','onCreate()','onStart()','onDestroy()','onResume()'],e:`onPause marca a saída do primeiro plano.`,p:['A tela ainda pode estar parcialmente visível, mas perdeu o foco.','O método dessa situação é onPause().','onResume() seria a volta ao foco.']},
{n:1,q:`Flutter e React Native são exemplos de frameworks:`,a:['*multiplataforma','exclusivamente nativos para iOS','de banco de dados','de sistemas operacionais','de compiladores de C'],e:`Permitem um único código para Android e iOS.`,p:['Eles geram apps para Android e iOS a partir de um código.','Isso é desenvolvimento multiplataforma.','Nativo seria Kotlin para Android ou Swift para iOS.']},
{n:2,q:`Um app de câmera com filtros 3D em tempo real e uso intenso do processador gráfico deve, preferencialmente, ser desenvolvido:`,a:['*de forma nativa, para ter máximo desempenho e acesso direto ao hardware','como site sem responsividade','apenas como PWA','com uma planilha','sem acesso à câmera'],e:`Uso pesado de hardware favorece o nativo.`,p:['Pistas: tempo real, 3D e uso intenso de hardware.','A abordagem com melhor desempenho e acesso ao hardware é a nativa.','Multiplataforma e web podem limitar isso.']},
{n:2,q:`Ao girar o celular, um formulário Android perde o texto digitado. A causa mais provável é:`,a:['*a Activity é destruída e recriada na mudança de orientação, e o estado não foi salvo','o teclado apagou o texto','falta de internet','a bateria estava fraca','o app não tem permissão de câmera'],e:`Por padrão, a mudança de configuração recria a Activity; é preciso salvar o estado (ViewModel, onSaveInstanceState).`,p:['Lembre: girar a tela é uma mudança de configuração.','O Android destrói e recria a Activity.','Se o estado não foi salvo, o texto se perde.']},
{n:3,q:`Sobre boas práticas em apps móveis, avalie:<br>I. Permissões sensíveis devem ser pedidas no momento em que o recurso for usado, explicando o motivo.<br>II. Consultas ao banco de dados local podem ser feitas na thread principal sem risco algum.<br>III. O app deve considerar que a conexão com a internet pode falhar.<br>É correto o que se afirma em:`,a:['*I e III, apenas','I, apenas','II, apenas','II e III, apenas','I, II e III'],e:`II é falsa: operações demoradas na thread principal podem travar a tela.`,p:['I: pedir a permissão no contexto ajuda o usuário a entender. Verdadeira.','II: banco de dados pode demorar e travar a interface. Falsa.','III: redes móveis são instáveis. Verdadeira. Resposta: I e III.']}
]);

T('ihc',[
['Para que serve esta matéria',`<p>Interação Humano-Computador (IHC) estuda como fazer sistemas <b>fáceis e agradáveis de usar</b>. O foco é o usuário, não a tecnologia.</p>
<ul><li><b>Usabilidade</b>: facilidade de aprender, eficiência, poucos erros e satisfação.</li><li><b>Acessibilidade</b>: o sistema funciona para pessoas com deficiência (leitores de tela, contraste, legendas).</li></ul>
<div class="resumo">No ENADE: as 10 heurísticas de Nielsen, métodos de avaliação e acessibilidade.</div>`],
['As 10 heurísticas de Nielsen',`<table class="mini"><tr><th>Heurística</th><th>Em palavras simples</th><th>Exemplo</th></tr><tr><td>1. Visibilidade do status</td><td>mostrar o que está acontecendo</td><td>barra de progresso</td></tr><tr><td>2. Correspondência com o mundo real</td><td>falar a língua do usuário</td><td>ícone de lixeira para apagar</td></tr><tr><td>3. Controle e liberdade</td><td>deixar desfazer e sair</td><td>botão desfazer, cancelar</td></tr><tr><td>4. Consistência e padrões</td><td>o mesmo jeito em todo lugar</td><td>“Salvar” sempre no mesmo lugar</td></tr><tr><td>5. Prevenção de erros</td><td>evitar que o erro aconteça</td><td>confirmar antes de excluir; desabilitar botão inválido</td></tr><tr><td>6. Reconhecer em vez de lembrar</td><td>mostrar opções, não exigir memória</td><td>menu com sugestões</td></tr><tr><td>7. Flexibilidade e eficiência</td><td>atalhos para quem é experiente</td><td>Ctrl+C</td></tr><tr><td>8. Estética minimalista</td><td>só o necessário na tela</td><td>formulário enxuto</td></tr><tr><td>9. Ajudar a reconhecer e corrigir erros</td><td>mensagem clara com solução</td><td>“Senha precisa de 8 caracteres”</td></tr><tr><td>10. Ajuda e documentação</td><td>ajuda fácil de achar</td><td>FAQ, dicas</td></tr></table>
<div class="pega">Prevenir (5) é antes do erro. Ajudar a corrigir (9) é depois do erro. Desfazer é controle e liberdade (3).</div>
<div class="resumo">Leia o problema descrito e pergunte: o usuário não sabe o que acontece? Não consegue voltar? Precisa decorar?</div>`],
['Como avaliar uma interface',`<ul><li><b>Avaliação heurística</b>: <b>especialistas</b> inspecionam a interface usando as heurísticas. Rápida e barata, <b>sem usuários</b>. 3 a 5 avaliadores já encontram a maioria dos problemas.</li><li><b>Percurso cognitivo</b>: especialistas simulam o passo a passo de um usuário novato numa tarefa.</li><li><b>Teste de usabilidade</b>: <b>usuários reais</b> fazem tarefas enquanto são observados. Mostra problemas que especialistas não preveem.</li></ul>
<div class="ideia">Avaliação heurística é um chef provando o prato da cozinha. Teste com usuários é observar os clientes comendo.</div>
<p>Os métodos se <b>complementam</b>; um não substitui o outro.</p>
<div class="resumo">Especialista sem usuário → heurística. Usuário real → teste de usabilidade.</div>`],
['Acessibilidade',`<p>Recomendações (baseadas nas diretrizes <b>WCAG</b> e, no Brasil, no <b>eMAG</b>):</p>
<ul><li>Texto alternativo (<code>alt</code>) em imagens, para leitores de tela.</li><li>Bom <b>contraste</b> entre texto e fundo.</li><li>Não depender só da cor para passar informação (daltônicos).</li><li>Tudo deve funcionar pelo <b>teclado</b>.</li><li>Legendas em vídeos.</li></ul>
<div class="ex">Formulário que mostra erro só deixando a borda vermelha falha para quem não distingue cores. Adicione um texto: “Campo obrigatório”.</div>
<div class="resumo">Acessibilidade = funcionar para todos, inclusive quem não enxerga, não ouve ou não usa mouse.</div>`]
]);

{n:1,q:`Oferecer atalhos de teclado para usuários experientes atende à heurística de:`,a:['*flexibilidade e eficiência de uso','consistência e padrões','estética minimalista','visibilidade do status','correspondência com o mundo real'],e:`Atalhos aceleram o uso para quem já conhece o sistema.`,p:['Atalhos servem para quem já é experiente fazer mais rápido.','Isso é flexibilidade e eficiência de uso.','Os novatos continuam com o caminho normal.']},
{n:2,q:`Um sistema desabilita o botão “Enviar” até que todos os campos obrigatórios estejam preenchidos. Isso atende principalmente à heurística de:`,a:['*prevenção de erros','ajuda e documentação','reconhecimento em vez de memorização','ajudar a reconhecer e corrigir erros','controle e liberdade do usuário'],e:`O sistema impede o erro antes que ele aconteça.`,p:['O botão desabilitado evita que o usuário envie algo incompleto.','Evitar o erro antes que ele aconteça é prevenção de erros.','Corrigir erros seria depois que eles acontecem.']},
{n:2,q:`Um formulário indica campos com erro apenas mudando a cor da borda para vermelho. O principal problema de acessibilidade é:`,a:['*depender apenas da cor, o que prejudica pessoas com daltonismo e usuários de leitores de tela','usar fonte grande demais','ter poucos campos','usar HTML','não ter animações'],e:`A informação deve ser transmitida também por texto ou ícone.`,p:['A informação de erro está só na cor.','Quem não distingue cores ou usa leitor de tela não percebe.','Solução: acrescentar uma mensagem de texto.']},

{n:3,q:`Ao preencher um formulário, o usuário digita uma data errada e recebe a mensagem “Erro 0x45”. Qual heurística é violada e qual a correção?`,a:['*ajudar o usuário a reconhecer, diagnosticar e corrigir erros; usar mensagem clara, como “Use o formato dd/mm/aaaa”','estética minimalista; remover a mensagem','visibilidade do status; mostrar uma barra de progresso','flexibilidade; criar um atalho de teclado','correspondência com o mundo real; trocar a cor da tela'],e:`Mensagens de erro devem ser em linguagem simples, dizer o problema e sugerir a solução.`,p:['O erro já aconteceu e a mensagem não explica nada.','A heurística sobre mensagens de erro claras é a 9: reconhecer, diagnosticar e corrigir erros.','A correção é uma mensagem simples que diga como resolver.']}

T('infsoc',[
['Para que serve esta matéria',`<p>Informática e Sociedade discute o <b>impacto da tecnologia na vida das pessoas</b>: privacidade, ética, leis, trabalho e inclusão digital. No ENADE aparece tanto nas questões de computação quanto nas de formação geral.</p>
<div class="resumo">Mais cobrado: LGPD, viés algorítmico, Marco Civil da Internet, ética profissional e exclusão digital.</div>`],
['LGPD: Lei Geral de Proteção de Dados',`<p>A <b>LGPD (Lei 13.709/2018)</b> regula como empresas e governo tratam <b>dados pessoais</b> (qualquer dado que identifique uma pessoa). Foi inspirada no GDPR europeu e é fiscalizada pela <b>ANPD</b>.</p>
<ul><li><b>Dado pessoal</b>: nome, CPF, e-mail, localização.</li><li><b>Dado sensível</b>: saúde, religião, origem racial, opinião política, biometria, vida sexual. Exige mais cuidado.</li><li><b>Titular</b>: a pessoa dona dos dados.</li><li><b>Controlador</b>: quem decide o que fazer com os dados. <b>Operador</b>: quem trata em nome do controlador.</li></ul>
<p>O <b>consentimento</b> é uma das <b>dez bases legais</b>, não a única. Outras: cumprir uma obrigação legal, executar um contrato, proteger a vida, legítimo interesse…</p>
<p>Direitos do titular: acessar, corrigir, pedir a eliminação (quando baseado em consentimento), saber com quem os dados foram compartilhados e pedir <b>revisão de decisões automatizadas</b>.</p>
<div class="pega">“O consentimento é a única base legal” é <b>falso</b>, e cai bastante.</div>
<div class="resumo">LGPD: 10 bases legais, dados sensíveis com cuidado extra, direitos do titular.</div>`],
['Ética e viés algorítmico',`<p>Algoritmos de IA aprendem com <b>dados do passado</b>. Se esses dados têm preconceitos, o algoritmo <b>repete e amplia</b> esses preconceitos. Isso é o <b>viés algorítmico</b>.</p>
<div class="ex">Um sistema de seleção treinado com contratações antigas, em que quase só homens eram contratados, passa a rejeitar mais mulheres.</div>
<div class="ideia">É como aprender a cozinhar só com as receitas da sua avó: você vai repetir o que ela fazia, inclusive os erros.</div>
<p>Como reduzir: auditar dados e resultados, ter equipes diversas, transparência e explicação das decisões e possibilidade de revisão humana.</p>
<div class="resumo">Dados enviesados → algoritmo enviesado. A culpa não é do hardware nem do código em si.</div>`],
['Marco Civil, trabalho e inclusão',`<p>O <b>Marco Civil da Internet (Lei 12.965/2014)</b> é a “constituição da internet” no Brasil. Princípios: <b>neutralidade da rede</b> (os provedores não podem tratar diferente os dados por conteúdo ou origem), privacidade e liberdade de expressão.</p>
<p><b>Exclusão digital</b>: parte da população não tem acesso à internet, a equipamentos ou às habilidades para usá-los, o que aumenta desigualdades.</p>
<p><b>Trabalho</b>: automação elimina algumas funções e cria outras; plataformas digitais trouxeram novas formas de trabalho, com debates sobre direitos.</p>
<p>Outros temas: <b>software livre</b> (liberdade de usar, estudar, modificar e distribuir), crimes cibernéticos (Lei Carolina Dieckmann, 12.737/2012) e desinformação.</p>
<div class="resumo">Marco Civil = neutralidade, privacidade, liberdade. Exclusão digital amplia desigualdade.</div>`]
]);

{n:1,q:`O órgão responsável por fiscalizar o cumprimento da LGPD no Brasil é a:`,a:['*ANPD (Autoridade Nacional de Proteção de Dados)','Anatel','Receita Federal','ANVISA','Polícia Federal'],e:`A ANPD fiscaliza e aplica sanções da LGPD.`,p:['A LGPD criou um órgão próprio.','Esse órgão é a Autoridade Nacional de Proteção de Dados.','Sigla: ANPD.']},
{n:2,q:`O princípio do Marco Civil da Internet que impede os provedores de dar tratamento diferente aos dados conforme o conteúdo, a origem ou o destino é a:`,a:['*neutralidade da rede','portabilidade de dados','criptografia obrigatória','inclusão digital','propriedade intelectual'],e:`Neutralidade = tratar todos os pacotes de forma igual.`,p:['A pista é: não tratar dados de forma diferente conforme o conteúdo.','Esse princípio é a neutralidade da rede.','Ele está no Marco Civil da Internet.']},
{n:2,q:`Um banco usa um sistema automático que nega crédito a um cliente. Pela LGPD, o cliente tem direito a:`,a:['*solicitar a revisão da decisão tomada exclusivamente com base em tratamento automatizado','nada, pois decisões automáticas são definitivas','receber o código-fonte completo do sistema','exigir que o banco apague todos os dados de todos os clientes','um empréstimo obrigatório'],e:`O art. 20 da LGPD garante revisão de decisões automatizadas.`,p:['A decisão foi tomada só por um sistema automático.','A LGPD dá ao titular o direito de pedir revisão dessas decisões.','Ele não tem direito ao código-fonte inteiro nem a um empréstimo garantido.']},
{n:2,q:`Software livre é aquele que garante ao usuário a liberdade de:`,a:['*usar, estudar, modificar e redistribuir o programa','apenas usar sem pagar','apenas ver as telas','vender licenças exclusivas','usar somente em um computador'],e:`As quatro liberdades definidas pela Free Software Foundation.`,p:['Lembre as quatro liberdades do software livre.','Usar, estudar (acessar o código), modificar e redistribuir.','Ser gratuito não é o mesmo que ser livre.']},
{n:3,q:`Analise as asserções:<br>I. Sistemas de reconhecimento facial podem errar mais com determinados grupos de pessoas.<br>PORQUE<br>II. Se os dados de treinamento têm pouca representação de certos grupos, o modelo tende a aprender pior as características desses grupos.<br>A respeito dessas asserções, assinale a opção correta.`,fix:true,a:['*As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.','As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.','A asserção I é verdadeira, e a II é falsa.','A asserção I é falsa, e a II é verdadeira.','As asserções I e II são falsas.'],e:`Dados pouco representativos geram modelos com desempenho desigual: um exemplo de viés algorítmico.`,p:['Julgue I: estudos mostram taxas de erro maiores em certos grupos. Verdadeira.','Julgue II: com poucos exemplos de um grupo, o modelo aprende pior esse grupo. Verdadeira.','O “porque” se encaixa: a II explica a causa da I.']}
]);

T('infedu',[
['Para que serve esta matéria',`<p>Informática na Educação estuda como usar a tecnologia para <b>ensinar e aprender melhor</b>, e quais teorias da aprendizagem embasam isso.</p>
<div class="resumo">No ENADE: teorias (Piaget, Vygotsky, Papert, Skinner), pensamento computacional e tipos de software educacional.</div>`],
['As teorias de aprendizagem',`<table class="mini"><tr><th>Autor</th><th>Teoria</th><th>Ideia principal</th></tr><tr><td><b>Skinner</b></td><td>Behaviorismo</td><td>aprender por estímulo e <b>recompensa</b> (condicionamento). Base da instrução programada e de exercícios com acerto/erro imediato.</td></tr><tr><td><b>Piaget</b></td><td>Construtivismo</td><td>o aluno <b>constrói</b> o conhecimento interagindo com o mundo, passando por <b>estágios</b> de desenvolvimento.</td></tr><tr><td><b>Vygotsky</b></td><td>Sociointeracionismo</td><td>aprende-se na <b>interação social</b>. <b>Zona de desenvolvimento proximal (ZDP)</b>: o que o aluno faz com ajuda de alguém mais experiente, mas ainda não sozinho.</td></tr><tr><td><b>Papert</b></td><td>Construcionismo</td><td>o aluno aprende <b>construindo algo concreto</b> no computador. Criou a linguagem <b>Logo</b> (a tartaruga).</td></tr></table>
<div class="ideia">Skinner: dar um adesivo para cada acerto. Piaget: deixar a criança descobrir brincando. Vygotsky: um colega mais experiente dando uma mãozinha. Papert: aprender geometria programando uma tartaruga para desenhar.</div>
<div class="pega">Construtivismo (Piaget) ≠ construcionismo (Papert). O construcionismo acrescenta a <b>construção de um artefato</b>, geralmente com o computador.</div>
<div class="resumo">Recompensa → Skinner. Estágios → Piaget. Ajuda do outro/ZDP → Vygotsky. Logo/construir → Papert.</div>`],
['Pensamento computacional',`<p>É resolver problemas usando as estratégias de quem programa. Tem <b>quatro pilares</b>:</p>
<ul><li><b>Decomposição</b>: quebrar um problema grande em partes menores.</li><li><b>Reconhecimento de padrões</b>: achar semelhanças entre problemas ou partes.</li><li><b>Abstração</b>: focar no que importa e ignorar detalhes irrelevantes.</li><li><b>Algoritmo</b>: escrever os passos para resolver.</li></ul>
<div class="ex">Organizar uma festa: dividir em comida, música e convites (decomposição); perceber que já fez algo parecido no aniversário passado (padrões); não se preocupar com a cor do guardanapo agora (abstração); fazer a lista de tarefas em ordem (algoritmo).</div>
<p>Ferramentas comuns na escola: <b>Scratch</b>, robótica educacional e computação desplugada (atividades sem computador).</p>
<div class="resumo">Decomposição, padrões, abstração e algoritmo.</div>`],
['Software e ambientes educacionais',`<ul><li><b>Tutorial / exercício e prática</b>: o conteúdo é apresentado e o aluno responde (mais ligado ao behaviorismo).</li><li><b>Simulação</b>: o aluno experimenta um modelo (laboratório virtual).</li><li><b>Jogos educacionais</b> e <b>gamificação</b> (pontos, medalhas, ranking em atividades que não são jogos).</li><li><b>AVA</b> (Ambiente Virtual de Aprendizagem), como o Moodle: organiza aulas, atividades e fóruns.</li><li><b>Programação</b> (Logo, Scratch): ligada ao construcionismo.</li></ul>
<div class="resumo">Exercício com recompensa → behaviorismo. Construir projetos → construcionismo. Fórum e colaboração → sociointeracionismo.</div>`]
]);

['Palavras-chave: construcionismo e linguagem Logo.','Quem criou os dois foi Seymour Papert.','Piaget criou o construtivismo, que é diferente.'],

]);

{n:1,q:`A teoria que propõe que o conhecimento é construído pelo próprio aluno, passando por estágios de desenvolvimento cognitivo, é de:`,a:['*Jean Piaget','B. F. Skinner','Seymour Papert','Lev Vygotsky','Howard Gardner'],e:`Estágios do desenvolvimento = Piaget (construtivismo).`,p:['Pista: estágios de desenvolvimento.','Os estágios são a marca de Piaget.','A teoria é o construtivismo.']},
{n:1,q:`Um AVA (Ambiente Virtual de Aprendizagem) bastante usado em universidades é o:`,a:['*Moodle','Photoshop','MySQL','Linux','Excel'],e:`Moodle é um AVA de código aberto.`,p:['AVA organiza aulas, atividades e fóruns on-line.','O exemplo mais conhecido é o Moodle.','Os outros são programas de outras áreas.']},
{n:2,q:`Um software educacional apresenta exercícios e dá pontos e mensagens de parabéns a cada acerto imediato, reforçando o comportamento desejado. Ele se apoia principalmente no:`,a:['*behaviorismo, de Skinner','construcionismo, de Papert','sociointeracionismo, de Vygotsky','construtivismo, de Piaget','pensamento computacional'],e:`Reforço imediato por acerto é condicionamento operante.`,p:['Pista: recompensa a cada acerto.','Aprender por estímulo e recompensa é o behaviorismo.','O autor é Skinner.']},
{n:2,q:`Ao criar um jogo no Scratch, o aluno percebe que o movimento de vários personagens segue a mesma lógica e reaproveita o mesmo bloco de código. Isso exemplifica o pilar do pensamento computacional chamado:`,a:['*reconhecimento de padrões','decomposição','abstração','depuração','avaliação'],e:`Perceber semelhanças entre partes do problema é reconhecer padrões.`,p:['O aluno percebeu que várias partes são parecidas.','Achar semelhanças é o pilar de reconhecimento de padrões.','Decomposição seria dividir o problema em partes.']},
{n:2,q:`Usar pontos, medalhas e ranking em uma disciplina de programação que não é um jogo é chamado de:`,a:['*gamificação','simulação','instrução programada','avaliação heurística','computação desplugada'],e:`Gamificação aplica elementos de jogos em contextos que não são jogos.`,p:['Pontos, medalhas e ranking são elementos de jogos.','Aplicá-los fora de um jogo se chama gamificação.','Não é um jogo educacional em si.']},
{n:3,q:`Analise as asserções:<br>I. Programar a tartaruga do Logo para desenhar figuras é uma atividade alinhada ao construcionismo.<br>PORQUE<br>II. No construcionismo, o aluno aprende ao construir um artefato concreto e significativo com o computador.<br>A respeito dessas asserções, assinale a opção correta.`,fix:true,a:['*As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.','As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.','A asserção I é verdadeira, e a II é falsa.','A asserção I é falsa, e a II é verdadeira.','As asserções I e II são falsas.'],e:`O desenho programado é o artefato construído, ideia central de Papert.`,p:['Julgue I: Logo foi criado por Papert para o construcionismo. Verdadeira.','Julgue II: é a definição de construcionismo. Verdadeira.','O “porque” se encaixa: a atividade é construcionista justamente porque o aluno constrói algo.']}
]);

 ['2026-11-22',['bd','bd2'],'Escreva as consultas SQL antes de olhar as alternativas.'],
 ['2026-11-23',['es1','es2','mps'],'Associe cada processo e técnica a um cenário.'],
 ['2026-11-24',['lfa','tc','comp'],'Teoria: cuidado com a direção das reduções.'],
 ['2026-11-25',['ia','ia2','simul'],'Simulação Discreta é eletiva.'],
 ['2026-11-26',['web','mobile','ihc','cg','pi'],'Matérias mais curtas: uma trilha e um quiz para cada.'],
 ['2026-11-27',['infsoc','infedu'],'Depois das trilhas, faça um simulado de 20 questões.',true],
 ['2026-11-28',[],'Simulado completo pela manhã. À tarde, só a aba Meus erros. À noite, descanse.',true],
 ['2026-11-29',[],'Dia da prova.',false,true]
];
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
let ST={read:{},ans:{}};
try{const r=localStorage.getItem('enade26');if(r)ST=Object.assign(ST,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('enade26',JSON.stringify(ST))}catch(e){}}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=(n,w)=>String(n).padStart(w,'0');
function stat(s){const steps=s.trilha.length,read=s.trilha.filter((_,i)=>ST.read[s.id+':'+i]).length;
  const tried=s.q.filter(q=>ST.ans[q.id]!==undefined).length,right=s.q.filter(q=>ST.ans[q.id]===1).length;
  const frac=(read/steps)*.5+(tried/s.q.length)*.5;return{steps,read,tried,right,n:s.q.length,frac,done:read===steps&&tried===s.q.length}}
function hud(){
  const d=Math.round((EXAM-today())/864e5);
  let f=0,done=0;SUBJ.forEach(s=>{const t=stat(s);f+=t.frac;if(t.done)done++});
  const right=ALLQ.filter(q=>ST.ans[q.id]===1).length;
  document.getElementById('p1').innerHTML=`<div><span>${d>0?'Dias':'Prova'}</span><b>${d>0?pad(d,2):d===0?'HOJE':'OK'}</b></div><div class="hide"><span>Matérias</span><b>${pad(done,2)}/${SUBJ.length}</b></div><div><span>Pontos</span><b>${pad(right*10,6)}</b></div><div class="hide"><span>Progresso</span><b>${Math.round(f/SUBJ.length*100)}%</b></div>`;
}
const $v=()=>document.getElementById('view');
function chip(id){const s=BY[id],t=stat(s);return `<a class="chip ${t.done?'done':t.frac>0?'half':''}" href="#m-${id}"><span class="d"></span>${esc(s.nome)}${s.el?' <span class="pill warn">eletiva</span>':''}</a>`}
// ---------- Cronograma ----------
function vCron(){
  const t=ymd(today());
  let h=`<div class="title"><div><div class="crumb">Cronograma · 15 a 29 de novembro</div><h2>Plano de revisão</h2></div>
  <p class="lead">Cada dia é uma fase. Em cada matéria, leia a trilha, marque o que entendeu, veja o que mais cai e faça o quiz.</p></div><ol class="worlds">`;
  PLAN.forEach(([ds,ids,note,sim,exam])=>{
    const d=new Date(ds+'T12:00'),isT=ds===t,past=ds<t;
    const done=ids.length&&ids.every(i=>stat(BY[i]).done);
    const cls=[done?'clear':'',isT?'on':'',past?'past':''].join(' ');
    let st='';
    if(done)st+=`<span class="pill ok">Concluído</span>`;else if(isT)st+=`<span class="pill neu">hoje</span>`;else if(past&&ids.length)st+=`<span class="pill warn">pendente</span>`;
    if(ids.length){const pr=ids.reduce((a,i)=>a+stat(BY[i]).frac,0)/ids.length;st+=`<span class="data">progresso ${Math.round(pr*100)}%</span><span class="bar ${done?'ok':''}" style="width:150px"><i style="width:${Math.round(pr*100)}%"></i></span>`}
    if(sim)st+=`<a class="btn${isT?' go':''}" href="#simulado">Simulado <span class="ar">→</span></a>`;
    h+=`<li class="${cls}"><span class="w"><small>${WD[d.getDay()]}</small>${pad(d.getDate(),2)}</span><div class="body">
      <b>${exam?'Dia do ENADE':ids.length?ids.length+' '+(ids.length>1?'matérias':'matéria'):'Simulado e revisão'}</b>
      ${ids.length?`<div class="chips">${ids.map(chip).join('')}</div>`:''}
      <span class="sub">${esc(note)}</span>
      ${exam?`<ul class="tips"><li>Leve documento oficial com foto e caneta esferográfica preta de material transparente.</li><li>Confira no Cartão de Informação do Inep o local e o horário de fechamento dos portões.</li><li>A prova tem Formação Geral e Componente Específico, com questões objetivas e discursivas. Leia o texto-base antes das alternativas.</li><li>Em “asserção I PORQUE asserção II”, julgue cada asserção sozinha e só depois a relação entre elas.</li></ul>`:''}
    </div><div class="st">${st}</div></li>`;
  });
  $v().innerHTML=h+'</ol>';
}
// ---------- Trilhas ----------
function vTrilhas(){
  const areas=[...new Set(SUBJ.map(s=>s.area))];
  let h=`<div class="title"><div><div class="crumb">Trilhas · ${SUBJ.length} matérias · ${ALLQ.length} questões</div><h2>Mapa de matérias</h2></div>
  <p class="lead">As disciplinas de computação com créditos da sua matriz, agrupadas pelas áreas do ENADE.</p></div>`;
  let k=0;
  areas.forEach(a=>{
    h+=`<section class="area"><div class="crumb">${esc(a[0].toUpperCase()+a.slice(1))}</div><div class="cards">`;
    SUBJ.filter(s=>s.area===a).forEach(s=>{k++;const t=stat(s);
      h+=`<a class="card ${t.done?'clear':t.frac>0?'half':''}" href="#m-${s.id}"><span class="w">${pad(k,2)}</span><span class="in"><b>${esc(s.nome)}</b><span class="meta">${typeof s.per==='number'?s.per+'º período':'Eletiva'} · ${s.trilha.length} passos · ${s.q.length} questões</span><span class="bar ${t.done?'ok':''}"><i style="width:${Math.round(t.frac*100)}%"></i></span></span></a>`});
    h+='</div></section>';
  });
  $v().innerHTML=h;
}
// ---------- Matéria ----------
let QZ=null;
function wrapTables(html){return html.replace(/<table class="mini">/g,'<div class="tw"><table class="mini">').replace(/<\/table>/g,'</table></div>')}
function vMateria(id){
  const s=BY[id];if(!s){location.hash='#trilhas';return}
  const t=stat(s),lv={1:0,2:0,3:0};s.q.forEach(q=>lv[q.n]++);
  const fu=s.trilha.findIndex((_,i)=>!ST.read[s.id+':'+i]);
  const nodes=s.trilha.map(([tt],i)=>`<li class="${ST.read[s.id+':'+i]?'done':''} ${i===fu?'next':''}"><a href="#m-${s.id}" data-jump="L${i}"><span class="node"><span>${i+1}</span></span><b>${esc(tt)}</b></a></li>`).join('')
   +`<li class="enade ${fu<0?'done':''}"><a href="#m-${s.id}" data-jump="enade"><span class="node"><span>!</span></span><b>O que cai</b></a></li><li class="${t.tried===t.n?'done':''}"><a href="#m-${s.id}" data-jump="quiz"><span class="node"><span>?</span></span><b>Quiz</b></a></li>`;
  let h=`<div class="title"><div><div class="crumb"><a href="#trilhas">Trilhas</a> · ${esc(s.area)} · ${typeof s.per==='number'?s.per+'º período':'eletiva'} · ${s.cr} créditos</div><h2>${esc(s.nome)}</h2></div>
   <span class="data muted">${t.read}/${t.steps} passos · ${t.right}/${t.n} acertos</span></div>
  <div class="map" style="--n:${s.trilha.length+2}"><ol>${nodes}</ol></div>
  <div class="split"><div style="display:flex;flex-direction:column;gap:14px;min-width:0">
  ${s.trilha.map(([tt,c],i)=>{const k=s.id+':'+i,on=!!ST.read[k];return `<section class="panel lesson ${on?'read':''}" id="L${i}"><div class="hd"><span class="n">${i+1}</span><h3>${tt}</h3></div><div class="txt">${wrapTables(c)}</div><label class="chk"><input type="checkbox" id="rd-${s.id}-${i}" data-k="${k}" ${on?'checked':''}> Entendi este passo</label></section>`}).join('')}
  <section class="panel hot" id="enade"><p class="ph">O que mais cai no ENADE</p><p class="summary">${s.foco}</p><div class="fb3">${(s.enade||[]).map(([tt,c],i)=>`<div><span class="n">${i+1}</span><div><h4>${tt}</h4><div class="txt">${c}</div></div></div>`).join('')}</div></section>
  <section class="panel" id="quiz"><p class="ph">Quiz · ${s.q.length} questões</p><p class="muted">${lv[1]} fáceis, ${lv[2]} médias e ${lv[3]} difíceis, no estilo do ENADE. Depois de responder, você vê o passo a passo para chegar à resposta.</p>
   <div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="Dificuldade"><button data-l="0" aria-pressed="true">Todas</button><button data-l="1" aria-pressed="false">Fácil</button><button data-l="2" aria-pressed="false">Médio</button><button data-l="3" aria-pressed="false">Difícil</button></div>
   <button class="btn go" id="go">Começar quiz <span class="ar">→</span></button></div><div id="qz" style="display:flex;flex-direction:column;gap:16px"></div></section>
  </div>
  <aside class="side"><div class="panel"><p class="ph">Seu progresso</p><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><span class="big-score">${pad(t.right*10,4)}</span><span class="muted">pontos</span></div><span class="muted" style="font-size:15px">${t.read} de ${t.steps} passos lidos · ${t.tried} de ${t.n} questões feitas</span><span class="bar ${t.done?'ok':''}"><i style="width:${Math.round(t.frac*100)}%"></i></span></div>
   <div class="panel"><p class="ph">Navegar</p>${navAround(id)}</div></aside></div>`;
  $v().innerHTML=h;
  let L=0;
  $v().querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{L=+b.dataset.l;$v().querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $v().querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
  $v().querySelectorAll('.chk input').forEach(c=>c.onchange=()=>{if(c.checked)ST.read[c.dataset.k]=true;else delete ST.read[c.dataset.k];save();c.closest('.lesson').classList.toggle('read',c.checked);hud();refreshMap(s)});
  document.getElementById('go').onclick=()=>{const qs=s.q.filter(q=>!L||q.n===L).sort((a,b)=>a.n-b.n);startQuiz(qs,document.getElementById('qz'),'Quiz de '+s.nome)};
}
function refreshMap(s){const lis=$v().querySelectorAll('.map li');const fu=s.trilha.findIndex((_,i)=>!ST.read[s.id+':'+i]);
  s.trilha.forEach((_,i)=>{lis[i].classList.toggle('done',!!ST.read[s.id+':'+i]);lis[i].classList.toggle('next',i===fu)});lis[s.trilha.length].classList.toggle('done',fu<0)}
function navAround(id){
  const day=PLAN.find(p=>p[1].includes(id));const i=SUBJ.findIndex(s=>s.id===id);const prev=SUBJ[i-1],next=SUBJ[i+1];
  let h='';if(day){const d=new Date(day[0]+'T12:00');h+=`<span class="muted" style="font-size:15px">No cronograma: ${WD[d.getDay()]}, ${d.getDate()}/11</span>`}
  h+=`<div style="display:flex;flex-direction:column;gap:8px">${next?`<a class="btn go" style="white-space:normal;text-align:center" href="#m-${next.id}">Próxima: ${esc(next.nome)}</a>`:''}${prev?`<a class="btn" style="white-space:normal;text-align:center" href="#m-${prev.id}">Anterior: ${esc(prev.nome)}</a>`:''}</div>`;
  return h;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LV={1:['fácil','neu'],2:['médio','warn'],3:['difícil','bad']};
function startQuiz(qs,el,title){if(!qs.length){el.innerHTML='<div class="empty">Nenhuma questão neste filtro.</div>';return}QZ={qs,i:0,res:[],el,title};renderQ();el.scrollIntoView({behavior:'smooth',block:'start'})}
function renderQ(){
  const z=QZ,q=z.qs[z.i];
  const alts=q.a.map(t=>({t:t.replace(/^\*/,''),ok:t[0]==='*'}));const order=q.fix?alts:shuffle(alts);
  z.el.innerHTML=`<div class="qhead"><span>Questão ${z.i+1} de ${z.qs.length} · ${esc(BY[q.sid].nome)}</span><span class="pill ${LV[q.n][1]}" style="${q.n===3?'':''}">${LV[q.n][0]}</span></div>
  <div class="bar"><i style="width:${Math.round(z.i/z.qs.length*100)}%"></i></div>
  <div class="qtext">${q.q}</div><div class="opts">${order.map((a,k)=>`<button class="opt" data-ok="${a.ok?1:0}"><span class="k">${'ABCDE'[k]}</span><span>${a.t}</span></button>`).join('')}</div><div id="fbk"></div>`;
  z.el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.getAttribute('aria-disabled'))return;
    const ok=b.dataset.ok==='1';let letter='';
    z.el.querySelectorAll('.opt').forEach(x=>{x.setAttribute('aria-disabled','true');if(x.dataset.ok==='1'){x.classList.add('right');letter=x.querySelector('.k').textContent}});
    if(!ok)b.classList.add('wrong');ST.ans[q.id]=ok?1:0;save();hud();z.res.push({q,ok});
    const last=z.i===z.qs.length-1;
    const steps=q.p&&q.p.length?`<div><span class="n">2</span><div><h4>Como chegar à resposta</h4><ol class="txt">${q.p.map(x=>`<li>${x}</li>`).join('')}</ol></div></div>`:'';
    document.getElementById('fbk').innerHTML=`<div class="verdict">
      <div class="res ${ok?'ok':''}"><span class="n">1</span><div><h4>Resultado <span class="pill ${ok?'ok':'bad'}">${ok?'Resposta correta · +10':'Resposta incorreta'}</span></h4><div class="txt"><p>A alternativa certa é a <b>${letter}</b>. ${q.e}</p></div></div></div>
      ${steps}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn go" id="nx">${last?'Ver resultado':'Próxima questão'} <span class="ar">→</span></button></div>`;
    const nx=document.getElementById('nx');nx.onclick=()=>{if(last)renderScore();else{z.i++;renderQ();z.el.scrollIntoView({behavior:'smooth',block:'start'})}};nx.focus({preventScroll:true});
  });
}
function renderScore(){
  const z=QZ,r=z.res.filter(x=>x.ok).length,n=z.res.length,p=Math.round(r/n*100);
  const by={};z.res.forEach(x=>{const k=x.q.sid;by[k]=by[k]||[0,0];by[k][1]++;if(x.ok)by[k][0]++});
  const multi=Object.keys(by).length>1;
  const msg=p>=80?'Ótimo domínio. Siga para a próxima matéria.':p>=60?'Bom resultado. Releia o passo a passo das que errou e refaça amanhã.':'Vale reler a trilha e a seção do que mais cai antes de refazer.';
  z.el.innerHTML=`<div class="crumb">${esc(z.title)}</div><div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap"><span class="big-score ${p>=60?'':'dim'}">${r}/${n}</span><span class="pill ${p>=80?'ok':p>=60?'warn':'bad'}">${p}% de acerto</span></div><p>${msg}</p>
  ${multi?`<div class="tw"><table class="score-tbl"><tbody>${Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[a,b]])=>`<tr><td><a href="#m-${k}">${esc(BY[k].nome)}</a></td><td class="r">${a}/${b}</td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="row"><button class="btn go" id="again">Refazer</button>${r<n?'<a class="btn" href="#erros">Revisar erros</a>':''}</div>`;
  document.getElementById('again').onclick=()=>startQuiz(z.qs,z.el,z.title);
}
// ---------- Simulado ----------
function vSim(){
  $v().innerHTML=`<div class="title"><div><div class="crumb">Simulado · ${ALLQ.length} questões no banco</div><h2>Simulado misto</h2></div>
  <p class="lead">Questões sorteadas de todas as matérias, com cerca de 30% fáceis, 40% médias e 30% difíceis. No final você vê quais matérias precisam de mais revisão.</p></div>
  <section class="panel hot"><p class="ph">Configurar</p><div class="row"><span>Quantidade:</span><div class="seg" role="group" aria-label="Tamanho"><button data-n="10" aria-pressed="false">10</button><button data-n="20" aria-pressed="true">20</button><button data-n="30" aria-pressed="false">30</button><button data-n="40" aria-pressed="false">40</button></div></div>
  <label class="chk"><input type="checkbox" id="noel"> Sem as eletivas</label><div><button class="btn go" id="go">Sortear simulado <span class="ar">→</span></button></div></section>
  <section class="panel" id="qzp" hidden><div id="qz" style="display:flex;flex-direction:column;gap:16px"></div></section>`;
  let N=20;$v().querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{N=+b.dataset.n;$v().querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  document.getElementById('go').onclick=()=>{
    const pool=ALLQ.filter(q=>!(document.getElementById('noel').checked&&BY[q.sid].el));
    const want={1:Math.round(N*.3),3:Math.round(N*.3)};want[2]=N-want[1]-want[3];
    let pick=[];[1,2,3].forEach(l=>{pick=pick.concat(shuffle(pool.filter(q=>q.n===l)).slice(0,want[l]))});
    document.getElementById('qzp').hidden=false;startQuiz(shuffle(pick),document.getElementById('qz'),'Simulado de '+N+' questões');
  };
}
// ---------- Erros ----------
function vErros(){
  const wr=ALLQ.filter(q=>ST.ans[q.id]===0);
  let h=`<div class="title"><div><div class="crumb">Revisão</div><h2>Meus erros</h2></div><p class="lead">Questões cuja última resposta foi errada. Quando você acerta, ela sai desta lista.</p></div>`;
  if(!wr.length){$v().innerHTML=h+`<div class="empty">Nenhum erro registrado por enquanto. As questões que você errar nos quizzes e simulados aparecem aqui.</div>`;return}
  const by={};wr.forEach(q=>(by[q.sid]=by[q.sid]||[]).push(q));
  h+=`<section class="panel hot"><p class="ph">${wr.length} ${wr.length>1?'questões':'questão'} para revisar</p><div class="chips">${Object.keys(by).map(k=>`<a class="chip" href="#m-${k}"><span class="d"></span>${esc(BY[k].nome)} <span class="pill bad">${by[k].length}</span></a>`).join('')}</div><div><button class="btn go" id="go">Refazer agora <span class="ar">→</span></button></div></section><section class="panel" id="qzp" hidden><div id="qz" style="display:flex;flex-direction:column;gap:16px"></div></section>`;
  $v().innerHTML=h;document.getElementById('go').onclick=()=>{document.getElementById('qzp').hidden=false;startQuiz(shuffle(wr),document.getElementById('qz'),'Revisão de erros')};
}
function route(){
  const h=(location.hash||'#cronograma').slice(1);const v=h.startsWith('m-')?'trilhas':h;
  document.querySelectorAll('.hud nav a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  QZ=null;
  if(h.startsWith('m-'))vMateria(h.slice(2));else if(h==='trilhas')vTrilhas();else if(h==='simulado')vSim();else if(h==='erros')vErros();else vCron();
  hud();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
</script>
</body></html>
