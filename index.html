<p>Na prática, para problemas NP-difíceis usamos: algoritmos de aproximação, heurísticas e meta-heurísticas (algoritmos genéticos, busca tabu), restrição a casos especiais, algoritmos exponenciais para entradas pequenas. Atenção: a mochila tem algoritmo <b>pseudopolinomial</b> O(nW) por programação dinâmica, o que não contradiz a NP-completude (W pode ser exponencial no tamanho da entrada).</p>`]],
e:[
['Problema da parada e decidibilidade',`<p>Assertivas sobre o problema da parada, Rice e a diferença entre decidível e reconhecível. Às vezes no formato asserção-razão.</p>`],
['Direção das reduções',`<p>A questão mais clássica do tema: “para provar que X é NP-completo, deve-se…”. Lembre: X ∈ NP e um NP-completo conhecido ≤<sub>p</sub> X.</p><div class="pega">Pegadinha: “reduzir X a SAT prova que X é NP-difícil” (falso).</div>`],
['Classificar problemas',`<p>Dar uma lista de problemas e pedir quais estão em P e quais são NP-completos. Decore os clássicos de cada lado (caminho mínimo e AGM em P; caixeiro e hamiltoniano NP-completos; euleriano em P).</p>`],
['Consequências de P = NP',`<p>Implicações de achar um algoritmo polinomial para um NP-completo, e impacto em criptografia.</p>`]]});

X('comp',{t:[
['Visão geral do compilador',`<p>Um compilador traduz um programa da linguagem fonte para a linguagem alvo, informando erros. Divide-se em:</p>
<ul><li><b>Front-end</b> (análise, depende da linguagem fonte): léxica → sintática → semântica → código intermediário.</li><li><b>Back-end</b> (síntese, depende da máquina alvo): otimização → geração de código.</li></ul>
<p>A <b>tabela de símbolos</b> é compartilhada por todas as fases (nomes, tipos, escopos, endereços). Separar front-end e back-end com uma representação intermediária permite combinar n linguagens com m máquinas usando n + m componentes (ideia do LLVM e do GCC).</p>`],
['Análise léxica',`<p>Lê caracteres e agrupa em <b>tokens</b> (classe + lexema): <code>x = y + 10;</code> → id(x), atrib, id(y), mais, num(10), pontoevírgula. Remove espaços e comentários.</p>
<p>Os padrões dos tokens são <b>expressões regulares</b>, implementadas como <b>autômatos finitos</b> (Lex/Flex geram o analisador). Regras: <b>casamento mais longo</b> (“&lt;=” é um token só) e prioridade das palavras reservadas sobre identificadores.</p>
<p>Erros léxicos: caractere inválido, número malformado (“12a3” em algumas linguagens), string não fechada.</p>`],
['Análise sintática',`<p>Verifica se a sequência de tokens segue a gramática (livre de contexto) e constrói a árvore sintática.</p>
<p><b>Descendente (top-down)</b>: começa do símbolo inicial e tenta derivar a entrada. Recursivo descendente ou preditivo <b>LL(1)</b> (lê da esquerda, derivação mais à esquerda, 1 símbolo de lookahead). Exige gramática:</p>
<ul><li>sem <b>recursão à esquerda</b>: A → Aα | β vira A → βA′ e A′ → αA′ | ε</li><li><b>fatorada à esquerda</b>: A → αβ<sub>1</sub> | αβ<sub>2</sub> vira A → αA′ e A′ → β<sub>1</sub> | β<sub>2</sub></li><li>sem ambiguidade</li></ul>
<p><b>FIRST(α)</b>: terminais que podem iniciar cadeias derivadas de α (inclui ε se α pode ser vazio). <b>FOLLOW(A)</b>: terminais que podem aparecer logo depois de A (inclui $ para o símbolo inicial). Constroem a tabela LL(1).</p>
<p><b>Ascendente (bottom-up)</b>: parte da entrada e “reduz” até o símbolo inicial, com ações <b>shift</b> (empilha) e <b>reduce</b> (troca o lado direito de uma regra pelo esquerdo). Família LR: LR(0) &lt; SLR &lt; LALR &lt; LR(1) canônico em poder. LALR é o usado por Yacc/Bison. Analisadores LR aceitam recursão à esquerda e uma classe maior de gramáticas que LL. Conflitos shift-reduce e reduce-reduce indicam gramática inadequada (ou ambígua).</p>`],
['Análise semântica',`<p>Verifica o que a gramática livre de contexto não consegue: <b>declaração antes do uso</b>, <b>compatibilidade de tipos</b>, número e tipo de argumentos em chamadas, unicidade de declarações no escopo, break fora de laço. Usa a tabela de símbolos e <b>gramáticas de atributos</b> (atributos sintetizados sobem na árvore; herdados descem).</p>
<p>Também faz conversões implícitas (coerção de int para float). Erros semânticos: variável não declarada, “int x = \"texto\"”, chamar função com argumentos a menos.</p>`],
['Código intermediário e otimização',`<p>Representações: árvore sintática abstrata, <b>código de três endereços</b> (x = y op z), quádruplas, SSA, bytecode.</p>
<pre>a = b * c + b * c   →   t1 = b * c
                         t2 = t1 + t1      (subexpressão comum)
                         a  = t2</pre>
<p>Otimizações clássicas:</p><ul><li><b>Dobramento de constantes</b>: 2 * 3 vira 6 em compilação. <b>Propagação</b> de constantes e cópias.</li><li><b>Eliminação de subexpressões comuns</b> e de <b>código morto</b> (resultados nunca usados, código inalcançável).</li><li>Otimizações de laço: <b>movimentação de código invariante</b>, redução de força (multiplicação por soma), desenrolamento (loop unrolling).</li><li>Otimizações de máquina: alocação de registradores (coloração de grafos), escalonamento de instruções, peephole.</li></ul>
<p>Otimizações precisam preservar a semântica do programa.</p>`],
['Geração de código e ambiente de execução',`<p>Seleciona instruções da máquina alvo, aloca registradores e organiza a memória: área de código, dados estáticos, <b>pilha</b> (registros de ativação com parâmetros, variáveis locais, endereço de retorno, vínculo de controle) e <b>heap</b>.</p>
<p>Ferramentas: <b>montador</b> (assembly → objeto), <b>ligador</b> (junta objetos e bibliotecas; ligação estática ou dinâmica), <b>carregador</b>. Compiladores JIT compilam em tempo de execução usando informações do perfil de uso.</p>`]],
e:[
['Classificar erros por fase',`<p>Aparece em quase todo ENADE: dado um trecho com erro, dizer se é léxico, sintático ou semântico.</p><div class="pega">Pegadinha: variável não declarada é semântico, não sintático. Falta de ponto e vírgula é sintático.</div>`],
['Transformar gramáticas para LL(1)',`<p>Eliminar recursão à esquerda, fatorar, calcular FIRST e FOLLOW.</p>`],
['Reconhecer otimizações',`<p>Mostram código antes e depois e pedem o nome da otimização aplicada.</p>`],
['Relação com Linguagens Formais',`<p>Léxico ↔ expressões regulares e autômatos finitos; sintático ↔ GLC e autômatos com pilha.</p>`],
['LL × LR',`<p>Assertivas comparando poder, recursão à esquerda e ferramentas.</p>`]]});

X('ia',{t:[
['Agentes inteligentes',`<p>Um <b>agente</b> percebe o ambiente por sensores e age por atuadores, buscando maximizar uma medida de desempenho (agente racional). Tipos: reativo simples, reativo baseado em modelo, baseado em objetivos, baseado em utilidade, com aprendizado.</p>
<p>Ambientes podem ser: totalmente ou parcialmente observáveis, determinísticos ou estocásticos, episódicos ou sequenciais, estáticos ou dinâmicos, discretos ou contínuos, com um ou vários agentes. Xadrez: totalmente observável, determinístico, sequencial, discreto, multiagente. Carro autônomo: parcialmente observável, estocástico, dinâmico, contínuo.</p>`],
['Busca não informada',`<p>Problema = estado inicial, ações, modelo de transição, teste de objetivo, custo de caminho. Com fator de ramificação b, profundidade da solução d e profundidade máxima m:</p>
<table class="mini"><tr><th>Busca</th><th>Completa?</th><th>Ótima?</th><th>Tempo</th><th>Memória</th></tr><tr><td>Largura (BFS)</td><td>sim</td><td>sim, com custos iguais</td><td>O(b<sup>d</sup>)</td><td>O(b<sup>d</sup>)</td></tr><tr><td>Custo uniforme</td><td>sim</td><td>sim</td><td>≈ O(b<sup>d</sup>)</td><td>≈ O(b<sup>d</sup>)</td></tr><tr><td>Profundidade (DFS)</td><td>não (laços/infinita)</td><td>não</td><td>O(b<sup>m</sup>)</td><td>O(bm)</td></tr><tr><td>Aprofundamento iterativo</td><td>sim</td><td>sim, com custos iguais</td><td>O(b<sup>d</sup>)</td><td>O(bd)</td></tr></table>
<p>O aprofundamento iterativo combina a memória pequena da DFS com a completude da BFS.</p>`],
['Busca informada e heurísticas',`<p>Uma <b>heurística</b> h(n) estima o custo de n até o objetivo.</p>
<ul><li><b>Gulosa</b>: expande o menor h(n). Rápida, mas não ótima nem completa em geral.</li><li><b>A*</b>: expande o menor f(n) = g(n) + h(n). Ótima se h for <b>admissível</b> (nunca superestima o custo real) em busca em árvore, e <b>consistente</b> (h(n) ≤ c(n,n′) + h(n′)) em busca em grafo. Toda consistente é admissível.</li></ul>
<p>Exemplos admissíveis: distância em linha reta em mapas; no quebra-cabeça de 8 peças, número de peças fora do lugar e soma das distâncias de Manhattan (esta domina a primeira, logo é melhor). h = 0 transforma A* em custo uniforme.</p>
<p><b>Busca local</b> (não guarda caminho): subida de encosta (hill climbing, fica presa em máximos locais), têmpera simulada (simulated annealing, aceita pioras com probabilidade decrescente), algoritmos genéticos.</p>`],
['Jogos e busca adversarial',`<p><b>Minimax</b>: MAX escolhe o maior valor, MIN o menor, propagando da folha à raiz. Ótimo contra adversário ótimo. Complexidade O(b<sup>m</sup>).</p>
<p><b>Poda alfa-beta</b>: α = melhor valor garantido para MAX, β = melhor para MIN; poda quando α ≥ β. Mesmo resultado do minimax, explorando menos nós (até O(b<sup>m/2</sup>) com ordenação ideal). Na prática, corta-se em uma profundidade e usa-se uma <b>função de avaliação</b>. Jogos com sorte usam expectiminimax; Go usa busca Monte Carlo em árvore.</p>`],
['Conhecimento e raciocínio',`<p><b>Lógica proposicional e de primeira ordem</b> representam conhecimento. Inferência por <b>modus ponens</b>, <b>resolução</b> (base do Prolog), <b>encadeamento para frente</b> (dos fatos às conclusões, dirigido por dados) e <b>para trás</b> (da meta aos fatos, dirigido por objetivos).</p>
<p><b>Sistemas especialistas</b>: base de conhecimento (regras SE-ENTÃO) + motor de inferência + interface de explicação. Outras representações: redes semânticas, frames, ontologias.</p>
<p><b>Problemas de satisfação de restrições</b> (CSP): variáveis, domínios e restrições (sudoku, coloração de mapas); resolvidos com backtracking e heurísticas como MRV (variável mais restrita primeiro).</p>`],
['Raciocínio com incerteza',`<p>Probabilidade condicional P(A|B) = P(A∩B)/P(B). <b>Teorema de Bayes</b>:</p>
<div class="ex">P(H|E) = P(E|H) · P(H) / P(E), com P(E) = P(E|H)P(H) + P(E|¬H)P(¬H)</div>
<p>Muito cobrado com testes médicos e filtros de spam: quando a doença é rara, mesmo um bom teste gera muitos falsos positivos. <b>Redes bayesianas</b> representam dependências como grafo dirigido acíclico com tabelas de probabilidade condicional. <b>Lógica fuzzy</b>: graus de pertinência entre 0 e 1 (“temperatura alta” com grau 0,7), usada em controle.</p>`]],
e:[
['A* e heurísticas admissíveis',`<p>Executar A* em um grafo pequeno, dizer se uma heurística é admissível, ou comparar A* com gulosa e custo uniforme.</p><div class="pega">Pegadinha: dizer que A* é ótimo com qualquer heurística.</div>`],
['Comparação de buscas',`<p>Completude, otimalidade, tempo e memória de BFS, DFS e aprofundamento iterativo.</p>`],
['Minimax e alfa-beta',`<p>Calcular o valor da raiz de uma árvore de jogo ou identificar quais ramos são podados.</p>`],
['Teorema de Bayes',`<p>Problema numérico com teste diagnóstico ou classificador. Monte a árvore de probabilidades.</p>`],
['Classificar agentes e ambientes',`<p>Dado um cenário, dizer as propriedades do ambiente ou o tipo de agente.</p>`]]});

X('ia2',{t:[
['Tipos de aprendizado',`<ul><li><b>Supervisionado</b>: dados com rótulo. <b>Classificação</b> (rótulo discreto: spam ou não) e <b>regressão</b> (valor contínuo: preço de casa).</li><li><b>Não supervisionado</b>: sem rótulo. <b>Agrupamento</b> (k-means, hierárquico, DBSCAN), <b>redução de dimensionalidade</b> (PCA), regras de associação (Apriori: quem compra pão compra leite).</li><li><b>Por reforço</b>: o agente age, recebe recompensas e aprende uma política (Q-learning). Jogos, robótica.</li><li><b>Semi e autossupervisionado</b>: poucos rótulos ou rótulos gerados a partir dos próprios dados (base dos grandes modelos de linguagem).</li></ul>`],
['Algoritmos clássicos',`<ul><li><b>k-NN</b>: classifica pela maioria dos k vizinhos mais próximos. Sem treino (lazy); sensível à escala dos atributos (normalize) e a k.</li><li><b>Árvores de decisão</b>: dividem pelo atributo de maior <b>ganho de informação</b> (redução da entropia) ou menor índice Gini. Interpretáveis; tendem a overfitting sem poda.</li><li><b>Random forest</b>: muitas árvores com amostras e atributos aleatórios (bagging); reduz variância.</li><li><b>Naive Bayes</b>: aplica Bayes supondo atributos independentes dada a classe. Simples e bom para texto.</li><li><b>Regressão linear</b> (mínimos quadrados) e <b>logística</b> (classificação com função sigmoide).</li><li><b>SVM</b>: hiperplano de margem máxima; o truque de kernel separa dados não lineares.</li><li><b>k-means</b>: escolhe k centróides, atribui cada ponto ao mais próximo, recalcula os centróides e repete. Precisa definir k (método do cotovelo).</li></ul>
<p>Entropia: H = −Σ p<sub>i</sub> log<sub>2</sub> p<sub>i</sub>. Um conjunto 50/50 tem entropia 1; um conjunto puro, 0.</p>`],
['Avaliação de modelos',`<p>Separe <b>treino</b>, <b>validação</b> (ajustar hiperparâmetros) e <b>teste</b> (avaliação final, só uma vez). <b>Validação cruzada k-fold</b> usa todos os dados para treino e teste em rodízio.</p>
<table class="mini"><tr><th></th><th>Previsto positivo</th><th>Previsto negativo</th></tr><tr><td>Real positivo</td><td>VP</td><td>FN</td></tr><tr><td>Real negativo</td><td>FP</td><td>VN</td></tr></table>
<ul><li><b>Acurácia</b> = (VP+VN)/total. Enganosa com classes desbalanceadas (99% de acurácia dizendo sempre “não fraude”).</li><li><b>Precisão</b> = VP/(VP+FP): dos que marquei como positivos, quantos eram? Importa quando FP custa caro (spam bloqueando e-mail legítimo).</li><li><b>Revocação/sensibilidade</b> = VP/(VP+FN): dos positivos reais, quantos achei? Importa quando FN custa caro (doença não detectada).</li><li><b>F1</b> = média harmônica de precisão e revocação. <b>Curva ROC/AUC</b> para vários limiares.</li></ul>`],
['Overfitting e viés-variância',`<p><b>Overfitting</b> (sobreajuste): o modelo decora o treino, incluindo ruído; erro baixo no treino e alto no teste. Alta <b>variância</b>. Soluções: mais dados, regularização (L1/L2), modelo mais simples, poda, dropout, early stopping, data augmentation.</p>
<p><b>Underfitting</b>: modelo simples demais; erro alto no treino e no teste. Alto <b>viés</b>. Solução: modelo mais complexo, mais atributos, treinar mais.</p>
<p>Outros cuidados: <b>vazamento de dados</b> (informação do teste no treino), dados desbalanceados, vieses nos dados que geram discriminação.</p>`],
['Redes neurais e aprendizado profundo',`<p><b>Perceptron</b>: soma ponderada das entradas mais bias, passando por função degrau. Aprende só problemas <b>linearmente separáveis</b> (AND, OR), não o XOR.</p>
<p><b>Perceptron multicamadas (MLP)</b>: camadas ocultas com ativações não lineares (sigmoide, tanh, <b>ReLU</b>). Treinado por <b>retropropagação</b> (backpropagation: regra da cadeia para calcular gradientes) e <b>gradiente descendente</b> (taxa de aprendizado alta demais diverge; baixa demais é lenta). Com uma camada oculta suficientemente grande, aproxima qualquer função contínua.</p>
<p>Arquiteturas: <b>CNN</b> (convoluções, imagens), <b>RNN/LSTM</b> (sequências), <b>Transformers</b> (atenção; base de LLMs como GPT e Claude). Função de perda: erro quadrático (regressão), entropia cruzada (classificação). Softmax na saída para várias classes.</p>`],
['Computação evolutiva',`<p><b>Algoritmos genéticos</b>: população de soluções (cromossomos) avaliadas por uma função de <b>aptidão</b>; a cada geração: <b>seleção</b> (roleta, torneio), <b>cruzamento</b> (combina pais) e <b>mutação</b> (pequena alteração aleatória que mantém diversidade). <b>Elitismo</b> preserva os melhores. Úteis em otimização de problemas difíceis (escalonamento, roteamento), sem garantia de ótimo.</p>`]],
e:[
['Tipo de aprendizado para um cenário',`<p>Com rótulo → supervisionado; agrupar sem rótulo → não supervisionado; aprender por tentativa e recompensa → reforço. Também classificação × regressão.</p>`],
['Precisão, revocação e matriz de confusão',`<p>Calcular métricas a partir de uma matriz e escolher a métrica mais importante para o cenário.</p><div class="pega">Pegadinha: confiar em acurácia com classes desbalanceadas.</div>`],
['Overfitting',`<p>Diagnosticar pela diferença entre treino e teste e escolher a correção.</p>`],
['Perceptron e XOR',`<p>Asserção-razão clássica sobre separabilidade linear.</p>`],
['Algoritmos específicos',`<p>Passos do k-means, cálculo de entropia/ganho de informação, operadores genéticos.</p>`]]});

X('simul',{t:[
['Modelagem e simulação',`<p>Simular é imitar o funcionamento de um sistema real ao longo do tempo com um modelo, para analisar cenários sem mexer no sistema: dimensionar caixas de supermercado, leitos de hospital, tráfego, linhas de produção.</p>
<p>Classificações: estática × dinâmica; determinística × estocástica; <b>contínua</b> (estado muda continuamente, equações diferenciais) × <b>discreta</b> (estado muda em instantes específicos, como chegadas e saídas).</p>
<p>Elementos: <b>entidades</b> (clientes), <b>atributos</b>, <b>recursos</b> (atendentes), <b>filas</b>, <b>eventos</b> (chegada, fim de atendimento), <b>relógio de simulação</b> e <b>lista de eventos futuros</b>. O relógio salta de um evento para o próximo.</p>`],
['Números e variáveis aleatórias',`<p>Simulações usam números <b>pseudoaleatórios</b>, gerados por algoritmos determinísticos a partir de uma semente (útil para reproduzir resultados). Gerador congruencial linear: X<sub>n+1</sub> = (a·X<sub>n</sub> + c) mod m; período máximo m.</p>
<p>Para gerar outras distribuições a partir de U ~ Uniforme(0,1): <b>transformada inversa</b>. Para a exponencial com taxa λ: X = −ln(U)/λ.</p>
<table class="mini"><tr><th>Distribuição</th><th>Uso típico</th></tr><tr><td>Exponencial</td><td>tempo entre chegadas; sem memória</td></tr><tr><td>Poisson</td><td>número de chegadas em um intervalo</td></tr><tr><td>Normal</td><td>erros de medição, somas de muitos efeitos</td></tr><tr><td>Uniforme</td><td>quando só se sabem os limites</td></tr><tr><td>Triangular</td><td>estimativa com mínimo, moda e máximo</td></tr></table>`],
['Teoria de filas',`<p><b>Notação de Kendall</b> A/B/c/K: distribuição das chegadas / do atendimento / número de servidores / capacidade. M = markoviano (exponencial/Poisson), D = determinístico, G = geral.</p>
<p>Para a fila <b>M/M/1</b> com taxa de chegada λ e de atendimento μ:</p>
<ul><li>Utilização ρ = λ/μ (precisa ser &lt; 1, senão a fila cresce sem limite)</li><li>Número médio no sistema L = ρ/(1−ρ)</li><li>Tempo médio no sistema W = 1/(μ−λ)</li><li>Na fila: L<sub>q</sub> = ρ²/(1−ρ), W<sub>q</sub> = ρ/(μ−λ)</li></ul>
<p><b>Lei de Little</b> (vale para qualquer sistema estável): <b>L = λ·W</b> e L<sub>q</sub> = λ·W<sub>q</sub>.</p>
<div class="ex">λ = 4/h, μ = 5/h: ρ = 0,8; L = 4 clientes; W = 1 h. Com ρ perto de 1 o tempo explode: λ = 4,8 dá W = 5 h.</div>`],
['Executando um estudo de simulação',`<p>Etapas: formular o problema, coletar dados e ajustar distribuições, construir o modelo, <b>verificar</b> (o programa faz o que o modelo diz?), <b>validar</b> (o modelo representa o sistema real?), planejar experimentos, executar e analisar.</p>
<p>Cuidados estatísticos: descartar o período de <b>aquecimento</b> (warm-up) em simulações de regime permanente; fazer várias <b>replicações</b> independentes e reportar <b>intervalos de confiança</b>, não um único número. Ferramentas: Arena, AnyLogic, SimPy.</p>`]],
e:[
['Fila M/M/1 e Lei de Little',`<p>Cálculos diretos de utilização, tamanho médio e tempo médio. Cuidado com unidades (clientes/hora × minutos).</p>`],
['Distribuições',`<p>Associar fenômeno à distribuição (exponencial × Poisson) e gerar valores por transformada inversa.</p>`],
['Verificação × validação',`<p>Assertivas sobre etapas, aquecimento e replicações.</p>`]]});

X('cg',{t:[
['Imagem raster e vetorial',`<p><b>Raster</b> (matricial): grade de pixels; perde qualidade ao ampliar (PNG, JPEG). <b>Vetorial</b>: primitivas geométricas descritas matematicamente; escala sem perda (SVG, fontes). A tela é raster, então tudo precisa ser <b>rasterizado</b> no fim.</p>
<p>Sistemas de coordenadas: do objeto (modelo) → do mundo → da câmera (visualização) → de recorte → normalizadas → da tela (viewport).</p>`],
['Transformações geométricas',`<p>Em 2D com <b>coordenadas homogêneas</b> (x, y, 1), toda transformação afim vira uma matriz 3×3:</p>
<pre>Translação        Escala            Rotação (θ, anti-horária)
[1 0 tx]          [sx 0  0]         [cosθ −senθ 0]
[0 1 ty]          [0  sy 0]         [senθ  cosθ 0]
[0 0 1 ]          [0  0  1]         [ 0     0   1]</pre>
<p><b>Composição</b>: multiplicam-se as matrizes; com vetores-coluna, a transformação aplicada primeiro fica mais à <b>direita</b>: M = T · R · S aplica escala, depois rotação, depois translação. <b>A ordem importa</b>: multiplicação de matrizes não é comutativa.</p>
<p>Rotacionar em torno de um ponto P: transladar P para a origem, rotacionar, transladar de volta: T(P) · R(θ) · T(−P). Em 3D, matrizes 4×4 e rotações em torno de x, y e z. Outras: espelhamento (escala com −1) e cisalhamento.</p>`],
['Visualização e projeção',`<p>A câmera é definida por posição, ponto de interesse e vetor “para cima”. <b>Projeção ortográfica</b>: raios paralelos, preserva medidas (CAD, plantas). <b>Projeção perspectiva</b>: raios convergem para o centro de projeção; objetos distantes ficam menores; a divisão por z (w) acontece após a matriz de projeção. O <b>volume de visualização</b> (frustum) define o que aparece; o resto é <b>recortado</b> (algoritmos de Cohen-Sutherland para retas e Sutherland-Hodgman para polígonos).</p>`],
['Rasterização',`<p>Converte primitivas em pixels. <b>Algoritmo de Bresenham</b> para retas: usa apenas inteiros, somas e um termo de erro para decidir o próximo pixel; mais eficiente que o DDA (que usa ponto flutuante). Também há versão para circunferências (ponto médio).</p>
<p>Preenchimento de polígonos por <b>varredura</b> (scanline) e por <b>flood fill</b>. <b>Aliasing</b> (serrilhado) aparece porque a grade é discreta; <b>antialiasing</b> suaviza com supersampling (MSAA) ou filtragem.</p>`],
['Superfícies visíveis e pipeline',`<p><b>Z-buffer</b>: guarda, para cada pixel, a profundidade do fragmento mais próximo; um novo fragmento só é desenhado se estiver mais perto. Simples, roda em hardware, custa memória. Alternativas: algoritmo do pintor (ordena por profundidade, falha com sobreposição cíclica), <b>back-face culling</b> (descarta faces de costas para a câmera usando a normal).</p>
<p><b>Pipeline gráfico</b> da GPU (OpenGL/Vulkan/DirectX): vértices → <b>vertex shader</b> (transformações) → montagem de primitivas → recorte → rasterização → <b>fragment shader</b> (cor e iluminação) → testes de profundidade e mistura → framebuffer.</p>`],
['Iluminação, cor e textura',`<p><b>Modelo de Phong</b>: I = ambiente + difusa (Lambert, proporcional a N·L) + especular (proporcional a (R·V)<sup>n</sup>, brilho). <b>Sombreamento</b>: flat (uma cor por face, facetado), <b>Gouraud</b> (calcula nos vértices e interpola cores; perde brilhos no meio da face), <b>Phong</b> (interpola normais e calcula por pixel; mais realista e caro).</p>
<p>Modelos de cor: <b>RGB</b> aditivo (telas), <b>CMY/CMYK</b> subtrativo (impressão; C = 1 − R), <b>HSV/HSL</b> (matiz, saturação, valor; intuitivo para pessoas), YCbCr (vídeo, separa luminância).</p>
<p><b>Texturas</b>: mapeamento de imagens em superfícies por coordenadas (u, v); mipmapping evita aliasing a distância. <b>Ray tracing</b> traça raios a partir do olho e simula reflexão, refração e sombras com realismo, a custo maior.</p>`]],
e:[
['Transformações e composição',`<p>Calcular o resultado de transformar um ponto, ou escolher a matriz/ordem correta para uma composição.</p><div class="pega">Pegadinha: aplicar as transformações na ordem em que as matrizes aparecem escritas, e não da direita para a esquerda.</div>`],
['Coordenadas homogêneas',`<p>Por que usar: representar translação (e projeção perspectiva) como multiplicação de matrizes.</p>`],
['Pipeline, z-buffer e sombreamento',`<p>Ordem das etapas, função do z-buffer e diferenças entre Gouraud e Phong.</p>`],
['Modelos de cor e rasterização',`<p>RGB × CMYK, conversão simples, Bresenham.</p>`]]});

X('pi',{t:[
['Imagem digital',`<p>Uma imagem digital é uma função f(x, y) amostrada (resolução espacial) e quantizada (níveis de intensidade). Com k bits por pixel há 2<sup>k</sup> níveis: 8 bits → 256 tons de cinza. Imagem colorida RGB usa geralmente 3 × 8 = 24 bits por pixel.</p>
<div class="ex">Tamanho sem compressão = largura × altura × bits por pixel / 8. Uma foto Full HD (1920×1080) RGB de 24 bits ocupa ≈ 6,2 MB.</div>
<p>Vizinhança: <b>4-vizinhança</b> (cima, baixo, esquerda, direita) e <b>8-vizinhança</b> (inclui diagonais); importa para conectividade e rotulação de regiões.</p>
<p>Compressão: <b>sem perdas</b> (PNG, GIF; RLE, Huffman, LZW) e <b>com perdas</b> (JPEG, baseado na DCT e na quantização das altas frequências).</p>`],
['Histograma e operações pontuais',`<p>O <b>histograma</b> conta quantos pixels há em cada nível. Imagem escura: concentrado à esquerda; baixo contraste: concentrado em faixa estreita.</p>
<ul><li><b>Negativo</b>: s = (L − 1) − r.</li><li><b>Alargamento de contraste</b>: estica a faixa usada para ocupar 0–255.</li><li><b>Equalização de histograma</b>: usa a distribuição acumulada para espalhar os níveis e melhorar o contraste automaticamente.</li><li><b>Transformações log e gama</b>: realçam regiões escuras ou claras.</li><li><b>Limiarização</b> (binarização): pixel ≥ T vira 1, senão 0. O <b>método de Otsu</b> escolhe T maximizando a variância entre classes.</li></ul>`],
['Filtragem espacial',`<p>Uma <b>máscara</b> (kernel) desliza sobre a imagem e cada pixel de saída é uma combinação dos vizinhos (<b>convolução</b>/correlação).</p>
<table class="mini"><tr><th>Filtro</th><th>Tipo</th><th>Efeito</th></tr><tr><td>Média</td><td>passa-baixa, linear</td><td>suaviza e reduz ruído gaussiano; borra bordas</td></tr><tr><td>Gaussiano</td><td>passa-baixa, linear</td><td>suavização mais natural</td></tr><tr><td><b>Mediana</b></td><td>não linear (estatística de ordem)</td><td>remove ruído <b>sal e pimenta</b> preservando bordas</td></tr><tr><td>Sobel, Prewitt</td><td>passa-alta (1ª derivada)</td><td>detecta bordas com direção</td></tr><tr><td>Laplaciano</td><td>passa-alta (2ª derivada)</td><td>realça detalhes; sensível a ruído</td></tr><tr><td>Canny</td><td>multietapas</td><td>bordas finas e contínuas (suaviza, gradiente, supressão de não máximos, histerese)</td></tr></table>
<pre>Média 3×3        Sobel (vertical)
1/9 [1 1 1]      [-1 0 1]
    [1 1 1]      [-2 0 2]
    [1 1 1]      [-1 0 1]</pre>`],
['Morfologia matemática',`<p>Operações sobre imagens binárias com um <b>elemento estruturante</b>:</p>
<ul><li><b>Erosão</b>: encolhe objetos, remove pontos pequenos, separa objetos ligados por pontes finas.</li><li><b>Dilatação</b>: expande objetos, preenche falhas pequenas, une partes.</li><li><b>Abertura</b> = erosão seguida de dilatação: remove ruídos e saliências pequenas mantendo o tamanho dos objetos maiores.</li><li><b>Fechamento</b> = dilatação seguida de erosão: fecha buracos e fendas pequenas.</li><li>Gradiente morfológico (dilatação − erosão) dá o contorno.</li></ul>`],
['Domínio da frequência e segmentação',`<p>A <b>transformada de Fourier</b> decompõe a imagem em frequências: baixas = regiões suaves; altas = bordas, detalhes e ruído. Filtrar no domínio da frequência = multiplicar; equivale a convoluir no espaço. A FFT torna isso eficiente.</p>
<p><b>Segmentação</b>: separar objetos do fundo. Por limiar, por bordas, por <b>crescimento de regiões</b>, watershed, ou por agrupamento (k-means nas cores). Depois: rotulação de componentes conexos, extração de características (área, perímetro, momentos) e classificação, chegando à visão computacional (hoje dominada por redes neurais convolucionais).</p>`]],
e:[
['Filtro adequado ao problema',`<p>Ruído sal e pimenta → mediana; suavizar ruído gaussiano → média/gaussiano; achar bordas → Sobel/Canny/Laplaciano.</p><div class="pega">Pegadinha: oferecer o filtro da média para sal e pimenta (ele espalha o ruído e borra bordas).</div>`],
['Morfologia',`<p>Efeito de erosão, dilatação, abertura e fechamento sobre uma figura dada.</p>`],
['Histograma e realce',`<p>Interpretar um histograma e saber o que a equalização e a limiarização fazem.</p>`],
['Tamanho e representação de imagens',`<p>Cálculo de memória e número de níveis de cinza.</p>`]]});

X('web',{t:[
['Como a Web funciona',`<p>O navegador (cliente) envia uma requisição HTTP a um servidor identificado por uma <b>URL</b> (protocolo://host:porta/caminho?consulta#fragmento). Antes, o DNS resolve o nome em IP e se estabelece a conexão TCP (e TLS no HTTPS). O servidor responde com status, cabeçalhos e corpo (HTML, JSON, imagens).</p>
<p>Requisição: método, caminho, cabeçalhos (Host, Accept, Cookie, Authorization, Content-Type) e corpo opcional.</p>`],
['HTTP em detalhe',`<table class="mini"><tr><th>Método</th><th>Uso</th><th>Seguro</th><th>Idempotente</th></tr><tr><td>GET</td><td>ler</td><td>sim</td><td>sim</td></tr><tr><td>POST</td><td>criar / ações</td><td>não</td><td>não</td></tr><tr><td>PUT</td><td>substituir</td><td>não</td><td>sim</td></tr><tr><td>PATCH</td><td>alterar parcialmente</td><td>não</td><td>não garantido</td></tr><tr><td>DELETE</td><td>remover</td><td>não</td><td>sim</td></tr></table>
<p><b>Idempotente</b>: repetir a requisição tem o mesmo efeito que fazê-la uma vez. Códigos: <b>200</b> OK, <b>201</b> Created, <b>204</b> No Content, <b>301/302</b> redirecionamento, <b>304</b> Not Modified (cache), <b>400</b> requisição inválida, <b>401</b> não autenticado, <b>403</b> sem permissão, <b>404</b> não encontrado, <b>409</b> conflito, <b>500</b> erro interno, <b>503</b> indisponível.</p>
<p>HTTP é <b>sem estado</b>: o contexto do usuário é mantido por <b>cookies</b> (com ID de sessão guardada no servidor) ou <b>tokens</b> (JWT, enviado no cabeçalho Authorization; o servidor não guarda sessão). Cache controlado por Cache-Control, ETag e Last-Modified.</p>`],
['Front-end: HTML, CSS e JavaScript',`<p><b>HTML</b> define estrutura e significado. Use tags semânticas (header, nav, main, article, button, label) para acessibilidade e SEO. <b>CSS</b> define apresentação: seletores e especificidade (id &gt; classe &gt; elemento), cascata, <b>box model</b> (conteúdo, padding, borda, margem), <b>flexbox</b> (uma dimensão), <b>grid</b> (duas dimensões), <b>media queries</b> para design responsivo (mobile first).</p>
<p><b>JavaScript</b> adiciona comportamento: manipula o <b>DOM</b>, trata eventos (click, submit), faz requisições com <code>fetch</code>. É <b>single-thread</b> com <b>event loop</b>: código síncrono roda primeiro; depois as <b>microtarefas</b> (Promises) e só então as <b>macrotarefas</b> (setTimeout, eventos). <code>async/await</code> é açúcar sintático sobre Promises.</p>
<pre>async function carregar() {
  const r = await fetch('/api/produtos');
  if (!r.ok) throw new Error('Falha: ' + r.status);
  return r.json();
}</pre>
<p>Frameworks (React, Vue, Angular) organizam a interface em componentes com estado. SPA (aplicação de página única) × renderização no servidor (SSR).</p>`],
['Back-end e APIs REST',`<p>O servidor recebe requisições, aplica regras de negócio e acessa dados. Padrão <b>MVC</b>: o Controller recebe a requisição, o Model trata dados e regras, a View gera a resposta.</p>
<p><b>REST</b> (Fielding): recursos identificados por URIs, manipulados por métodos HTTP padrão, representações (JSON), comunicação <b>sem estado</b>, cacheável, interface uniforme, sistema em camadas.</p>
<pre>GET    /alunos          lista
GET    /alunos/42       um aluno
POST   /alunos          cria (201 + Location)
PUT    /alunos/42       substitui
DELETE /alunos/42       remove (204)</pre>
<p>Use substantivos no plural nas URIs, nunca verbos (“/removerAluno”). Alternativas: GraphQL (o cliente escolhe os campos), gRPC, WebSocket (comunicação bidirecional em tempo real).</p>`],
['Segurança e boas práticas',`<p><b>Same-origin policy</b>: scripts de uma origem não leem respostas de outra. <b>CORS</b>: o servidor autoriza origens específicas por cabeçalhos. Sempre <b>valide no servidor</b> (a validação no cliente é só conveniência). Proteja contra XSS (escape de saída, CSP), CSRF (tokens, SameSite), SQL injection (consultas parametrizadas). Use HTTPS, cookies Secure e HttpOnly, senhas com hash.</p>
<p>Desempenho: minificação, compressão, cache, CDN, carregamento preguiçoso de imagens. Acessibilidade: WCAG, texto alternativo, contraste, navegação por teclado.</p>`]],
e:[
['Métodos e códigos HTTP',`<p>Escolher o método e o código corretos para uma operação, ou interpretar uma troca de mensagens.</p><div class="pega">Pegadinha: 401 × 403 (não autenticado × autenticado sem permissão) e PUT × PATCH.</div>`],
['Princípios REST',`<p>Identificar o que viola REST (verbos na URI, GET que altera dados, sessão no servidor).</p>`],
['Event loop do JavaScript',`<p>Ordem de saída com console.log, setTimeout e Promises.</p>`],
['Estado em HTTP',`<p>Cookies × sessões × tokens e o significado de “sem estado”.</p>`],
['Segurança web',`<p>Cruza com Segurança de Sistemas: XSS, CSRF, CORS.</p>`]]});

X('mobile',{t:[
['Plataformas e abordagens',`<p>Android (Kotlin/Java, Android Studio, distribuído pela Play Store) e iOS (Swift/SwiftUI, Xcode, App Store).</p>
<table class="mini"><tr><th>Abordagem</th><th>Vantagens</th><th>Desvantagens</th></tr><tr><td>Nativa</td><td>melhor desempenho, acesso total a APIs e hardware, experiência de cada plataforma</td><td>duas bases de código, mais custo</td></tr><tr><td>Multiplataforma (Flutter, React Native, Kotlin Multiplatform)</td><td>um código, equipe menor, entrega rápida</td><td>dependência do framework, acesso a recursos novos pode atrasar</td></tr><tr><td>Web/PWA</td><td>sem loja, atualização instantânea</td><td>acesso limitado a hardware, offline restrito</td></tr><tr><td>Híbrida (WebView: Ionic, Cordova)</td><td>reaproveita web</td><td>desempenho e aparência inferiores</td></tr></table>`],
['Componentes e ciclo de vida no Android',`<p>Componentes: <b>Activity</b> (uma tela), <b>Fragment</b> (parte reutilizável de tela), <b>Service</b> (tarefa em segundo plano), <b>BroadcastReceiver</b> (eventos do sistema), <b>ContentProvider</b> (compartilhar dados). Comunicação via <b>Intents</b> (explícitas ou implícitas). Tudo declarado no <b>AndroidManifest.xml</b>.</p>
<div class="ex">onCreate → onStart → onResume (visível e interativa) → onPause (perde o foco) → onStop (não visível) → onDestroy. Voltar de onStop passa por onRestart → onStart.</div>
<p>Mudanças de configuração (girar a tela, mudar idioma) <b>destroem e recriam</b> a Activity. Para não perder dados, use <b>ViewModel</b> (sobrevive à recriação) e onSaveInstanceState. No iOS, o equivalente é o ciclo do ViewController (viewDidLoad, viewWillAppear…).</p>`],
['Restrições e boas práticas',`<p>Dispositivos têm bateria, memória e CPU limitadas, rede instável e telas muito diferentes.</p>
<ul><li>A <b>thread principal</b> (UI) só deve desenhar e responder ao usuário. Rede, banco e arquivos vão para segundo plano (corrotinas, WorkManager). Bloqueá-la gera <b>ANR</b> (“o app não está respondendo”); o Android proíbe rede na thread principal.</li><li>Funcionar <b>offline</b>: cache local e sincronização quando houver rede.</li><li>Layouts responsivos (ConstraintLayout, Jetpack Compose, densidade de pixels em dp).</li><li>Economia de bateria: evitar polling, agrupar requisições, usar push.</li></ul>`],
['Dados, permissões e recursos',`<p>Armazenamento: SharedPreferences/DataStore (pares chave-valor, configurações), <b>SQLite/Room</b> (banco relacional local), arquivos, Keystore (chaves seguras). Comunicação com APIs REST (Retrofit) em JSON.</p>
<p><b>Permissões</b>: as perigosas (câmera, localização, contatos, microfone) são pedidas <b>em tempo de execução</b>, no momento do uso, e o usuário pode negar; o app precisa lidar com isso. Recursos: GPS, acelerômetro, câmera, NFC, notificações push (Firebase Cloud Messaging).</p>
<p>Arquiteturas recomendadas: MVVM com repositório, injeção de dependência, testes de unidade e de interface. Publicação: assinatura do app, versionamento, políticas da loja.</p>`]],
e:[
['Ciclo de vida',`<p>Ordem dos métodos em um cenário (abrir app, receber ligação, voltar, girar a tela).</p><div class="pega">Pegadinha: esquecer que girar a tela recria a Activity.</div>`],
['Nativo × multiplataforma',`<p>Escolher a abordagem para um cenário de negócio (prazo, equipe, desempenho, hardware).</p>`],
['Thread principal e assincronia',`<p>Consequências de operações longas na UI e como resolver.</p>`],
['Permissões e armazenamento local',`<p>Quando e como pedir permissões; onde guardar cada tipo de dado.</p>`]]});

X('ihc',{t:[
['O que é IHC',`<p>Interação Humano-Computador estuda o projeto, a avaliação e a implementação de sistemas interativos para uso humano. Envolve <b>interface</b> (o que o usuário vê e toca) e <b>interação</b> (o diálogo entre usuário e sistema). Fatores humanos: percepção, memória de curto prazo limitada, atenção, modelos mentais.</p>
<p>Leis úteis: <b>Lei de Fitts</b> (o tempo para atingir um alvo cresce com a distância e diminui com o tamanho: botões importantes devem ser grandes e próximos; cantos da tela são fáceis de atingir) e <b>Lei de Hick</b> (o tempo de decisão cresce com o número de opções).</p>`],
['Usabilidade, UX e acessibilidade',`<p><b>Usabilidade</b> (ISO 9241-11): eficácia (completar a tarefa), eficiência (com pouco esforço) e satisfação, para usuários específicos em contexto específico. Nielsen acrescenta facilidade de aprendizado, de memorização e baixa taxa de erros.</p>
<p><b>Experiência do usuário (UX)</b> vai além: emoções, percepções e valor antes, durante e depois do uso. <b>Comunicabilidade</b> (engenharia semiótica): a interface comunica a intenção do designer ao usuário.</p>
<p><b>Acessibilidade</b>: uso por pessoas com deficiência. <b>WCAG</b> tem quatro princípios (POUR): Perceptível (texto alternativo, contraste, legendas), Operável (teclado, tempo suficiente), Compreensível (linguagem clara, comportamento previsível), Robusto (compatível com tecnologias assistivas como leitores de tela). No Brasil, Lei Brasileira de Inclusão (13.146/2015) e eMAG no governo.</p>`],
['Heurísticas de Nielsen',`<ol><li><b>Visibilidade do status do sistema</b>: feedback (barra de progresso, “salvo”).</li><li><b>Correspondência com o mundo real</b>: linguagem e ícones do usuário (lixeira).</li><li><b>Controle e liberdade</b>: desfazer, cancelar, voltar.</li><li><b>Consistência e padrões</b>: mesmos termos e posições; seguir convenções da plataforma.</li><li><b>Prevenção de erros</b>: confirmações, desabilitar opções inválidas, máscaras de entrada.</li><li><b>Reconhecimento em vez de memorização</b>: mostrar opções, histórico, autocompletar.</li><li><b>Flexibilidade e eficiência</b>: atalhos para experientes.</li><li><b>Estética e design minimalista</b>: sem informação irrelevante.</li><li><b>Ajudar a reconhecer, diagnosticar e recuperar erros</b>: mensagens claras com a solução.</li><li><b>Ajuda e documentação</b>: fácil de achar e focada na tarefa.</li></ol>`],
['Processo de design',`<p><b>Design centrado no usuário</b> (ISO 9241-210): entender o contexto de uso → especificar requisitos → produzir soluções → avaliar, em ciclos. Técnicas: entrevistas, questionários, observação, <b>personas</b> (usuários fictícios representativos), cenários, jornadas do usuário, card sorting (arquitetura de informação).</p>
<p><b>Prototipação</b>: baixa fidelidade (papel, wireframes; barata, boa para explorar ideias) → alta fidelidade (Figma; aparência e interação próximas do real). Design Thinking: empatizar, definir, idear, prototipar, testar.</p>`],
['Avaliação',`<table class="mini"><tr><th>Método</th><th>Com usuários?</th><th>Descrição</th></tr><tr><td>Avaliação heurística</td><td>não</td><td>3 a 5 especialistas inspecionam a interface com as heurísticas e classificam a gravidade</td></tr><tr><td>Percurso cognitivo</td><td>não</td><td>especialista simula um usuário novato executando tarefas passo a passo (foco em aprendizado)</td></tr><tr><td>Inspeção semiótica</td><td>não</td><td>analisa a comunicação designer → usuário</td></tr><tr><td>Teste de usabilidade</td><td>sim</td><td>usuários reais executam tarefas observados; mede tempo, erros, sucesso</td></tr><tr><td>Pensar em voz alta</td><td>sim</td><td>o usuário verbaliza o que pensa durante o uso</td></tr><tr><td>Questionários (SUS)</td><td>sim</td><td>satisfação percebida</td></tr><tr><td>Teste A/B</td><td>sim</td><td>compara duas versões com usuários reais em produção</td></tr></table>
<p>Métodos de inspeção são baratos e rápidos; os com usuários revelam problemas reais de uso. Os dois se complementam.</p>`]],
e:[
['Heurística violada',`<p>A questão mais comum: descrevem um problema de interface e pedem a heurística de Nielsen correspondente. Decore as 10 com um exemplo de cada.</p><div class="pega">Pegadinha: prevenção de erros (evitar que aconteça) × ajudar a recuperar de erros (mensagem depois que aconteceu).</div>`],
['Métodos de avaliação',`<p>Inspeção (sem usuários) × observação (com usuários); quando usar cada um.</p>`],
['Acessibilidade',`<p>Princípios da WCAG e situações de exclusão digital.</p>`],
['Design centrado no usuário e prototipação',`<p>Etapas do processo e papel das personas e protótipos.</p>`]]});

X('infsoc',{t:[
['Computação, sociedade e ética',`<p>A tecnologia não é neutra: decisões de projeto afetam pessoas. O profissional de computação tem responsabilidade sobre segurança, privacidade, acessibilidade e consequências sociais do que constrói.</p>
<p>Códigos de ética (ACM, IEEE, SBC) pedem: contribuir para a sociedade e o bem-estar humano, evitar danos, ser honesto e confiável, ser justo e não discriminar, respeitar a privacidade, honrar a confidencialidade, respeitar a propriedade intelectual e manter competência profissional. Dilemas comuns: descobrir uma falha grave e a empresa querer ocultá-la; pedido para coletar dados além do necessário; sistema que pode causar dano físico.</p>`],
['LGPD: princípios e bases legais',`<p>A <b>Lei Geral de Proteção de Dados</b> (Lei 13.709/2018) regula o tratamento de dados pessoais por pessoas e empresas, on-line e off-line. Conceitos: <b>dado pessoal</b> (identifica ou torna identificável uma pessoa), <b>dado pessoal sensível</b> (origem racial ou étnica, religião, opinião política, filiação sindical, saúde, vida sexual, genética, biometria), <b>dado anonimizado</b> (não identificável; fora da lei), <b>titular</b>, <b>controlador</b> (decide), <b>operador</b> (executa), <b>encarregado/DPO</b> (canal de comunicação).</p>
<p><b>Princípios</b>: finalidade, adequação, <b>necessidade</b> (mínimo de dados), livre acesso, qualidade, transparência, segurança, prevenção, não discriminação e responsabilização.</p>
<p><b>Bases legais</b> (dez): consentimento, cumprimento de obrigação legal, execução de políticas públicas, estudos por órgão de pesquisa, execução de contrato, exercício regular de direitos, proteção da vida, tutela da saúde, <b>legítimo interesse</b> e proteção do crédito. O consentimento <b>não</b> é a única base.</p>`],
['LGPD: direitos e fiscalização',`<p>Direitos do titular: confirmação e <b>acesso</b>, <b>correção</b>, anonimização ou eliminação de dados desnecessários, <b>portabilidade</b>, <b>eliminação</b> dos dados tratados com consentimento, informação sobre compartilhamento, revogação do consentimento e <b>revisão de decisões automatizadas</b>.</p>
<p>Consentimento deve ser livre, informado e inequívoco, para finalidade determinada. Crianças: consentimento de um dos pais. Incidentes de segurança relevantes devem ser comunicados à <b>ANPD</b> e aos titulares. Sanções: advertência, multa de até 2% do faturamento (limitada a R$ 50 milhões por infração), bloqueio e eliminação dos dados. <i>Privacy by design</i>: pensar a privacidade desde o projeto.</p>`],
['Marco Civil e propriedade intelectual',`<p><b>Marco Civil da Internet</b> (Lei 12.965/2014): neutralidade da rede (tráfego tratado de forma isonômica), privacidade e inviolabilidade das comunicações, guarda de registros de conexão (1 ano, provedores de conexão) e de acesso a aplicações (6 meses), responsabilização de provedores por conteúdo de terceiros só após ordem judicial (com exceções, como imagens íntimas não autorizadas).</p>
<p><b>Software</b> é protegido por <b>direito autoral</b> (Lei 9.609/1998, Lei do Software), não por patente no Brasil (salvo invenções implementadas por software em casos específicos). Licenças: proprietárias e livres. Software livre (liberdades de usar, estudar, modificar e distribuir). <b>GPL</b> é copyleft (derivados devem manter a licença); <b>MIT, BSD, Apache</b> são permissivas. Lei 12.737/2012 tipifica invasão de dispositivo informático.</p>`],
['Impactos sociais da tecnologia',`<ul><li><b>Exclusão digital</b>: falta de acesso, de dispositivos ou de letramento digital; afeta educação, emprego e cidadania.</li><li><b>Trabalho e automação</b>: substituição de tarefas, plataformização (trabalho por aplicativo), novas profissões; necessidade de requalificação.</li><li><b>Viés algorítmico</b>: modelos treinados com dados históricos reproduzem discriminação (contratação, crédito, reconhecimento facial com mais erros para pessoas negras). Mitigar com dados representativos, auditoria, transparência e revisão humana.</li><li><b>Desinformação</b>, bolhas de filtro e algoritmos de recomendação que priorizam engajamento; deepfakes.</li><li><b>Sustentabilidade</b>: consumo de energia de data centers e IA, lixo eletrônico (Política Nacional de Resíduos Sólidos e logística reversa), TI verde.</li><li><b>Vigilância</b> e privacidade, saúde mental e uso excessivo de telas.</li></ul>
<p>Esses temas aparecem tanto no Componente Específico quanto na <b>Formação Geral</b> do ENADE, inclusive nas questões discursivas.</p>`]],
e:[
['LGPD aplicada a cenários',`<p>Uma empresa quer usar dados de clientes para outra finalidade, vazou dados, coleta dados sensíveis, toma decisão automatizada. Pergunta-se qual princípio, direito ou base legal se aplica.</p><div class="pega">Pegadinha: “o consentimento é a única base legal” ou “dados anonimizados estão sujeitos à LGPD”.</div>`],
['Viés algorítmico e ética em IA',`<p>Interpretar um caso de discriminação por sistema automatizado e propor medidas. Pode vir como questão discursiva.</p>`],
['Exclusão digital e impactos sociais',`<p>Muito presente na Formação Geral, com textos, gráficos e charges. Leia o texto-base com atenção e relacione com dados do enunciado.</p>`],
['Propriedade intelectual e licenças',`<p>Direito autoral × patente para software, GPL × MIT.</p>`],
['Responsabilidade profissional',`<p>Dilemas éticos com base em códigos de conduta.</p>`]]});

X('infedu',{t:[
['Tecnologia e aprendizagem',`<p>Informática na Educação estuda como usar a computação para ensinar e aprender. A tecnologia sozinha não melhora a aprendizagem: o efeito depende da proposta pedagógica. Uma mesma ferramenta pode servir a uma abordagem tradicional (transmitir conteúdo) ou ativa (o aluno constrói o conhecimento).</p>`],
['Teorias de aprendizagem',`<table class="mini"><tr><th>Teoria</th><th>Autor</th><th>Ideia central</th><th>Na tecnologia</th></tr><tr><td>Behaviorismo</td><td>Skinner</td><td>aprendizagem como mudança de comportamento por estímulo, resposta e reforço</td><td>instrução programada, exercícios com feedback imediato, drill-and-practice</td></tr><tr><td>Construtivismo</td><td>Piaget</td><td>o sujeito constrói o conhecimento interagindo com o meio; estágios de desenvolvimento; assimilação e acomodação</td><td>simulações, ambientes exploratórios</td></tr><tr><td>Socioconstrutivismo</td><td>Vygotsky</td><td>aprendizagem é social e mediada; <b>zona de desenvolvimento proximal</b> (entre o que se faz sozinho e com ajuda)</td><td>aprendizagem colaborativa, fóruns, tutoria por pares</td></tr><tr><td>Construcionismo</td><td>Papert</td><td>aprende-se construindo artefatos significativos com o computador</td><td>Logo, Scratch, robótica, programação</td></tr><tr><td>Aprendizagem significativa</td><td>Ausubel</td><td>o novo se ancora no que o aluno já sabe (subsunçores)</td><td>mapas conceituais</td></tr></table>
<p>Paulo Freire também aparece: educação dialógica e crítica, contra a “educação bancária”.</p>`],
['Ambientes e recursos educacionais',`<ul><li><b>AVA</b> (ambientes virtuais de aprendizagem): Moodle, Google Classroom. Organizam conteúdos, atividades, fóruns e avaliações.</li><li><b>Objetos de aprendizagem</b>: recursos digitais reutilizáveis; <b>REA</b> (recursos educacionais abertos), com licenças livres.</li><li><b>Sistemas tutores inteligentes</b>: usam IA para adaptar o ensino ao aluno (modelo do domínio, do aluno e pedagógico). <b>Learning analytics</b>: análise de dados de uso para acompanhar e prever desempenho.</li><li><b>Gamificação</b>: elementos de jogos (pontos, níveis, medalhas, rankings) em contexto não jogo para engajar. Diferente de <b>jogos educacionais</b> (o próprio jogo ensina).</li><li><b>Metodologias ativas</b>: sala de aula invertida (estudo prévio em casa, prática na aula), aprendizagem baseada em problemas e em projetos, ensino híbrido.</li><li>EAD, MOOCs.</li></ul>`],
['Pensamento computacional',`<p>Habilidade de resolver problemas com conceitos da computação, útil a todos, não só a programadores (Jeannette Wing). Quatro pilares:</p>
<ol><li><b>Decomposição</b>: dividir o problema em partes menores.</li><li><b>Reconhecimento de padrões</b>: identificar semelhanças entre problemas ou dentro deles.</li><li><b>Abstração</b>: focar no essencial e ignorar detalhes irrelevantes.</li><li><b>Algoritmos</b>: definir passos ordenados para resolver.</li></ol>
<p>Pode ser ensinado com ou sem computador (<b>computação desplugada</b>). No Brasil, a <b>BNCC</b> e seu complemento de Computação (2022) incluem pensamento computacional, mundo digital e cultura digital na educação básica.</p>`],
['Inclusão e avaliação',`<p><b>Tecnologias assistivas</b>: leitores de tela, ampliadores, teclados alternativos, comunicação alternativa, tradução para Libras (VLibras). <b>Desenho Universal para a Aprendizagem</b> (DUA): múltiplas formas de representação, de ação e expressão, e de engajamento.</p>
<p>Avaliação de software educacional: qualidade técnica (usabilidade, acessibilidade) e pedagógica (alinhamento com objetivos e teoria de aprendizagem). Avaliação da aprendizagem: diagnóstica, formativa (durante, para ajustar) e somativa (ao final).</p>`]],
e:[
['Teorias de aprendizagem aplicadas',`<p>Uma prática pedagógica é descrita e pergunta-se qual teoria a fundamenta: reforço imediato → Skinner; construir projetos no computador → Papert; ajuda de colegas mais experientes → Vygotsky (ZDP).</p><div class="pega">Pegadinha: confundir construtivismo (Piaget) com construcionismo (Papert).</div>`],
['Pilares do pensamento computacional',`<p>Associar uma atividade ao pilar correspondente.</p>`],
['Gamificação, AVA e metodologias ativas',`<p>Diferenciar gamificação de jogo educacional e identificar sala de aula invertida.</p>`],
['Inclusão digital e acessibilidade',`<p>Também aparece na Formação Geral.</p>`]]});
// Lote 1: fundamentos e programação (linguagem simples)
T('intro',[
['Para que serve esta matéria',`<p>Introdução à Computação explica <b>como o computador guarda e trabalha com informação</b>. No ENADE ela aparece em contas rápidas: quantos valores cabem em tantos bits, converter números entre bases, números negativos e o porquê de 0,1 + 0,2 não dar exatamente 0,3.</p>
<div class="ideia">Pense no computador como um enorme painel de interruptores. Cada interruptor só fica <b>ligado (1)</b> ou <b>desligado (0)</b>. Tudo, de fotos a mensagens, vira uma sequência desses interruptores.</div>
<p>Cada interruptor se chama <b>bit</b>. Um grupo de 8 bits se chama <b>byte</b>.</p>
<div class="resumo">Bit = 0 ou 1. Byte = 8 bits. Tudo no computador é guardado como bits.</div>`],
['Quantas coisas cabem em n bits',`<p>Cada bit novo <b>dobra</b> a quantidade de combinações possíveis. Com 1 bit temos 2 opções (0, 1). Com 2 bits temos 4 (00, 01, 10, 11). Com 3 bits, 8. A regra é:</p>
<div class="ex"><b>n bits → 2<sup>n</sup> combinações.</b> 8 bits = 256. 10 bits = 1024. 16 bits = 65.536.</div>
<div class="ideia">É como uma senha de cadeado com rodinhas que só têm 0 e 1. Cada rodinha extra dobra as senhas possíveis.</div>
<p>O caminho inverso também cai: “quantos bits preciso para 100 valores?”. Procure a menor potência de 2 que seja maior ou igual a 100: 2<sup>7</sup> = 128. Então, <b>7 bits</b>.</p>
<div class="pega">Bit (b minúsculo) é diferente de byte (B maiúsculo). Internet de 100 Mbps baixa no máximo 100 ÷ 8 = 12,5 MB por segundo.</div>
<div class="resumo">Para contar combinações, faça 2 elevado ao número de bits. Para descobrir bits, procure a potência de 2 que “cobre” o valor.</div>`],
['Trocando de base: binário, decimal e hexadecimal',`<p>No decimal, cada posição vale 10 vezes a anterior (unidade, dezena, centena). No <b>binário</b>, cada posição vale o <b>dobro</b>: 1, 2, 4, 8, 16, 32…</p>
<div class="ex"><b>Binário → decimal:</b> escreva os valores das posições em cima e some onde tem 1.<br>101101 → 32 + 8 + 4 + 1 = <b>45</b>.</div>
<div class="ex"><b>Decimal → binário:</b> divida por 2 até chegar a 0 e leia os restos de baixo para cima.<br>13 ÷ 2 = 6 resto 1; 6 ÷ 2 = 3 resto 0; 3 ÷ 2 = 1 resto 1; 1 ÷ 2 = 0 resto 1 → <b>1101</b>.</div>
<p>O <b>hexadecimal</b> (base 16) usa 0–9 e depois A=10, B=11, C=12, D=13, E=14, F=15. Ele é só um jeito curto de escrever binário: <b>cada dígito hexa = 4 bits</b>.</p>
<div class="ex">0x3F → 3 = 0011 e F = 1111 → 0011 1111. Em decimal: 3×16 + 15 = <b>63</b>.</div>
<div class="resumo">Binário: posições 1, 2, 4, 8… Hexa: cada dígito vale 4 bits e as posições valem 1, 16, 256…</div>`],
['Números negativos: complemento de dois',`<p>O computador não tem um “sinal de menos”. Ele usa um truque chamado <b>complemento de dois</b>, que permite usar o mesmo circuito para somar e subtrair.</p>
<div class="ex"><b>Receita para achar −x:</b><br>1. Escreva x em binário com todos os bits (ex.: 8 bits).<br>2. Troque todo 0 por 1 e todo 1 por 0.<br>3. Some 1.<br>−5: 00000101 → 11111010 → <b>11111011</b>.</div>
<p>O primeiro bit da esquerda diz o sinal: 1 é negativo, 0 é positivo. Com 8 bits a faixa vai de <b>−128 até 127</b>.</p>
<div class="ideia">É como o hodômetro de um carro: se você está em 000 e anda uma casa para trás, aparece 999. No binário de 8 bits, “um antes de zero” é 11111111, que significa −1.</div>
<p><b>Overflow</b> é quando a conta não cabe na faixa. Sinal clássico: somar dois positivos e o resultado aparecer negativo. 100 + 50 = 150, mas o máximo é 127, então “dá a volta”.</p>
<div class="resumo">−x = inverte os bits e soma 1. 8 bits com sinal vão de −128 a 127. Passou disso, é overflow.</div>`],
['Números com vírgula (ponto flutuante)',`<p>Números quebrados são guardados como uma <b>notação científica em binário</b>, no padrão IEEE 754: um bit de sinal, um expoente e uma mantissa (os dígitos significativos).</p>
<div class="ideia">Tente escrever 1/3 em decimal: 0,3333… nunca acaba, e você precisa cortar em algum lugar. No binário acontece o mesmo com 0,1. O computador guarda uma versão “quase 0,1”.</div>
<div class="ex">0,1 + 0,2 no computador dá 0,30000000000000004. Por isso <code>0.1 + 0.2 == 0.3</code> é <b>falso</b>.</div>
<p>Precisão simples usa 32 bits; precisão dupla usa 64 bits. A dupla é mais exata, mas <b>ainda não é perfeita</b>.</p>
<div class="pega">Nunca compare números com vírgula usando ==. O certo é ver se a diferença é bem pequena: |a − b| &lt; 0,000001.</div>
<div class="resumo">Floats são aproximações. Erros pequenos de arredondamento são normais e esperados.</div>`],
['Como o computador executa um programa',`<p>Quase todo computador segue o modelo de <b>von Neumann</b>: uma <b>CPU</b> (o “cérebro”), uma <b>memória</b> que guarda dados e instruções juntos, e dispositivos de <b>entrada e saída</b>, ligados por fios chamados barramentos.</p>
<p>A CPU repete sempre o mesmo ciclo: <b>busca</b> a próxima instrução na memória, <b>decodifica</b> (entende o que é) e <b>executa</b>.</p>
<div class="ideia">Imagine um cozinheiro (CPU) com um único corredor até a despensa (memória). Ingredientes e receitas ficam na mesma despensa e passam pelo mesmo corredor. Se o corredor é estreito, o cozinheiro fica esperando. Isso é o <b>gargalo de von Neumann</b>.</div>
<p>Soluções: a <b>cache</b> (uma bancada perto do cozinheiro com o que ele mais usa) e a arquitetura <b>Harvard</b> (dois corredores: um para dados e outro para instruções).</p>
<div class="resumo">Von Neumann = dados e instruções na mesma memória e no mesmo caminho. Esse caminho único é o gargalo.</div>`]
]);

T('matcomp',[
['Para que serve esta matéria',`<p>Matemática Computacional (ou Matemática Discreta) é a matemática que o programador usa: <b>lógica</b>, <b>conjuntos</b>, <b>contagem</b>, <b>relações</b> e <b>provas</b>. No ENADE ela aparece direto e também escondida em questões de algoritmos e banco de dados.</p>
<div class="ideia">Se programar é dar ordens para a máquina, a lógica é a gramática dessas ordens. Todo <code>if</code> que você escreve é uma proposição lógica.</div>
<div class="resumo">Foque em: tabela-verdade, “se… então”, conjuntos, combinações e indução.</div>`],
['Lógica: e, ou, não, se… então',`<p>Uma <b>proposição</b> é uma frase que é verdadeira (V) ou falsa (F). Os conectivos são:</p>
<ul><li><b>e (∧)</b>: só é V se as duas forem V.</li><li><b>ou (∨)</b>: é V se pelo menos uma for V.</li><li><b>não (¬)</b>: inverte.</li><li><b>se p então q (p → q)</b>: só é F quando p é V e q é F.</li></ul>
<div class="ideia">Pense em “p → q” como uma <b>promessa</b>: “Se fizer sol, vou à praia”. Você só mentiu se fez sol e você <b>não</b> foi. Se não fez sol, você pode ir ou não, a promessa não foi quebrada.</div>
<p>Formas que aparecem muito:</p>
<table class="mini"><tr><th>Nome</th><th>Forma</th><th>Equivale a p → q?</th></tr><tr><td>Contrapositiva</td><td>¬q → ¬p</td><td><b>Sim</b></td></tr><tr><td>Recíproca</td><td>q → p</td><td>Não</td></tr><tr><td>Inversa</td><td>¬p → ¬q</td><td>Não</td></tr></table>
<div class="ex">“Se chove, a rua molha” equivale a “Se a rua não molhou, não choveu”.</div>
<div class="resumo">p → q só falha com V → F. A única forma equivalente é a contrapositiva.</div>`],
['Negando frases (De Morgan)',`<p>Para negar “e” e “ou”, troque um pelo outro e negue cada parte:</p>
<ul><li>¬(p ∧ q) = ¬p ∨ ¬q</li><li>¬(p ∨ q) = ¬p ∧ ¬q</li></ul>
<div class="ex">Negar “Estudo e passo” dá “Não estudo <b>ou</b> não passo”.</div>
<p>E para negar “se p então q”? A negação é <b>p e não q</b> (o único caso que quebra a promessa).</p>
<div class="ex">Negar “Se chove, levo guarda-chuva” dá “Chove <b>e</b> não levo guarda-chuva”.</div>
<div class="pega">A negação de “todos os alunos passaram” é “<b>pelo menos um</b> aluno não passou”, e não “nenhum aluno passou”.</div>
<div class="resumo">Negar troca e ↔ ou. Negar “todos” vira “existe um que não”.</div>`],
['Conjuntos',`<p>Um conjunto é uma coleção sem repetição e sem ordem. Operações:</p>
<ul><li><b>União (A ∪ B)</b>: tudo que está em A ou em B.</li><li><b>Interseção (A ∩ B)</b>: o que está nos dois.</li><li><b>Diferença (A − B)</b>: o que está em A e não está em B.</li></ul>
<p>O <b>conjunto das partes</b> P(A) é a lista de todos os subconjuntos de A. Se A tem n elementos, P(A) tem <b>2<sup>n</sup></b>.</p>
<div class="ideia">Para montar um subconjunto, você pergunta a cada elemento: “entra ou não entra?”. São 2 escolhas por elemento, então 2 × 2 × 2… = 2<sup>n</sup>.</div>
<div class="ex">A = {1, 2, 3} → P(A) tem 2<sup>3</sup> = 8 subconjuntos, incluindo o vazio {} e o próprio {1, 2, 3}.</div>
<div class="resumo">|P(A)| = 2<sup>n</sup>. Conte sempre o vazio e o conjunto inteiro.</div>`],
['Contagem: quantas formas existem',`<p>Duas perguntas resolvem quase tudo: <b>a ordem importa?</b> e <b>pode repetir?</b></p>
<table class="mini"><tr><th>Situação</th><th>Conta</th><th>Exemplo</th></tr><tr><td>Ordem importa, com repetição</td><td>n × n × … (k vezes)</td><td>Senha de 4 dígitos: 10<sup>4</sup></td></tr><tr><td>Ordem importa, sem repetição (arranjo)</td><td>n × (n−1) × …</td><td>Pódio de 10 atletas: 10×9×8</td></tr><tr><td>Ordem não importa (combinação)</td><td>arranjo ÷ k!</td><td>Escolher 3 de 10: 720 ÷ 6 = 120</td></tr></table>
<div class="ideia">Pódio (1º, 2º, 3º) é diferente se trocar as pessoas: ordem importa. Comissão de 3 pessoas é a mesma em qualquer ordem: ordem não importa.</div>
<div class="ex">Senha de 4 dígitos sem repetir: 10 × 9 × 8 × 7 = <b>5040</b>.</div>
<div class="resumo">Pergunte: a ordem importa? pode repetir? Depois multiplique as opções de cada posição.</div>`],
['Relações e indução',`<p>Uma <b>relação de equivalência</b> é uma forma de dizer “estes são do mesmo grupo”. Ela precisa ser:</p>
<ul><li><b>Reflexiva</b>: todo mundo se relaciona consigo mesmo.</li><li><b>Simétrica</b>: se a com b, então b com a.</li><li><b>Transitiva</b>: se a com b e b com c, então a com c.</li></ul>
<div class="ex">“Ter o mesmo resto na divisão por 3” é equivalência. Ela separa os inteiros em 3 grupos: resto 0, resto 1 e resto 2.</div>
<p><b>Indução</b> é a forma de provar algo para todos os números naturais:</p>
<div class="ideia">É como uma fila de dominós. 1) Mostre que o primeiro cai (<b>base</b>). 2) Mostre que, se um cai, o próximo também cai (<b>passo</b>). Então todos caem.</div>
<div class="pega">Testar muitos casos (1, 2, 3… 100) <b>não</b> é prova. O passo indutivo é “supor que vale para k e mostrar que vale para k+1”.</div>
<div class="resumo">Equivalência = reflexiva + simétrica + transitiva. Indução = base + passo (k → k+1).</div>`]
]);
P('matcomp',[
['Lembre que p → q é uma promessa.','A promessa só é quebrada quando a condição acontece (p verdadeira) e o resultado não (q falsa).','Resposta: p verdadeira e q falsa.'],
['A tem 3 elementos.','O conjunto das partes tem 2<sup>n</sup> elementos.','2<sup>3</sup> = 8.'],
['Identifique p = “chove” e q = “a rua molha”.','A única forma equivalente a p → q é a contrapositiva: ¬q → ¬p.','Escreva: “Se a rua não fica molhada, então não chove”.'],

N('matcomp',[
{n:1,q:`Se p é verdadeira e q é falsa, qual o valor de <code>p ∨ q</code> (p ou q)?`,a:['*verdadeiro','falso','indefinido','depende de p → q','verdadeiro só se q for verdadeira'],e:`“Ou” é verdadeiro se pelo menos uma parte for verdadeira.`,p:['“Ou” precisa de pelo menos uma parte verdadeira.','p é verdadeira.','Então p ∨ q é verdadeiro.']},
{n:1,q:`Sejam A = {1, 2, 3, 4} e B = {3, 4, 5}. O conjunto A ∩ B é:`,a:['*{3, 4}','{1, 2, 3, 4, 5}','{1, 2}','{5}','{}'],e:`Interseção = elementos que estão nos dois conjuntos.`,p:['Interseção é o que aparece nos dois.','Compare: 3 e 4 estão em A e em B.','Resposta: {3, 4}.']},
{n:2,q:`Qual é a negação de “Todos os testes passaram”?`,a:['*Pelo menos um teste não passou','Nenhum teste passou','Todos os testes falharam','Alguns testes passaram','Nenhum teste falhou'],e:`Para negar “todos”, basta um contraexemplo: existe pelo menos um que não passou.`,p:['Pense: o que basta para a frase “todos passaram” ser mentira?','Basta um único teste ter falhado.','Então a negação é “pelo menos um teste não passou”.']},
{n:2,q:`De quantas formas é possível escolher uma comissão de 2 pessoas entre 5 candidatos?`,a:['*10','20','25','5','120'],e:`A ordem não importa: (5 × 4) ÷ 2 = 10.`,p:['A ordem importa? Não: a comissão Ana e Bruno é a mesma que Bruno e Ana.','Primeiro conte com ordem: 5 × 4 = 20.','Como cada dupla foi contada 2 vezes, divida por 2: 20 ÷ 2 = 10.']},
{n:2,q:`A negação de “Se o servidor cai, então o alarme toca” é:`,a:['*O servidor cai e o alarme não toca','Se o servidor não cai, o alarme não toca','O servidor não cai e o alarme toca','Se o alarme toca, o servidor cai','O servidor não cai ou o alarme não toca'],e:`A negação de p → q é p ∧ ¬q.`,p:['Lembre: p → q só é falsa quando p acontece e q não.','Negar a frase é descrever exatamente esse caso.','p = “o servidor cai”; ¬q = “o alarme não toca”. Junte com “e”.']},
{n:3,q:`A relação “a é menor ou igual a b” (≤) sobre os inteiros é:`,a:['*reflexiva, antissimétrica e transitiva, ou seja, uma ordem parcial','uma relação de equivalência','simétrica e transitiva, mas não reflexiva','reflexiva e simétrica, mas não transitiva','apenas transitiva'],e:`a ≤ a (reflexiva); se a ≤ b e b ≤ a, então a = b (antissimétrica); a ≤ b e b ≤ c dá a ≤ c (transitiva). Não é simétrica (2 ≤ 3, mas 3 ≤ 2 é falso).`,p:['Teste reflexiva: a ≤ a é sempre verdade. Sim.','Teste simétrica: 2 ≤ 3, mas 3 ≤ 2 é falso. Não é simétrica, então não é equivalência.','Teste transitiva: a ≤ b e b ≤ c dá a ≤ c. Sim. Reflexiva + antissimétrica + transitiva = ordem parcial.']}
]);

T('alg1',[
['Para que serve esta matéria',`<p>Algoritmos e Programação é a base de tudo: <b>variáveis</b>, <b>decisões</b> (if), <b>repetições</b> (laços), <b>vetores</b> e <b>funções</b>. No ENADE a questão típica mostra um trecho de código e pergunta “o que é impresso?” ou “onde está o erro?”.</p>
<div class="ideia">Um algoritmo é uma receita de bolo: passos claros, em ordem, que sempre terminam. O programa é essa receita escrita numa língua que o computador entende.</div>
<div class="resumo">A habilidade mais cobrada é <b>simular o código no papel</b>, linha por linha, anotando o valor de cada variável.</div>`],
['Como simular código (teste de mesa)',`<p>Faça uma tabela com uma coluna para cada variável. Execute uma linha por vez e atualize a tabela.</p>
<pre>int x = 2, y = 3;
x = x + y;   // x = 5
y = x * 2;   // y = 10
x = y - x;   // x = 5</pre>
<div class="ex">Tabela: início x=2, y=3 → x=5 → y=10 → x=5. Resposta: x = 5 e y = 10.</div>
<div class="pega">Uma atribuição usa os valores <b>atuais</b>. Depois de <code>x = x + y</code>, o x antigo some.</div>
<div class="resumo">Não tente “adivinhar”. Monte a tabela e siga linha por linha.</div>`],
['Laços: for, while e do-while',`<p>Laços repetem um bloco. Os três tipos:</p>
<ul><li><b>for</b>: quando você sabe quantas vezes repetir.</li><li><b>while</b>: testa a condição <b>antes</b>; pode não executar nenhuma vez.</li><li><b>do-while</b>: testa <b>depois</b>; executa <b>pelo menos uma vez</b>.</li></ul>
<div class="ex"><code>for (i = 0; i &lt; 5; i++)</code> roda com i = 0, 1, 2, 3, 4: <b>5 vezes</b>. Com <code>i &lt;= 5</code> seriam 6.</div>
<p><b>Laços aninhados</b> (um dentro do outro): o de dentro roda inteiro para cada volta do de fora.</p>
<div class="ideia">É como um relógio: o ponteiro dos minutos dá uma volta inteira para cada hora que o ponteiro das horas anda.</div>
<div class="ex">Fora 3 vezes, dentro 4 vezes → 3 × 4 = 12 execuções. Se o de dentro começa em i, some cada volta separadamente (4 + 3 + 2 + 1).</div>
<div class="resumo">Conte com cuidado o primeiro e o último valor. &lt; e &lt;= mudam o resultado em 1.</div>`],
['Vetores e o erro de índice',`<p>Um vetor é uma fila de caixinhas numeradas. Em C, Java e Python a numeração <b>começa em 0</b>.</p>
<div class="ex">Vetor de 5 posições: índices 0, 1, 2, 3, 4. A posição 5 <b>não existe</b>.</div>
<div class="pega">Laço <code>for (i = 1; i &lt;= n; i++)</code> pula o v[0] e acessa v[n], que fica fora do vetor. O certo é <code>for (i = 0; i &lt; n; i++)</code>.</div>
<p>Outro erro clássico é a <b>divisão inteira</b>: em C, 7 / 2 dá 3 (a parte decimal é jogada fora). Para ter 3,5, converta antes: <code>(float) 7 / 2</code>.</p>
<div class="resumo">Índices vão de 0 a n−1. Inteiro dividido por inteiro dá inteiro.</div>`],
['Funções e passagem de parâmetros',`<p>Uma função recebe dados (parâmetros), faz algo e pode devolver um resultado (return). Existem dois jeitos de passar dados:</p>
<ul><li><b>Por valor</b>: a função recebe uma <b>cópia</b>. Mudar a cópia não muda a original.</li><li><b>Por referência</b> (em C, com ponteiro <code>*</code> e <code>&amp;</code>): a função recebe o <b>endereço</b> e consegue mudar a original.</li></ul>
<div class="ideia">Por valor é entregar uma <b>fotocópia</b> do documento: a pessoa pode rabiscar, o seu fica intacto. Por referência é entregar o <b>endereço da sua casa</b>: a pessoa vai lá e mexe nas suas coisas.</div>
<pre>void f(int x, int *y) { x = 10; *y = 20; }
int a = 1, b = 2;
f(a, &amp;b);   // a continua 1, b vira 20</pre>
<div class="resumo">Sem ponteiro, a variável original não muda. Com ponteiro (*y), muda.</div>`]
]);

T('alg2',[
['Para que serve esta matéria',`<p>Algoritmos II ensina a resolver problemas maiores: <b>recursão</b>, <b>busca</b>, <b>ordenação</b>, <b>ponteiros</b> e <b>memória dinâmica</b>, além de medir se um algoritmo é rápido (complexidade).</p>
<div class="resumo">No ENADE: calcular o resultado de uma função recursiva, escolher o melhor algoritmo de ordenação para um cenário e achar erros de memória.</div>`],
['Recursão: a função que chama a si mesma',`<p>Uma função recursiva resolve um problema grande chamando a si mesma para um problema <b>menor</b>, até chegar num caso tão simples que a resposta é direta: o <b>caso base</b>.</p>
<div class="ideia">Bonecas russas: para chegar na menor, você abre uma boneca, e dentro tem outra menor, e assim por diante, até a última que não abre (o caso base).</div>
<pre>int fat(int n) {
  if (n &lt;= 1) return 1;     // caso base
  return n * fat(n - 1);    // chamada menor
}</pre>
<div class="ex">fat(4) = 4 × fat(3) = 4 × 3 × fat(2) = 4 × 3 × 2 × fat(1) = 4 × 3 × 2 × 1 = <b>24</b>.</div>
<div class="pega">Sem caso base (ou se ele nunca é alcançado), a função chama a si mesma para sempre e <b>estoura a pilha</b> (stack overflow).</div>
<div class="resumo">Para resolver no papel, abra as chamadas até o caso base e depois volte multiplicando/somando.</div>`],
['Medindo velocidade: notação O',`<p>A notação <b>O</b> diz como o tempo cresce quando a entrada cresce. Não importa o segundo exato, importa o <b>formato do crescimento</b>.</p>
<table class="mini"><tr><th>Notação</th><th>Nome</th><th>Exemplo</th></tr><tr><td>O(1)</td><td>constante</td><td>acessar v[i]</td></tr><tr><td>O(log n)</td><td>logarítmico</td><td>busca binária</td></tr><tr><td>O(n)</td><td>linear</td><td>percorrer um vetor</td></tr><tr><td>O(n log n)</td><td></td><td>merge sort</td></tr><tr><td>O(n²)</td><td>quadrático</td><td>dois laços aninhados</td></tr></table>
<div class="ideia">O(n) é ler um livro página por página. O(log n) é procurar uma palavra no dicionário abrindo no meio e descartando metade a cada vez.</div>
<div class="resumo">Um laço sobre n = O(n). Dois laços aninhados = O(n²). Cortar pela metade a cada passo = O(log n).</div>`],
['Busca sequencial e busca binária',`<p><b>Busca sequencial</b>: olha um por um. Funciona sempre, mas é O(n).</p>
<p><b>Busca binária</b>: olha o elemento do meio. Se o procurado é menor, descarta a metade da direita; se maior, a da esquerda. Repete. É O(log n).</p>
<div class="ex">Procurar 23 em [3, 8, 15, 23, 42, 57, 60]: meio = 23. Achou em 1 passo. Em 1 milhão de elementos, bastam cerca de 20 passos.</div>
<div class="pega">A busca binária <b>só funciona com o vetor ordenado</b>. Sem ordem, não dá para saber qual metade descartar.</div>
<div class="resumo">Ordenado → busca binária, O(log n). Desordenado → sequencial, O(n).</div>`],
['Ordenação: qual algoritmo usar',`<table class="mini"><tr><th>Algoritmo</th><th>Ideia</th><th>Tempo</th><th>Quando brilha</th></tr><tr><td>Bubble</td><td>troca vizinhos fora de ordem</td><td>O(n²)</td><td>didático</td></tr><tr><td>Selection</td><td>acha o menor e põe no início</td><td>O(n²), poucas trocas</td><td>quando trocar é caro</td></tr><tr><td>Insertion</td><td>insere cada item no lugar certo, como cartas na mão</td><td>O(n²), mas O(n) se quase ordenado</td><td>dados quase ordenados</td></tr><tr><td>Merge</td><td>divide ao meio, ordena e junta</td><td>O(n log n) sempre</td><td>garantia de tempo, estável</td></tr><tr><td>Quick</td><td>escolhe um pivô e separa menores e maiores</td><td>O(n log n) médio, O(n²) no pior</td><td>rápido na prática</td></tr></table>
<div class="ideia">Insertion sort é o jeito como você organiza cartas na mão: pega uma e encaixa no lugar certo entre as que já estão organizadas. Se as cartas já vêm quase em ordem, quase não há trabalho.</div>
<p><b>Estável</b> quer dizer que elementos iguais mantêm a ordem original. Merge e insertion são estáveis; quick e selection, na versão clássica, não.</p>
<div class="resumo">Quase ordenado → insertion. Pior caso garantido → merge. Quick com pivô ruim em dados ordenados vira O(n²).</div>`],
['Ponteiros e memória dinâmica',`<p>Um <b>ponteiro</b> guarda um endereço de memória. <code>malloc</code> pede um pedaço de memória e devolve o endereço; <code>free</code> devolve esse pedaço.</p>
<div class="ideia">malloc é alugar um armário e receber a chave. free é devolver o armário. Se você joga a chave fora sem devolver, o armário fica alugado para sempre: isso é o <b>vazamento de memória</b>.</div>
<ul><li><b>Vazamento (memory leak)</b>: perdeu o último ponteiro para um bloco sem dar free.</li><li><b>Ponteiro pendente (dangling)</b>: usar o ponteiro depois do free.</li><li><b>Dupla liberação</b>: dar free duas vezes no mesmo bloco.</li></ul>
<div class="ex"><code>p = malloc(10); p = malloc(20); free(p);</code> → o primeiro bloco perdeu a chave: vazamento.</div>
<div class="resumo">Todo malloc precisa de um free. Não perca o ponteiro e não use depois de liberar.</div>`]
]);

T('parad',[
['Para que serve esta matéria',`<p>Paradigma é o <b>estilo de pensar</b> na hora de programar. A mesma tarefa pode ser escrita de jeitos muito diferentes. No ENADE pedem para reconhecer o paradigma de um trecho de código e conceitos como função pura e escopo.</p>
<div class="ideia">Pedir um café: no estilo <b>imperativo</b> você explica cada passo (“moa o grão, ferva a água, despeje”). No estilo <b>declarativo</b> você só diz o que quer (“um café, por favor”).</div>
<ul><li><b>Imperativo</b>: diz <i>como</i> fazer. Inclui o estruturado (C) e o orientado a objetos (Java).</li><li><b>Declarativo</b>: diz <i>o que</i> quer. Inclui o funcional (Haskell), o lógico (Prolog) e o SQL.</li></ul>
<div class="resumo">Imperativo = passo a passo mudando variáveis. Declarativo = descrever o resultado.</div>`],
['Paradigma funcional',`<p>O programa é feito de <b>funções no sentido da matemática</b>: recebe uma entrada e devolve uma saída, sem mexer em mais nada.</p>
<ul><li><b>Função pura</b>: mesma entrada → sempre a mesma saída, e <b>sem efeitos colaterais</b> (não altera variável global, não imprime, não grava arquivo).</li><li><b>Imutabilidade</b>: em vez de alterar uma lista, cria uma nova.</li><li><b>Funções de alta ordem</b>: funções que recebem ou devolvem funções.</li></ul>
<div class="ideia">Função pura é como uma calculadora: 2 + 3 dá 5 hoje, amanhã e sempre, e a calculadora não muda nada no mundo ao fazer a conta.</div>
<p>As três funções que mais caem:</p>
<ul><li><b>map</b>: aplica algo em cada item. map(x → x×2, [1,2,3]) = [2,4,6].</li><li><b>filter</b>: mantém só quem passa no teste. filter(par, [1,2,3,4]) = [2,4].</li><li><b>reduce</b>: junta tudo em um valor. reduce(+, 0, [2,4]) = 6.</li></ul>
<div class="resumo">Para resolver map/filter/reduce, faça uma etapa por vez, de dentro para fora.</div>`],
['Paradigma lógico',`<p>Você escreve <b>fatos</b> e <b>regras</b>, e depois faz <b>perguntas</b>. O próprio sistema descobre a resposta.</p>
<pre>pai(joao, maria).
pai(maria, ana).
avo(X, Z) :- pai(X, Y), pai(Y, Z).
?- avo(joao, Quem).    % Quem = ana</pre>
<div class="ideia">É como um detetive com fichas: “João é pai de Maria”, “Maria é mãe de Ana”, “avô é o pai do pai”. Pergunta: “de quem João é avô?”. Ele cruza as fichas e responde Ana.</div>
<p>O Prolog encontra respostas por <b>unificação</b> (encaixar valores nas variáveis) e <b>backtracking</b> (se der errado, volta e tenta outra opção).</p>
<div class="resumo">Fatos + regras + consultas = paradigma lógico. Linguagem símbolo: Prolog.</div>`],
['Tipagem e escopo',`<p><b>Tipagem estática</b>: os tipos são conferidos antes de rodar (Java, C). <b>Dinâmica</b>: conferidos enquanto roda (Python, JavaScript).</p>
<p><b>Escopo</b> é “de onde uma variável é visível”. Existem dois jeitos de decidir qual x uma função enxerga:</p>
<ul><li><b>Estático (léxico)</b>: olha onde a função foi <b>escrita</b> no código. É o usado por quase todas as linguagens.</li><li><b>Dinâmico</b>: olha quem <b>chamou</b> a função, na hora da execução.</li></ul>
<div class="ideia">Estático é procurar a palavra no dicionário que fica <b>na sua casa</b> (onde você nasceu). Dinâmico é usar o dicionário <b>de quem está te visitando</b> no momento.</div>
<div class="ex">x global = 1. A função g retorna x. A função f cria um x local = 2 e chama g. Estático: g vê o global → 1. Dinâmico: g vê o x de quem chamou (f) → 2.</div>
<div class="resumo">Estático: onde foi definida. Dinâmico: quem chamou.</div>`]
]);
P('parad',[
['Lembre o “símbolo” de cada paradigma.','Prolog usa fatos, regras e consultas.','Isso é o paradigma lógico.'],

]);
