{n:2,q:'No CMMI por estágios, o nível em que a organização controla seus processos com base em métricas e técnicas estatísticas é o:',a:['*nível 4 — Quantitativamente Gerenciado','nível 2 — Gerenciado','nível 3 — Definido','nível 5 — Em Otimização','nível 1 — Inicial'],e:'No 3 os processos são padronizados na organização; no 4 passam a ser controlados quantitativamente; no 5 há melhoria contínua e inovação.'},
{n:3,q:'Uma empresa quer reduzir defeitos em produção. Usando GQM, define a pergunta “Quantos defeitos escapam dos testes?”. A métrica coerente é:',a:['*densidade de defeitos encontrados em produção por KLOC ou por ponto de função entregue','número de linhas escritas por dia','horas extras da equipe','quantidade de reuniões por sprint','número de commits por desenvolvedor'],e:'No GQM a métrica responde à pergunta, que deriva do objetivo. As demais não medem defeitos que escapam.'}]});

S({id:'lfa',nome:'Linguagens Formais e Autômatos',per:6,cr:4,area:'Teoria da computação e compiladores',
trilha:[
['Hierarquia de Chomsky','Tipo 3 regulares (autômato finito) ⊂ tipo 2 livres de contexto (autômato de pilha) ⊂ tipo 1 sensíveis ao contexto (autômato linearmente limitado) ⊂ tipo 0 recursivamente enumeráveis (máquina de Turing).'],
['Linguagens regulares','Reconhecidas por AFD/AFN (equivalentes em poder: construção de subconjuntos) e descritas por expressões regulares. Não contam de forma ilimitada: {a<sup>n</sup>b<sup>n</sup>} não é regular (lema do bombeamento).'],
['Livres de contexto','Gramáticas com regras A → α. Autômato de pilha. Ex.: parênteses balanceados, {a<sup>n</sup>b<sup>n</sup>}. Ambiguidade: mais de uma árvore de derivação para a mesma cadeia. {a<sup>n</sup>b<sup>n</sup>c<sup>n</sup>} não é livre de contexto.'],
['Fechamento','Regulares são fechadas sob união, concatenação, estrela, interseção e complemento. LLCs são fechadas sob união, concatenação e estrela, mas não sob interseção nem complemento.']],
foco:'Ler/construir autômatos, identificar a classe de uma linguagem e propriedades de fechamento.',
q:[
{n:1,q:'Qual máquina reconhece exatamente as linguagens livres de contexto?',a:['*autômato com pilha','autômato finito determinístico','máquina de Turing com fita limitada','transdutor finito','autômato finito não determinístico'],e:'A pilha dá a memória necessária para casar símbolos aninhados.'},
{n:2,q:'A expressão regular <code>(a|b)*abb</code> descreve:',a:['*todas as cadeias sobre {a, b} que terminam em abb','cadeias que começam com abb','cadeias que contêm exatamente um abb','apenas a cadeia abb','cadeias de tamanho par'],e:'(a|b)* aceita qualquer prefixo, seguido obrigatoriamente do sufixo abb.'},
{n:2,q:'A linguagem L = {a<sup>n</sup>b<sup>n</sup> | n ≥ 0} é:',a:['*livre de contexto, mas não regular','regular','sensível ao contexto, mas não livre de contexto','não recursivamente enumerável','finita'],e:'Um autômato finito não consegue contar n ilimitado; uma pilha consegue (empilha a, desempilha com b). Gramática: S → aSb | ε.'},
{n:3,q:'Sobre propriedades de fechamento, avalie:<br>I. A interseção de duas linguagens regulares é regular.<br>II. O complemento de uma linguagem livre de contexto é sempre livre de contexto.<br>III. A interseção de uma linguagem livre de contexto com uma regular é livre de contexto.<br>É correto o que se afirma em:',a:['*I e III, apenas','I, apenas','II, apenas','II e III, apenas','I, II e III'],e:'II é falsa: LLCs não são fechadas sob complemento. III é verdadeira: basta simular o AFD junto com o autômato de pilha (produto).'},
{n:3,q:'Um AFN com 4 estados é convertido em AFD pela construção de subconjuntos. O número máximo de estados do AFD resultante é:',a:['*16','4','8','24','256'],e:'Cada estado do AFD é um subconjunto dos estados do AFN: até 2<sup>4</sup> = 16 (na prática, só os alcançáveis).'}]});

S({id:'tc',nome:'Teoria da Computação',per:8,cr:2,area:'Teoria da computação e compiladores',
trilha:[
['Máquina de Turing e Church-Turing','A MT é o modelo de computação geral. Tese de Church-Turing: tudo o que é efetivamente computável é computável por uma MT.'],
['Decidibilidade','Linguagem decidível: existe MT que sempre para dizendo sim ou não. O <b>problema da parada</b> é indecidível (prova por diagonalização). Redução: se A se reduz a B e A é indecidível, B também é.'],
['Classes P e NP','P: decidíveis em tempo polinomial por MT determinística. NP: soluções verificáveis em tempo polinomial. P ⊆ NP; se P = NP é questão em aberto.'],
['NP-completude','Problema NP-completo: está em NP e todo problema de NP se reduz polinomialmente a ele. SAT foi o primeiro (Cook-Levin). Outros: 3-SAT, clique, cobertura de vértices, caixeiro-viajante (decisão), mochila (decisão), ciclo hamiltoniano. NP-difícil não precisa estar em NP.']],
foco:'Problema da parada, direção correta das reduções e classificar problemas em P, NP, NP-completo.',
q:[
{n:1,q:'O problema da parada (halting problem) é:',a:['*indecidível','decidível em tempo polinomial','NP-completo','decidível em tempo exponencial','regular'],e:'Turing provou que nenhuma MT decide, para toda MT e entrada, se ela para.'},
{n:2,q:'Para provar que um novo problema X é NP-difícil, deve-se:',a:['*reduzir polinomialmente um problema NP-completo conhecido a X','reduzir X a um problema NP-completo conhecido','mostrar um algoritmo exponencial para X','mostrar que X está em P','verificar soluções de X em tempo polinomial'],e:'A redução vai do problema conhecido (difícil) para o novo: se X resolvesse rápido, o difícil também resolveria. Reduzir X a SAT só mostra que X não é mais difícil que SAT.'},
{n:3,q:'Analise as asserções:<br>I. Se for encontrado um algoritmo polinomial para o problema do caixeiro-viajante (versão de decisão), então P = NP.<br><b>PORQUE</b><br>II. O caixeiro-viajante (versão de decisão) é NP-completo, e todo problema em NP se reduz a ele em tempo polinomial.<br>A respeito dessas asserções, assinale a opção correta.',fix:true,a:['*As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.','As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.','A asserção I é verdadeira, e a II é falsa.','A asserção I é falsa, e a II é verdadeira.','As asserções I e II são falsas.'],e:'Resolver um NP-completo em tempo polinomial resolve todos de NP, por composição com as reduções.'}]});

S({id:'comp',nome:'Compiladores',per:7,cr:4,area:'Teoria da computação e compiladores',
trilha:[
['Fases','Análise léxica (tokens, via autômatos/expressões regulares) → sintática (árvore, via gramáticas livres de contexto) → semântica (tipos, escopo, tabela de símbolos) → código intermediário → otimização → geração de código.'],
['Análise sintática','Descendente (top-down, LL(1)): exige gramática sem recursão à esquerda e fatorada; usa conjuntos FIRST e FOLLOW. Ascendente (bottom-up, LR, SLR, LALR): mais poderosa, usada por yacc/bison, com ações shift/reduce.'],
['Erros por fase','Léxico: caractere inválido (ex.: @ solto). Sintático: falta de ; ou parêntese. Semântico: variável não declarada, tipos incompatíveis.'],
['Otimizações','Propagação e dobramento de constantes, eliminação de código morto e de subexpressões comuns, movimentação de código invariante para fora de laços, alocação de registradores.']],
foco:'Classificar erros por fase, eliminar recursão à esquerda, calcular FIRST/FOLLOW e reconhecer otimizações.',
q:[
{n:1,q:'A fase do compilador que agrupa caracteres do código-fonte em tokens é a análise:',a:['*léxica','sintática','semântica','de fluxo de dados','de otimização'],e:'O analisador léxico (scanner) reconhece identificadores, números, palavras reservadas etc.'},
{n:2,q:'Usar uma variável não declarada em Java é detectado em qual fase?',a:['*análise semântica','análise léxica','análise sintática','geração de código','ligação (linking)'],e:'Sintaticamente o identificador é válido; é a consulta à tabela de símbolos que revela a falta de declaração.'},
{n:2,q:'A regra E → E + T | T não pode ser usada diretamente em um analisador LL(1) porque:',a:['*possui recursão à esquerda, que leva o analisador descendente a laço infinito','é ambígua por natureza','não é livre de contexto','possui recursão à direita','não gera nenhuma cadeia'],e:'Reescrevendo: E → T E′ e E′ → + T E′ | ε.'},
{n:3,q:'Transformar <code>for(i=0;i&lt;n;i++){ x = y*z; a[i] = x+i; }</code> em <code>x = y*z; for(i=0;i&lt;n;i++) a[i] = x+i;</code> é um exemplo de:',a:['*movimentação de código invariante de laço','eliminação de código morto','desenrolamento de laço','propagação de cópias','alocação de registradores'],e:'y*z não muda dentro do laço, então pode ser calculado uma vez antes dele.'},
{n:3,q:'Na gramática S → A b, A → a A | ε, o conjunto FIRST(S) é:',a:['*{a, b}','{a}','{b}','{a, ε}','{a, b, ε}'],e:'FIRST(A) = {a, ε}. Como A pode ser vazio, FIRST(S) inclui FIRST(A) − {ε} mais o b que vem depois: {a, b}. S não gera ε.'}]});

S({id:'ia',nome:'Inteligência Artificial',per:7,cr:4,area:'IA e computação visual',
trilha:[
['Agentes e busca','Agente percebe e age no ambiente. Busca cega: largura (completa, ótima com custo uniforme), profundidade (pouca memória, não ótima), custo uniforme. Busca informada: gulosa (só h(n)) e <b>A*</b> (f(n) = g(n) + h(n)), ótima se a heurística for <b>admissível</b> (nunca superestima).'],
['Jogos','Minimax para jogos de soma zero; poda alfa-beta reduz nós sem mudar a decisão.'],
['Representação do conhecimento','Lógica proposicional e de primeira ordem, regras, sistemas especialistas (encadeamento para frente e para trás), ontologias.'],
['Incerteza','Probabilidade condicional e teorema de Bayes: P(A|B) = P(B|A)·P(A)/P(B). Redes bayesianas. Lógica fuzzy para graus de pertinência.']],
foco:'A* e admissibilidade, minimax/alfa-beta, Bayes e busca em espaço de estados.',
q:[
{n:1,q:'No algoritmo A*, a função de avaliação de um nó n é:',a:['*f(n) = g(n) + h(n)','f(n) = h(n)','f(n) = g(n)','f(n) = g(n) × h(n)','f(n) = max(g(n), h(n))'],e:'g(n) é o custo do início até n e h(n) a estimativa de n até o objetivo.'},
{n:2,q:'Uma heurística h é admissível quando:',a:['*nunca superestima o custo real até o objetivo','sempre superestima o custo para acelerar a busca','é igual a zero em todos os nós exceto o objetivo','é calculada pela busca em largura','depende apenas do número de filhos do nó'],e:'Com h admissível, A* (em busca em árvore) encontra a solução ótima. A distância em linha reta em mapas é o exemplo clássico.'},
{n:2,q:'A poda alfa-beta aplicada ao minimax:',a:['*produz a mesma decisão do minimax, avaliando menos nós','pode escolher jogadas piores para ganhar velocidade','só funciona em jogos com sorte','exige heurística admissível','transforma o minimax em busca gulosa'],e:'Ela descarta ramos que comprovadamente não alteram o resultado. Com boa ordenação, explora cerca de O(b<sup>d/2</sup>) nós.'},
{n:3,q:'Uma doença atinge 1% da população. Um teste detecta 90% dos doentes e dá falso positivo em 10% dos sadios. Se o teste deu positivo, a probabilidade de a pessoa estar doente é aproximadamente:',a:['*8,3%','90%','10%','50%','1%'],e:'P(+) = 0,9·0,01 + 0,1·0,99 = 0,009 + 0,099 = 0,108. P(D|+) = 0,009/0,108 ≈ 0,083. A baixa prevalência derruba o valor.'}]});

S({id:'ia2',nome:'Inteligência Artificial II',per:8,cr:4,area:'IA e computação visual',
trilha:[
['Aprendizado de máquina','<b>Supervisionado</b> (dados rotulados: classificação e regressão), <b>não supervisionado</b> (agrupamento, como k-means; redução de dimensionalidade, como PCA) e <b>por reforço</b> (agente aprende por recompensas).'],
['Algoritmos clássicos','k-NN, árvores de decisão (ganho de informação/entropia), Naive Bayes, regressão linear e logística, SVM, random forest.'],
['Avaliação','Separar treino, validação e teste; validação cruzada k-fold. <b>Overfitting</b>: ótimo no treino, ruim no teste (regularização, mais dados, dropout). Métricas: acurácia, precisão = VP/(VP+FP), revocação = VP/(VP+FN), F1. Matriz de confusão.'],
['Redes neurais','Perceptron simples só separa classes linearmente (não resolve XOR). Redes multicamadas treinadas por retropropagação e gradiente descendente. CNNs para imagens, RNN/Transformers para sequências. Algoritmos genéticos: seleção, cruzamento e mutação.']],
foco:'Tipo de aprendizado por cenário, overfitting, cálculo de precisão e revocação, limitação do perceptron.',
q:[
{n:1,q:'Agrupar clientes por padrões de compra, sem rótulos prévios, é uma tarefa de aprendizado:',a:['*não supervisionado','supervisionado','por reforço','semi-supervisionado obrigatório','simbólico dedutivo'],e:'Não há rótulo-alvo; algoritmos como k-means descobrem os grupos.'},
{n:2,q:'Um modelo tem 99% de acurácia no treino e 65% no teste. O fenômeno e uma medida adequada são:',a:['*overfitting; aplicar regularização ou obter mais dados','underfitting; aumentar a complexidade do modelo','overfitting; treinar por mais épocas','vazamento de dados; remover o conjunto de teste','nenhum problema; o modelo está pronto'],e:'O modelo memorizou o treino e não generaliza. Regularização, mais dados, early stopping e modelos mais simples ajudam.'},
{n:2,q:'Um classificador de spam obteve VP = 80, FP = 20, FN = 40. A precisão e a revocação são, respectivamente:',a:['*80% e aproximadamente 66,7%','66,7% e 80%','80% e 80%','50% e 66,7%','60% e 40%'],e:'Precisão = 80/(80+20) = 0,8. Revocação = 80/(80+40) ≈ 0,667.'},
{n:3,q:'Analise as asserções:<br>I. Um perceptron de camada única não consegue aprender a função XOR.<br><b>PORQUE</b><br>II. O perceptron de camada única só consegue representar fronteiras de decisão lineares, e as classes do XOR não são linearmente separáveis.<br>A respeito dessas asserções, assinale a opção correta.',fix:true,a:['*As asserções I e II são verdadeiras, e a II é uma justificativa correta da I.','As asserções I e II são verdadeiras, mas a II não é uma justificativa correta da I.','A asserção I é verdadeira, e a II é falsa.','A asserção I é falsa, e a II é verdadeira.','As asserções I e II são falsas.'],e:'Uma reta não separa (0,1),(1,0) de (0,0),(1,1). Com uma camada oculta (MLP), o XOR é aprendido.'}]});

S({id:'simul',nome:'Simulação Discreta',per:'Eletiva',cr:4,el:true,area:'IA e computação visual',
trilha:[
['Conceitos','Simulação de eventos discretos: o estado muda em instantes específicos (chegadas, partidas). Componentes: entidades, recursos, filas, eventos, relógio de simulação.'],
['Números aleatórios','Geradores pseudoaleatórios (congruencial linear). Geração de variáveis por transformada inversa. Distribuições: exponencial (tempo entre chegadas), Poisson (número de chegadas), normal, uniforme.'],
['Teoria de filas','Notação de Kendall A/B/c. Fila M/M/1: utilização ρ = λ/μ (precisa ser &lt; 1); número médio no sistema L = ρ/(1 − ρ). Lei de Little: L = λ·W.'],
['Validação e análise','Verificação (o modelo foi implementado corretamente) × validação (representa o sistema real). Aquecimento (warm-up), replicações e intervalos de confiança.']],
foco:'Fila M/M/1, Lei de Little e distribuições de chegada.',
q:[
{n:1,q:'Em simulação de filas, o tempo entre chegadas de clientes em um processo de Poisson segue a distribuição:',a:['*exponencial','normal','uniforme discreta','binomial','triangular'],e:'Se o número de chegadas por intervalo é Poisson, os intervalos entre chegadas são exponenciais.'},
{n:2,q:'Em uma fila M/M/1 chegam 8 clientes/hora e o servidor atende 10 clientes/hora. A utilização do servidor é:',a:['*80%','125%','20%','8%','100%'],e:'ρ = λ/μ = 8/10 = 0,8.'},
{n:3,q:'Em um caixa, chegam em média 12 clientes por hora e cada cliente permanece no sistema em média 15 minutos. Pela Lei de Little, o número médio de clientes no sistema é:',a:['*3','12','180','0,8','48'],e:'L = λ·W = 12 clientes/h × 0,25 h = 3 clientes.'}]});
// Computação visual, desenvolvimento, sociedade
S({id:'cg',nome:'Computação Gráfica',per:7,cr:4,area:'IA e computação visual',
trilha:[
['Transformações geométricas','Translação, rotação e escala. Com <b>coordenadas homogêneas</b> (x, y, 1), todas viram multiplicações de matrizes 3×3 (2D) ou 4×4 (3D) e podem ser compostas. A ordem importa: rotação seguida de translação ≠ translação seguida de rotação.'],
['Pipeline gráfico','Modelagem → visualização (câmera) → projeção (perspectiva ou ortogonal) → recorte → rasterização → fragmentos/sombreamento → teste de profundidade (z-buffer) → imagem.'],
['Rasterização','Algoritmo de Bresenham para retas (só inteiros), preenchimento de polígonos, antialiasing.'],
['Iluminação e cor','Modelo de Phong: ambiente + difusa + especular. Sombreamento flat, Gouraud (interpola cores) e Phong (interpola normais). Modelos de cor: RGB (aditivo, telas), CMYK (subtrativo, impressão), HSV.']],
foco:'Matrizes de transformação em coordenadas homogêneas, ordem de composição, z-buffer e modelos de cor.',
q:[
{n:1,q:'O modelo de cores aditivo, usado em monitores, é o:',a:['*RGB','CMYK','HSV','YCbCr apenas para impressão','Pantone'],e:'Em telas, a luz vermelha, verde e azul se soma; CMYK é subtrativo, para pigmentos.'},
{n:2,q:'Coordenadas homogêneas são usadas em computação gráfica principalmente para:',a:['*representar translação como multiplicação de matrizes, permitindo compor todas as transformações','aumentar a resolução da imagem','eliminar a necessidade de projeção','representar cores em ponto flutuante','acelerar o algoritmo de Bresenham'],e:'Em 2D cartesiano a translação é uma soma, não um produto. Com (x, y, 1) ela vira uma matriz 3×3.'},
{n:3,q:'Aplicando ao ponto (1, 0) uma rotação de 90° no sentido anti-horário em torno da origem e, em seguida, uma translação de (2, 3), obtém-se:',a:['*(2, 4)','(3, 3)','(−3, 3)','(0, 1)','(2, 3)'],e:'Rotação de 90°: (x, y) → (−y, x), logo (1, 0) → (0, 1). Translação: (0 + 2, 1 + 3) = (2, 4). Na ordem inversa o resultado seria (−3, 3).'}]});

S({id:'pi',nome:'Processamento de Imagens',per:6,cr:4,area:'IA e computação visual',
trilha:[
['Imagem digital','Matriz de pixels. Resolução espacial (quantidade de pixels) e de intensidade (bits por pixel: 8 bits = 256 níveis de cinza). Imagem colorida RGB 24 bits.'],
['Histograma e realce','O histograma mostra a distribuição de intensidades. Equalização espalha os níveis para melhorar o contraste. Limiarização (thresholding) binariza a imagem; o método de Otsu escolhe o limiar automaticamente.'],
['Filtragem espacial','Convolução com máscaras. Filtro da <b>média</b>: suaviza, borra bordas. Filtro da <b>mediana</b>: ótimo contra ruído sal e pimenta, preserva bordas. Detectores de bordas (passa-alta): Sobel, Prewitt, Laplaciano, Canny.'],
['Morfologia e frequência','Erosão (encolhe objetos), dilatação (expande), abertura (erosão + dilatação, remove ruídos pequenos), fechamento (dilatação + erosão, fecha buracos). A transformada de Fourier leva ao domínio da frequência.']],
foco:'Escolher o filtro certo para o ruído, operações morfológicas e cálculo de tamanho de imagem.',
q:[
{n:1,q:'Uma imagem em tons de cinza de 8 bits por pixel pode representar quantos níveis de intensidade?',a:['*256','8','255','128','512'],e:'2<sup>8</sup> = 256 níveis (0 a 255).'},
{n:2,q:'Para remover ruído do tipo sal e pimenta preservando bordas, o filtro mais adequado é o da:',a:['*mediana','média','Laplaciano','Sobel','passa-alta ideal'],e:'A mediana descarta valores extremos isolados sem a borragem da média.'},
{n:2,q:'Quanto ocupa, sem compressão, uma imagem RGB de 1000 × 1000 pixels com 8 bits por canal?',a:['*3 MB (3 milhões de bytes)','1 MB','8 MB','24 MB','300 KB'],e:'1.000.000 pixels × 3 bytes = 3.000.000 bytes.'},
{n:3,q:'Em uma imagem binária com pequenos pontos brancos de ruído espalhados pelo fundo, a operação morfológica mais adequada para eliminá-los, mantendo o tamanho aproximado dos objetos grandes, é a:',a:['*abertura (erosão seguida de dilatação)','fechamento (dilatação seguida de erosão)','dilatação apenas','erosão apenas, repetida várias vezes','equalização do histograma'],e:'A erosão apaga os pontos pequenos; a dilatação seguinte devolve aos objetos grandes seu tamanho. O fechamento serve para preencher buracos.'}]});

S({id:'web',nome:'Programação Web',per:4,cr:4,area:'Desenvolvimento e interação',
trilha:[
['HTTP','Protocolo sem estado (stateless). Métodos: GET (ler, idempotente), POST (criar), PUT (substituir, idempotente), PATCH (alterar parcial), DELETE (remover, idempotente). Códigos: 2xx sucesso, 3xx redirecionamento, 4xx erro do cliente (404, 401, 403), 5xx erro do servidor. Estado mantido por cookies, sessões ou tokens (JWT).'],
['Front-end','HTML (estrutura e semântica), CSS (apresentação, box model, flexbox, grid, responsividade com media queries), JavaScript (comportamento, DOM, eventos, assíncrono com Promises/async-await, fetch).'],
['Back-end e APIs','APIs REST: recursos identificados por URIs, verbos HTTP, representação JSON, sem estado no servidor. MVC separa modelo, visão e controle. CORS controla requisições entre origens.'],
['Segurança web','Valide no servidor, use HTTPS, proteja contra XSS, CSRF e SQL injection.']],
foco:'Métodos e códigos HTTP, princípios REST e o modelo assíncrono do JavaScript.',
q:[
{n:1,q:'O código de status HTTP 404 indica:',a:['*recurso não encontrado','erro interno do servidor','requisição bem-sucedida','acesso não autorizado por falta de autenticação','redirecionamento permanente'],e:'4xx são erros do cliente; 404 = Not Found. 500 é erro interno; 401, não autenticado.'},
{n:2,q:'Em uma API REST, a requisição mais adequada para remover o produto de id 42 é:',a:['*DELETE /produtos/42','GET /produtos/remover?id=42','POST /removerProduto/42','PUT /produtos/42/delete','GET /produtos/42?acao=delete'],e:'REST usa o verbo HTTP para a ação e a URI para o recurso. GET nunca deve alterar estado.'},
{n:2,q:'O fato de o protocolo HTTP ser stateless significa que:',a:['*cada requisição é independente e o servidor não guarda, por padrão, informações de requisições anteriores','o servidor não pode usar banco de dados','não é possível implementar login','as conexões TCP nunca são reutilizadas','o cliente não pode enviar cabeçalhos'],e:'Por isso se usam cookies, sessões e tokens para manter o contexto do usuário.'},
{n:3,q:'Qual a ordem de impressão no console?<pre>console.log("A");\nsetTimeout(() =&gt; console.log("B"), 0);\nPromise.resolve().then(() =&gt; console.log("C"));\nconsole.log("D");</pre>',a:['*A, D, C, B','A, B, C, D','A, D, B, C','A, C, D, B','D, A, C, B'],e:'O código síncrono roda primeiro (A, D). Depois a fila de microtarefas (Promises: C) e só então as macrotarefas (setTimeout: B), mesmo com atraso 0.'}]});

S({id:'mobile',nome:'Programação para Dispositivos Móveis',per:5,cr:4,area:'Desenvolvimento e interação',
trilha:[
['Abordagens','Nativo (Kotlin/Java no Android, Swift no iOS): melhor desempenho e acesso ao hardware. Multiplataforma (Flutter, React Native): um código para várias plataformas. Web/PWA: roda no navegador.'],
['Ciclo de vida','No Android, a Activity passa por onCreate, onStart, onResume, onPause, onStop e onDestroy. Rotação de tela recria a Activity: salve o estado (ViewModel, onSaveInstanceState).'],
['Restrições do dispositivo','Bateria, memória, rede instável e telas variadas. Nunca bloqueie a thread principal (UI) com rede ou disco: use corrotinas, threads ou tarefas assíncronas, sob risco de ANR (app não responde).'],
['Permissões e armazenamento','Permissões em tempo de execução para câmera, localização etc. Armazenamento local: SharedPreferences/DataStore, SQLite/Room. Notificações push.']],
foco:'Ciclo de vida da Activity, thread principal e escolha entre nativo e multiplataforma.',
q:[
{n:1,q:'No Android, o método do ciclo de vida chamado quando a Activity é criada pela primeira vez é:',a:['*onCreate()','onResume()','onStart()','onPause()','onDestroy()'],e:'Em onCreate inicializa-se a interface e os componentes.'},
{n:2,q:'Um app Android faz uma requisição de rede longa diretamente na thread principal. A consequência provável é:',a:['*a interface travar e o sistema exibir o aviso de app que não responde (ANR)','o app ficar mais rápido','a requisição ser cancelada pelo compilador','nenhuma, pois a rede é sempre assíncrona','a bateria durar mais'],e:'A thread principal desenha a UI; bloqueá-la congela a tela. O Android inclusive lança NetworkOnMainThreadException.'},
{n:3,q:'Uma empresa precisa lançar rapidamente um app para Android e iOS com equipe pequena, sem uso intensivo de recursos específicos de hardware. A abordagem mais adequada é:',a:['*um framework multiplataforma, como Flutter ou React Native, com base de código única','dois apps nativos desenvolvidos em paralelo','apenas um app nativo Android','um app em Assembly para máximo desempenho','um site sem responsividade'],e:'Multiplataforma reduz custo e tempo. Nativo vale mais quando há exigência alta de desempenho ou acesso profundo ao hardware.'}]});

S({id:'ihc',nome:'Interação Humano-Computador',per:6,cr:2,area:'Desenvolvimento e interação',
trilha:[
['Usabilidade','ISO 9241-11: eficácia, eficiência e satisfação em um contexto de uso. Acessibilidade: WCAG (perceptível, operável, compreensível, robusto).'],
['Heurísticas de Nielsen','1 visibilidade do status do sistema, 2 correspondência com o mundo real, 3 controle e liberdade do usuário, 4 consistência e padrões, 5 prevenção de erros, 6 reconhecimento em vez de memorização, 7 flexibilidade e eficiência, 8 design estético e minimalista, 9 ajudar a reconhecer, diagnosticar e recuperar erros, 10 ajuda e documentação.'],
['Design centrado no usuário','Ciclo: entender o contexto, especificar requisitos, prototipar (baixa e alta fidelidade), avaliar. Personas e cenários.'],
['Avaliação','Por inspeção, sem usuários (avaliação heurística, percurso cognitivo) e por observação, com usuários (testes de usabilidade, pensar em voz alta).']],
foco:'Associar um problema de interface à heurística de Nielsen violada e diferenciar métodos de avaliação.',
q:[
{n:1,q:'Uma barra de progresso exibida durante o envio de um arquivo atende principalmente à heurística de:',a:['*visibilidade do status do sistema','prevenção de erros','flexibilidade e eficiência de uso','design minimalista','ajuda e documentação'],e:'O usuário precisa saber o que está acontecendo, com feedback em tempo razoável.'},
{n:2,q:'Um sistema não oferece botão de desfazer após excluir um e-mail. Qual heurística é violada?',a:['*controle e liberdade do usuário','visibilidade do status do sistema','consistência e padrões','reconhecimento em vez de memorização','design estético e minimalista'],e:'Usuários erram; precisam de “saídas de emergência” como desfazer e cancelar.'},
{n:3,q:'A avaliação heurística difere do teste de usabilidade porque:',a:['*é feita por especialistas inspecionando a interface, sem a participação de usuários reais','exige pelo menos 30 usuários finais','só pode ser aplicada após o lançamento do produto','mede apenas o tempo de resposta do servidor','substitui totalmente qualquer teste com usuários'],e:'É um método de inspeção barato e rápido. Testes com usuários revelam problemas que especialistas podem não prever; os métodos se complementam.'}]});

S({id:'infsoc',nome:'Informática e Sociedade',per:6,cr:2,area:'Computação e sociedade',
trilha:[
['Ética e profissão','Responsabilidade do profissional de computação pelos impactos de seus sistemas. Códigos de ética (ACM, SBC): honestidade, privacidade, evitar danos.'],
['Privacidade e LGPD','Lei 13.709/2018. Bases legais para tratamento (consentimento é uma delas, não a única). Direitos do titular: acesso, correção, eliminação, portabilidade. Princípios: finalidade, necessidade (minimização), transparência, segurança. ANPD fiscaliza. Dados sensíveis (saúde, biometria, origem racial, religião etc.) têm proteção reforçada.'],
['Marco Civil e direitos','Marco Civil da Internet (Lei 12.965/2014): neutralidade de rede, guarda de registros, liberdade de expressão. Propriedade intelectual: software é protegido por direito autoral (Lei 9.609/98); licenças livres (GPL, MIT).'],
['Impactos sociais','Exclusão digital, automação e trabalho, vieses algorítmicos, desinformação, sustentabilidade e lixo eletrônico. Esses temas também aparecem na Formação Geral do ENADE.']],
foco:'LGPD aplicada a cenários, viés algorítmico e responsabilidade ética. Questões discursivas costumam explorar esses temas.',
q:[
{n:1,q:'No Brasil, a lei que regula o tratamento de dados pessoais é a:',a:['*Lei Geral de Proteção de Dados (Lei 13.709/2018)','Lei de Software (Lei 9.609/1998)','Lei de Acesso à Informação (Lei 12.527/2011)','Código de Defesa do Consumidor','Lei de Direitos Autorais (Lei 9.610/1998)'],e:'A LGPD foi inspirada no GDPR europeu e é fiscalizada pela ANPD.'},
{n:2,q:'Um sistema de triagem de currículos treinado com contratações antigas passa a rejeitar candidatas mulheres com mais frequência. Esse problema é melhor descrito como:',a:['*viés algorítmico herdado dos dados históricos de treinamento','falha de hardware do servidor','excesso de dados de treinamento','erro de compilação do modelo','vulnerabilidade de SQL injection'],e:'O modelo reproduz padrões discriminatórios presentes nos dados. É preciso auditar dados e resultados, e a LGPD garante revisão de decisões automatizadas.'},
{n:3,q:'Sobre a LGPD, avalie:<br>I. O consentimento do titular é a única base legal que autoriza o tratamento de dados pessoais.<br>II. O titular tem direito de solicitar a eliminação de dados tratados com base em seu consentimento.<br>III. Dados sobre saúde são classificados como dados pessoais sensíveis.<br>É correto o que se afirma em:',a:['*II e III, apenas','I, apenas','I e II, apenas','I e III, apenas','I, II e III'],e:'I está errada: a lei prevê dez bases legais, como cumprimento de obrigação legal, execução de contrato e legítimo interesse.'}]});

S({id:'infedu',nome:'Informática na Educação',per:6,cr:4,area:'Computação e sociedade',
trilha:[
['Teorias de aprendizagem','Behaviorismo (estímulo-resposta, instrução programada), construtivismo de Piaget (o aluno constrói o conhecimento), socioconstrutivismo de Vygotsky (zona de desenvolvimento proximal, papel da mediação) e construcionismo de Papert (aprender construindo artefatos, linguagem Logo).'],
['Tecnologias educacionais','Ambientes virtuais de aprendizagem (Moodle), objetos de aprendizagem, gamificação, sistemas tutores inteligentes, ensino híbrido e sala de aula invertida.'],
['Pensamento computacional','Pilares: decomposição, reconhecimento de padrões, abstração e algoritmos. A BNCC incorpora computação na educação básica.'],
['Inclusão','Tecnologias assistivas e acessibilidade digital ampliam o acesso. Desenho universal para a aprendizagem.']],
foco:'Associar teorias (Piaget, Vygotsky, Papert) a práticas com tecnologia e conhecer os pilares do pensamento computacional.',
q:[
{n:1,q:'O construcionismo, que propõe que o aluno aprende construindo artefatos com o computador, como na linguagem Logo, foi proposto por:',a:['*Seymour Papert','Jean Piaget','B. F. Skinner','Lev Vygotsky','Paulo Freire'],e:'Papert, discípulo de Piaget, criou o Logo e o conceito de construcionismo.'},
{n:2,q:'Quebrar um problema complexo em partes menores e mais fáceis de resolver é qual pilar do pensamento computacional?',a:['*decomposição','abstração','reconhecimento de padrões','algoritmo','depuração'],e:'Abstração foca no essencial; padrões identificam semelhanças; algoritmo define passos.'},
{n:3,q:'Um professor organiza duplas em que um aluno mais experiente apoia o outro em uma atividade de programação que este ainda não faria sozinho. A prática se apoia principalmente no conceito de:',a:['*zona de desenvolvimento proximal, de Vygotsky','condicionamento operante, de Skinner','estágios do desenvolvimento cognitivo, de Piaget','instrução programada','inteligências múltiplas, de Gardner'],e:'A ZDP é a distância entre o que o aluno faz sozinho e o que faz com ajuda de alguém mais experiente.'}]});

</script>
<script>
const BY={};SUBJ.forEach(s=>{BY[s.id]=s;s.q.forEach((q,i)=>{q.id=s.id+'-'+i;q.sid=s.id;})});
const ALLQ=SUBJ.flatMap(s=>s.q);
const EXAM=new Date(2026,10,29);
const PLAN=[
 ['2026-11-15',['intro','matcomp','alg1'],'Comece leve: base numérica, lógica e teste de mesa.'],
 ['2026-11-16',['alg2','parad','poo'],'Recursão, ordenação e polimorfismo caem muito em código.'],
 ['2026-11-17',['ed','grafos'],'Dia pesado: refaça Dijkstra e percursos à mão.'],
 ['2026-11-18',['circ','psd','arq'],'Projeto de Sistemas Digitais é eletiva: só se você cursou.'],
 ['2026-11-19',['orgcomp','embarc','calcnum'],'Sistemas Embarcados é eletiva: priorize Organização.'],
 ['2026-11-20',['so','sd'],'SO é das áreas mais cobradas. Faça todas as questões.'],
 ['2026-11-21',['redes','redes2','seg'],'Treine sub-redes até ficar automático.'],
 ['2026-11-22',['bd','bd2'],'Escreva as consultas SQL antes de olhar as alternativas.'],
 ['2026-11-23',['es1','es2','mps'],'Associe cada processo e técnica a um cenário.'],
 ['2026-11-24',['lfa','tc','comp'],'Teoria: cuidado com a direção das reduções.'],
 ['2026-11-25',['ia','ia2','simul'],'Simulação Discreta é eletiva.'],
 ['2026-11-26',['web','mobile','ihc','cg','pi'],'Matérias mais curtas: um bloco de trilha + quiz para cada.'],
 ['2026-11-27',['infsoc','infedu'],'Depois das trilhas, faça um simulado de 20 questões.',true],
 ['2026-11-28',[],'Simulado completo pela manhã. À tarde, só a aba “Meus erros”. À noite, descanse.',true],
 ['2026-11-29',[],'Dia da prova.',false,true]
];
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
// ---------- estado (localStorage, opcional) ----------
let ST={read:{},ans:{}};
try{const r=localStorage.getItem('enade26');if(r)ST=Object.assign(ST,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('enade26',JSON.stringify(ST))}catch(e){}}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function stat(s){const steps=s.trilha.length,read=s.trilha.filter((_,i)=>ST.read[s.id+':'+i]).length;
  const tried=s.q.filter(q=>ST.ans[q.id]!==undefined).length,right=s.q.filter(q=>ST.ans[q.id]===1).length;
  const frac=(read/steps)*.4+(tried/s.q.length)*.6;return{steps,read,tried,right,n:s.q.length,frac,done:read===steps&&tried===s.q.length}}
function header(){
  const d=Math.round((EXAM-today())/864e5);const c=document.getElementById('count');
  c.innerHTML=d>0?`<b>${d}</b><span>${d===1?'dia':'dias'} para a prova<br>29 nov · domingo</span>`:d===0?`<b>Hoje</b><span>é a prova.<br>Boa sorte!</span>`:`<b>✓</b><span>ENADE 2026<br>realizado</span>`;
  let f=0;SUBJ.forEach(s=>f+=stat(s).frac);const pct=Math.round(f/SUBJ.length*100);
  const right=ALLQ.filter(q=>ST.ans[q.id]===1).length,tried=ALLQ.filter(q=>ST.ans[q.id]!==undefined).length;
  document.getElementById('pval').textContent=`${pct}% · ${right}/${tried} acertos em ${ALLQ.length} questões`;
  document.getElementById('pbar').style.width=pct+'%';
}
const $v=()=>document.getElementById('view');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chip(id){const s=BY[id],t=stat(s);const cls=t.done?'done':(t.frac>0?'half':'');return `<a class="chip ${cls}" href="#m-${id}"><span class="dot"></span>${esc(s.nome)}${s.el?' <span class="tag warn">eletiva</span>':''}</a>`}
// ---------- Cronograma ----------
function vCron(){
  const t=ymd(today());
  let h=`<div><h2>Cronograma de revisão</h2><p class="lead">De 15 a 28 de novembro, agrupado por área. Cada dia leva de 2 a 4 horas: leia a trilha, marque os passos que entendeu e faça o quiz. A bolinha de cada matéria fica amarela quando você começa e verde quando termina.</p></div><div class="days">`;
  PLAN.forEach(([ds,ids,note,sim,exam])=>{
    const d=new Date(ds+'T12:00');const cls=ds===t?'today':(ds<t?'past':'');
    const done=ids.length&&ids.every(i=>stat(BY[i]).done);
    h+=`<div class="day ${cls}"><div class="date"><small>${WD[d.getDay()]}</small><b>${d.getDate()}</b><small>nov</small></div><div class="body">
    <div class="head"><h3>${exam?'ENADE':ids.length?ids.length+' '+(ids.length>1?'matérias':'matéria'):'Simulado e revisão'}</h3>${ds===t?'<span class="tag">hoje</span>':''}${done?'<span class="tag ok">concluído</span>':''}</div>
    ${ids.length?`<div class="chips">${ids.map(chip).join('')}</div>`:''}
    <p class="note">${esc(note)}</p>
    ${sim?`<div class="row"><a class="btn" href="#simulado">Abrir simulado</a><a class="btn ghost" href="#erros">Revisar erros</a></div>`:''}
    ${exam?`<ul class="tips"><li>Leve documento oficial com foto e caneta esferográfica preta, de material transparente.</li><li>Confira no Cartão de Informação do Inep o local e o horário dos portões.</li><li>A prova tem Formação Geral e Componente Específico, com questões objetivas e discursivas. Leia o texto-base antes das alternativas.</li><li>Em “asserção I PORQUE asserção II”, julgue cada uma separadamente e só depois a relação entre elas.</li></ul>`:''}
    </div></div>`;
  });
  $v().innerHTML=h+'</div>';
}
// ---------- Trilhas ----------
function vTrilhas(){
  const areas=[...new Set(SUBJ.map(s=>s.area))];
  let h=`<div><h2>Trilhas por matéria</h2><p class="lead">As disciplinas de computação com créditos da sua matriz, agrupadas pelas áreas que o ENADE cobra. Ficaram de fora as disciplinas gerais (Cálculo, Álgebra, Estatística, Ética Ambiental, Pesquisa, Gestão, Empreendedorismo, Libras, TCC e Extensão).</p></div>`;
  areas.forEach(a=>{
    h+=`<section class="area"><div class="eyebrow">${esc(a)}</div><div class="cards">`;
    SUBJ.filter(s=>s.area===a).forEach(s=>{const t=stat(s);
      h+=`<a class="card" href="#m-${s.id}"><h3>${esc(s.nome)}</h3><div class="meta"><span>${typeof s.per==='number'?s.per+'º período':'Eletiva'}</span><span>${s.cr} créditos</span><span>${t.right}/${t.n} acertos</span></div><div class="bar"><i style="width:${Math.round(t.frac*100)}%;${t.done?'background:var(--ok)':''}"></i></div></a>`});
    h+='</div></section>';
  });
  $v().innerHTML=h;
}
// ---------- Matéria ----------
let QZ=null;
function vMateria(id){
  const s=BY[id];if(!s){location.hash='#trilhas';return}
  const lv={1:0,2:0,3:0};s.q.forEach(q=>lv[q.n]++);
  let h=`<a class="back" href="#trilhas">← Todas as trilhas</a>
  <div><div class="eyebrow">${esc(s.area)} · ${typeof s.per==='number'?s.per+'º período':'Eletiva'} · ${s.cr} créditos</div><h2>${esc(s.nome)}</h2></div>
  <div class="focus"><b>O que mais cai:</b> ${s.foco}</div>
  <section class="steps">${s.trilha.map(([t,c],i)=>{const k=s.id+':'+i,on=!!ST.read[k];return `<div class="step ${on?'read':''}"><div class="sh"><h3>${t}</h3></div><div class="txt">${c}</div><label class="check"><input type="checkbox" id="rd-${k.replace(':','-')}" data-k="${k}" ${on?'checked':''}> Entendi este passo</label></div>`}).join('')}</section>
  <section style="display:grid;gap:12px"><h2>Quiz</h2><p class="muted">${s.q.length} questões: ${lv[1]} fáceis, ${lv[2]} médias e ${lv[3]} difíceis. As alternativas são embaralhadas a cada tentativa.</p>
  <div class="row"><div class="seg" role="group" aria-label="Dificuldade">
   <button data-l="0" aria-pressed="true">Todas</button><button data-l="1" aria-pressed="false">Fácil</button><button data-l="2" aria-pressed="false">Médio</button><button data-l="3" aria-pressed="false">Difícil</button></div>
   <button class="btn primary" id="go">Começar quiz</button></div>
  <div id="qz"></div></section>`;
  $v().innerHTML=h;
  let L=0;
  $v().querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{L=+b.dataset.l;$v().querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $v().querySelectorAll('.check input').forEach(c=>c.onchange=()=>{ST.read[c.dataset.k]=c.checked;if(!c.checked)delete ST.read[c.dataset.k];save();c.closest('.step').classList.toggle('read',c.checked);header()});
  document.getElementById('go').onclick=()=>{const qs=s.q.filter(q=>!L||q.n===L).sort((a,b)=>a.n-b.n);startQuiz(qs,document.getElementById('qz'),'Quiz de '+s.nome)};
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LV={1:'Fácil',2:'Médio',3:'Difícil'};
function startQuiz(qs,el,title){
  if(!qs.length){el.innerHTML='<div class="empty">Nenhuma questão neste filtro.</div>';return}
  QZ={qs,i:0,res:[],el,title};renderQ();el.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderQ(){
  const z=QZ,q=z.qs[z.i];
  const alts=q.a.map((t,k)=>({t:t.replace(/^\*/,''),ok:t[0]==='*'}));
  const order=q.fix?alts:shuffle(alts);
  z.el.innerHTML=`<div class="quiz"><div class="qhead"><span>Questão ${z.i+1} de ${z.qs.length} · ${esc(BY[q.sid].nome)}</span><span class="lvl l${q.n}">${LV[q.n]}</span></div>
  <div class="qtext">${q.q}</div><div class="alts">${order.map((a,k)=>`<button class="alt" data-ok="${a.ok?1:0}"><span class="bub">${'ABCDE'[k]}</span><span>${a.t}</span></button>`).join('')}</div><div id="fb"></div></div>`;
  z.el.querySelectorAll('.alt').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.ok==='1';z.el.querySelectorAll('.alt').forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('right')});
    if(!ok)b.classList.add('wrong');ST.ans[q.id]=ok?1:0;save();header();z.res.push({q,ok});
    const last=z.i===z.qs.length-1;
    document.getElementById('fb').innerHTML=`<div class="expl ${ok?'ok':'bad'}"><b>${ok?'Correto.':'Incorreto.'}</b> ${q.e}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="nx">${last?'Ver resultado':'Próxima questão'}</button></div>`;
    document.getElementById('nx').onclick=()=>{if(last)renderScore();else{z.i++;renderQ()}};
    document.getElementById('nx').focus({preventScroll:true});
  });
}
function renderScore(){
  const z=QZ,r=z.res.filter(x=>x.ok).length,n=z.res.length,p=Math.round(r/n*100);
  const by={};z.res.forEach(x=>{const k=x.q.sid;by[k]=by[k]||[0,0];by[k][1]++;if(x.ok)by[k][0]++});
  const multi=Object.keys(by).length>1;
  const msg=p>=80?'Ótimo domínio. Siga para a próxima matéria.':p>=60?'Bom. Releia a explicação das que errou e tente de novo amanhã.':'Vale reler a trilha e refazer o quiz antes de avançar.';
  z.el.innerHTML=`<div class="quiz score"><div class="eyebrow">${esc(z.title)}</div><div><span class="big">${r}/${n}</span> <span class="muted">· ${p}% de acerto</span></div><p>${msg}</p>
  ${multi?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Matéria</th><th style="text-align:right">Acertos</th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[a,b]])=>`<tr><td><a class="back" href="#m-${k}">${esc(BY[k].nome)}</a></td><td class="n">${a}/${b}</td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="row"><button class="btn primary" id="again">Refazer</button>${r<n?'<a class="btn" href="#erros">Revisar erros</a>':''}</div></div>`;
  document.getElementById('again').onclick=()=>startQuiz(z.qs,z.el,z.title);
}
// ---------- Simulado ----------
function vSim(){
  $v().innerHTML=`<div><h2>Simulado misto</h2><p class="lead">Questões sorteadas de todas as matérias, com mistura de dificuldades parecida com a do ENADE (cerca de 30% fáceis, 40% médias e 30% difíceis). Ao final você vê quais matérias precisam de mais revisão.</p></div>
  <div class="row"><div class="seg" role="group" aria-label="Tamanho"><button data-n="10" aria-pressed="false">10 questões</button><button data-n="20" aria-pressed="true">20 questões</button><button data-n="30" aria-pressed="false">30 questões</button></div>
  <label class="check" style="color:var(--ink)"><input type="checkbox" id="noel"> Sem eletivas</label>
  <button class="btn primary" id="go">Sortear simulado</button></div><div id="qz"></div>`;
  let N=20;$v().querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{N=+b.dataset.n;$v().querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  document.getElementById('go').onclick=()=>{
    const pool=ALLQ.filter(q=>!(document.getElementById('noel').checked&&BY[q.sid].el));
    const want={1:Math.round(N*.3),3:Math.round(N*.3)};want[2]=N-want[1]-want[3];
    let pick=[];[1,2,3].forEach(l=>{pick=pick.concat(shuffle(pool.filter(q=>q.n===l)).slice(0,want[l]))});
    startQuiz(shuffle(pick),document.getElementById('qz'),'Simulado de '+N+' questões');
  };
}
// ---------- Erros ----------
function vErros(){
  const wr=ALLQ.filter(q=>ST.ans[q.id]===0);
  let h=`<div><h2>Meus erros</h2><p class="lead">Questões cuja última resposta foi errada. Ao acertar, elas saem desta lista.</p></div>`;
  if(!wr.length){$v().innerHTML=h+`<div class="empty">Nenhum erro registrado por enquanto. Faça os quizzes do cronograma e as questões que você errar aparecem aqui para revisão.</div>`;return}
  const by={};wr.forEach(q=>(by[q.sid]=by[q.sid]||[]).push(q));
  h+=`<div class="row"><button class="btn primary" id="go">Refazer as ${wr.length} questões</button></div><div class="chips">${Object.keys(by).map(k=>`<a class="chip" href="#m-${k}">${esc(BY[k].nome)} <span class="tag">${by[k].length}</span></a>`).join('')}</div><div id="qz"></div>`;
  $v().innerHTML=h;document.getElementById('go').onclick=()=>startQuiz(shuffle(wr),document.getElementById('qz'),'Revisão de erros');
}
// ---------- rotas ----------
function route(){
  const h=(location.hash||'#cronograma').slice(1);
  const v=h.startsWith('m-')?'trilhas':h;
  document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  QZ=null;
  if(h.startsWith('m-'))vMateria(h.slice(2));else if(h==='trilhas')vTrilhas();else if(h==='simulado')vSim();else if(h==='erros')vErros();else vCron();
  header();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
</script>

</body>
